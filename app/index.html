  // ------------------------------------------------------ corner search
  // Accents and punctuation ignored, initials joined: "R.J. Harris", "R. J. Harris" and "RJ Harris" all read "rj harris".
  const fold = (x) => String(x).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[^a-z0-9]+/g, " ").replace(/\b([a-z])\s+(?=[a-z]\b)/g, "$1").trim();
  const cb = { input: null, items: [], active: -1 };
  function searchFighters(q) {
    const t = fold(q.trim());
    if (!t) return [];
    const words = t.split(/\s+/);
    const hits = [];
    for (const e of state.search) {
      let best = -1;
      for (const k of e.keys) {
        if (!words.every((w) => k.includes(w))) continue;
        // Exact, then name start, then word start, then anywhere; proven fighters first within a tier.
        const sc = k === t ? 3 : k.startsWith(t) ? 2 : k.split(/[\s-]+/).some((p) => p.startsWith(words[0])) ? 1 : 0;
        best = Math.max(best, sc);
      }
      if (best >= 0) hits.push([best, e.f.proven || 0, e]);
    }
    hits.sort((x, y) => y[0] - x[0] || y[1] - x[1]);
    return hits.slice(0, 8).map((h) => h[2]);
  }
  function cbList(input) { return document.getElementById(input.getAttribute("aria-controls")); }
  function cbClose() {
    if (!cb.input) return;
    const ul = cbList(cb.input);
    if (ul) { ul.hidden = true; ul.innerHTML = ""; }
    cb.input.setAttribute("aria-expanded", "false"); cb.input.removeAttribute("aria-activedescendant");
    cb.input = null; cb.items = []; cb.active = -1;
  }
  function cbOpen(input) {
    const ul = cbList(input);
    if (cb.input && cb.input !== input) cbClose();
    cb.input = input; cb.items = searchFighters(input.value); cb.active = cb.items.length ? 0 : -1;
    const id = input.id.slice(-1);
    ul.innerHTML = cb.items.length ? cb.items.map((e, i) => {
      const f = e.f, q = fold(input.value.trim());
      const aka = !fold(f.name).includes(q.split(/\s+/)[0]) && e.aka.find((x) => fold(x).includes(q.split(/\s+/)[0]));
      return `<li role="option" id="cbo-${id}-${i}" data-cb-pick="${esc(f.name)}" aria-selected="${i === cb.active}">
        <span class="cb-name">${esc(f.name)}${aka ? ` <span class="muted">“${esc(aka)}”</span>` : ""}</span>
        <span class="cb-meta num">${esc(f.weight_class || "—")} · ${record(f)}</span></li>`;
    }).join("") : `<li class="cb-empty">No fighter matches “${esc(input.value.trim())}”</li>`;
    ul.hidden = !input.value.trim();
    input.setAttribute("aria-expanded", String(!ul.hidden));
    cbMark();
  }
  function cbMark() {
    if (!cb.input) return;
    const ul = cbList(cb.input);
    [...ul.querySelectorAll("[role=option]")].forEach((li, i) => li.setAttribute("aria-selected", String(i === cb.active)));
    const cur = ul.querySelector(`[role=option][aria-selected=true]`);
    if (cur) { cb.input.setAttribute("aria-activedescendant", cur.id); cur.scrollIntoView({ block: "nearest" }); }
    else cb.input.removeAttribute("aria-activedescendant");
  }
  function cbPick(input, name) {
    const side = input.id === "in-a" ? "a" : "b";
    input.value = name; cbClose();
    state.m[side] = name; render();
    const next = document.getElementById(side === "a" && !state.m.b ? "in-b" : input.id);
    if (next && side === "a" && !state.m.b) next.focus();
  }
  document.addEventListener("input", (e) => { if (e.target.id === "in-a" || e.target.id === "in-b") cbOpen(e.target); });
  document.addEventListener("focusin", (e) => { if ((e.target.id === "in-a" || e.target.id === "in-b") && e.target.value) e.target.select(); });
  document.addEventListener("keydown", (e) => {
    const t = e.target;
    if (t.id !== "in-a" && t.id !== "in-b") return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (cb.input !== t) cbOpen(t);
      if (!cb.items.length) return;
      e.preventDefault();
      cb.active = (cb.active + (e.key === "ArrowDown" ? 1 : -1) + cb.items.length) % cb.items.length;
      cbMark();
    } else if (e.key === "Enter") {
      if (cb.input === t && cb.active >= 0) { e.preventDefault(); cbPick(t, cb.items[cb.active].name); }
    } else if (e.key === "Escape") {
      if (cb.input === t) { e.preventDefault(); cbClose(); t.value = state.m[t.id === "in-a" ? "a" : "b"] || ""; }
    }
  });
  // mousedown so the pick lands before the input loses focus.
  document.addEventListener("mousedown", (e) => {
    const li = e.target.closest && e.target.closest("[data-cb-pick]");
    if (li && cb.input) { e.preventDefault(); cbPick(cb.input, li.dataset.cbPick); }
  });
  document.addEventListener("focusout", (e) => { if (cb.input && e.target === cb.input) setTimeout(() => { if (cb.input && document.activeElement !== cb.input) cbClose(); }, 0); });

  // ------------------------------------------------------------------- boot
  async function boot() {
    let data;
    try {
      const res = await fetch("data.json");
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
    } catch (err) {
      $("#view").innerHTML = `<div class="empty">Couldn't load <code>data.json</code>. Run <code>python -m mma_predictor export</code> to build it, then reload.</div>`;
      return;
    }
    state.data = data;
    state.engine = MMAEngine.makeEngine(data);
    const IN = data.intangibles || { keys: [], labels: {}, help: {} };
    INTANG_ATTRS = {};  // intangibles are your 1-10 scores per matchup (tale of the tape), not fighter attributes
    RATING_ATTRS = Object.fromEntries(Object.values(data.rating_categories).flat().map((k) => [k, { k: "r_" + k, label: data.rating_labels[k], kind: "int", better: "high", rating: true }]));
    data.fighters.forEach((f) => state.byName.set(f.name, f));
    state.search = data.fighters.map((f) => ({ name: f.name, keys: [f.name, ...(f.aka || [])].map(fold).flatMap((k) => [k, k.replace(/ /g, "")]), aka: f.aka || [], f }));
    state.tab = ls.get(LOCAL_KEY + ":tab") || "card";
    state.cardView = ls.get(LOCAL_KEY + ":cardView") || "upcoming";
    state.m.a = data.fighters[0] && data.fighters[0].name;
    state.m.b = data.fighters[1] && data.fighters[1].name;
    state.recapNotes = ls.get(LOCAL_KEY + ":recapNotes") || {};
    state.recapReviews = {};
    state.sugg = ls.get(LOCAL_KEY + ":suggestions") || {};
    state.follows = new Set(ls.get(LOCAL_KEY + ":follows") || []);
    state.recapCanEdit = true;  // this browser only, until the page database answers
    state.store = localStore();
    render();

    const db = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db").catch(() => null) : null;
    if (db) {
      state.recapNotes = {};
      state.sugg = {};
      state.recapCanEdit = false;
      state.store = dbStore(db); state.storeKind = "db";
      window.claude.use("user").then(async (u) => {
        state.recapCanEdit = !!(u && u.isOwner()); renderSoon();
        const uid = u ? await u.id() : null;
        if (!uid) return;
        // Stars live in the viewer's private space; this browser's stars carry over the first time.
        const ref = db.doc("data/users/" + uid + "/follows");
        let first = true;
        ref.onSnapshot((d) => {
          const remote = d.exists ? (d.data().urls || []) : [];
          if (first && !d.exists && state.follows.size) { first = false; state.followDoc = ref; saveFollows(); return; }
          first = false; state.followDoc = ref;
          state.follows = new Set(remote); ls.set(LOCAL_KEY + ":follows", remote); renderSoon();
        }, () => {});
      }).catch(() => {});
      state.picks.fromDb = true;
      startLeague(db);
      // The database is the source of truth once it answers.
      state.adj = { fighters: {}, matchups: {}, weights: {} };
      render();
    } else {
      // No page database in this view: a local ai_picks.json (preview) if there is one.
      fetch("scouting.json").then((r) => (r.ok ? r.json() : null)).then((docs) => { if (docs) setScout(docs); }).catch(() => {});
      fetch("ai_picks.json").then((r) => (r.ok ? r.json() : null)).then((docs) => {
        if (docs) setPicks(docs); else { state.picks.loaded = true; state.picks.noDb = true; render(); }
      }).catch(() => { state.picks.loaded = true; state.picks.noDb = true; render(); });
    }
  }
  boot();
})();
</script>
