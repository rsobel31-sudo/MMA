<title>MMA Fight Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
/* Look: Fight Bill. A classic boxing poster: cream paper, black ink, slab-serif billing, condensed caps for labels, heavy rules, square corners. Red and blue corners keep their meaning. Dark mode prints the same bill on black. */
:root {
  --bg: #efe3c4;
  --surface: #f6edd5;
  --surface-2: #e7d9b3;
  --ink: #1c1a17;
  --muted: #4a4438;
  --line: #b9a97e;
  --rule: #1c1a17;
  --red: #b3261e;
  --red-soft: #efcfc3;
  --blue: #1e3a6d;
  --blue-soft: #d2d8e0;
  --edit: #855600;
  --edit-soft: #ead9a6;
  --good: #2b6a3c;
  --focus: #1e3a6d;
  --masthead: #1c1a17;
  --mast-ink: #efe3c4;
  --mast-muted: #cfc3a4;
  --shadow: none;
  --display: "Alfa Slab One", "Rockwell", Georgia, serif;
  --cond: "Oswald", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f; --surface: #1f1c16; --surface-2: #2a261e; --ink: #efe3c4; --muted: #b6aa88; --line: #4a4336; --rule: #efe3c4;
    --red: #e45a4d; --red-soft: #3e1d18; --blue: #8fa9da; --blue-soft: #1b2537; --edit: #e1b052; --edit-soft: #3a2e14;
    --good: #6cbf84; --focus: #8fa9da; --masthead: #0b0a08; --mast-ink: #efe3c4; --mast-muted: #a99d7d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15130f; --surface: #1f1c16; --surface-2: #2a261e; --ink: #efe3c4; --muted: #b6aa88; --line: #4a4336; --rule: #efe3c4;
  --red: #e45a4d; --red-soft: #3e1d18; --blue: #8fa9da; --blue-soft: #1b2537; --edit: #e1b052; --edit-soft: #3a2e14;
  --good: #6cbf84; --focus: #8fa9da; --masthead: #0b0a08; --mast-ink: #efe3c4; --mast-muted: #a99d7d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.label { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 12.5px; color: var(--muted); }
.muted { color: var(--muted); }

/* Header + tabs */
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; padding-block: 4px 12px; }
header.top h1 { font-size: 30px; text-transform: uppercase; }
header.top h1 span { color: var(--red); }
.meta { font-size: 13px; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--line); overflow-x: auto; margin-bottom: 18px; }
nav.tabs button { background: none; border: 0; padding: 10px 14px 8px; font-family: var(--display); font-weight: 600; font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
nav.tabs .count { font-family: var(--body); font-size: 12px; background: var(--edit-soft); color: var(--edit); border-radius: 9px; padding: 0 6px; margin-left: 4px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
.stack { display: grid; gap: 16px; }
.stack > * { min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 4px; padding: 6px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.small { padding: 3px 8px; font-size: 13px; }
.btn.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; }
input[type="text"], input[type="number"], input[type="search"], textarea, select { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; min-width: 0; }
textarea { width: 100%; resize: vertical; min-height: 56px; }

/* Matchup setup */
.setup { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; }
.corner { display: grid; gap: 4px; min-width: 0; }
.corner input { width: 100%; font-family: var(--display); font-weight: 600; font-size: 20px; padding: 6px 10px; }
.corner.red input { border-left: 5px solid var(--red); }
.corner.blue input { border-left: 5px solid var(--blue); }
.cb { position: relative; display: block; }
.pr-table td { vertical-align: top; }
.pr-detail td.num { white-space: nowrap; }
.pr-row:hover td { background: var(--surface-2); }
.pr-open > td { background: var(--surface-2); padding: 12px 14px; }
.pr-cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }
.pr-detail .rbar { grid-template-columns: minmax(0, 11em) 1fr 3em; }
@media (max-width: 800px) { .pr-cols { grid-template-columns: 1fr; } }
.mp-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; margin-top: 12px; }
.mp-side { position: sticky; top: 12px; }
.mp-bout { border-top: 1px solid var(--line); padding: 12px 0; }
.mp-bout:first-child { border-top: 0; padding-top: 0; }
.mp-bout-hd { margin-bottom: 8px; }
.mp-ml { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mp-props { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; margin-top: 8px; }
.mp-bout details > summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-top: 8px; }
.odds-btn { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 10px; font: 500 13px var(--body); color: var(--ink); cursor: pointer; text-align: left; }
.odds-btn.big { padding: 10px 12px; font-size: 14.5px; }
.odds-btn:hover { border-color: var(--ink); }
.odds-btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mp-slip { background: var(--surface-2); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.mp-legs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.mp-legs li { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; font-size: 13.5px; }
.mp-stake { display: grid; gap: 6px; font-size: 13.5px; }
.mp-stake input { width: 110px; }
.mp-msg { margin: 0; font-size: 13px; color: var(--edit); }
.mp-lb tr.mp-me td { background: var(--edit-soft); }
.mp-lb tr.mp-ai td { font-style: italic; }
@media (max-width: 800px) { .mp-grid { grid-template-columns: 1fr; } .mp-side { position: sticky; bottom: 8px; top: auto; order: 2; } }
.sc-read { background: var(--surface-2); border-radius: 14px; padding: 14px 16px; }
.sc-read p { margin: 8px 0 0; font-size: 14.5px; line-height: 1.5; }
.sc-read-hd { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.sc-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sc-name { margin: 0 0 6px; font-size: 17px; }
.sc-summary { margin: 0 0 8px; font-size: 14.5px; line-height: 1.5; }
.sc-report details > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.sc-how { margin: 8px 0; display: grid; gap: 6px; }
.sc-how dt { font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sc-how dd { margin: 0 0 4px; font-size: 14px; line-height: 1.5; }
.sc-lists { display: grid; gap: 8px; }
.sc-src { font-size: 12px; margin: 8px 0 0; }
.sc-chip { font-size: 11.5px; }
.pk-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.pk-stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.pk-big { font-family: var(--display); font-size: 28px; font-weight: 600; margin: 2px 0; }
.pk-note { background: var(--surface-2); border-radius: 12px; padding: 10px 14px; margin: 10px 0 12px; }
.pk-note p { margin: 4px 0 0; font-size: 14.5px; line-height: 1.5; }
.pk-why { font-size: 12.5px; color: var(--muted); margin-top: 4px; max-width: 60ch; }
.pk-bets td { vertical-align: top; }
.pk-pass { margin: 8px 0 0; }
.pk-alert { background: var(--red); color: #fff; border-radius: 14px; padding: 14px 18px; font-size: 15px; }
.count.alert { background: var(--red); color: #fff; }
.pk-curve { width: 100%; max-width: 760px; height: auto; display: block; }
.pk-table th, .pk-table td { text-align: left; }
.pk-table th.num, .pk-table td.num { text-align: right; }
.pk-line { fill: none; stroke: var(--ink); stroke-width: 2.5; }
.pk-dot { fill: var(--red); }
.pk-base { stroke: var(--line); stroke-dasharray: 4 4; }
.pk-axis { font-size: 13px; fill: var(--muted); font-family: var(--body); }
@media (max-width: 640px) {
  .pk-axis { font-size: 22px; }
  .pk-bets thead { display: none; }
  .pk-bets tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .pk-bets td { border: 0; padding: 0; text-align: left !important; }
  .pk-bets td:first-child { grid-column: 1 / -1; }
  .pk-bets td[data-l]::before { content: attr(data-l); display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
}
.cb-list { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.14); max-height: 340px; overflow-y: auto; }
.cb-list li { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 15px; }
.cb-list li[aria-selected=true] { background: var(--red-soft, rgba(0,0,0,.06)); }
.corner.blue .cb-list li[aria-selected=true] { background: var(--blue-soft, rgba(0,0,0,.06)); }
.cb-list .cb-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cb-list .cb-meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; flex-shrink: 0; }
.cb-list .cb-empty { color: var(--muted); cursor: default; }
.vs { font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--muted); padding-bottom: 8px; }
.options { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.odds { display: inline-flex; gap: 6px; align-items: center; }
.odds input { width: 96px; }

/* Verdict */
.verdict { display: grid; gap: 12px; }
.names { display: flex; justify-content: space-between; gap: 12px; }
.names h2 { font-size: clamp(22px, 4vw, 34px); text-transform: uppercase; line-height: 1.05; min-width: 0; overflow-wrap: anywhere; }
.names .a { color: var(--red); }
.names .b { color: var(--blue); text-align: right; }
.probbar { display: flex; height: 44px; border-radius: 4px; overflow: hidden; font-family: var(--display); font-weight: 700; font-size: 22px; }
.probbar div { display: flex; align-items: center; padding-inline: 12px; color: #fff; min-width: 0; transition: flex-basis .25s ease; }
.probbar .pa { background: var(--red); }
.probbar .pb { background: var(--blue); justify-content: flex-end; }
.verdict-line { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.pill { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.pill.edit { background: var(--edit-soft); color: var(--edit); border-color: transparent; }
.pill.warn { background: var(--edit-soft); color: var(--edit); border-color: transparent; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }

/* Method breakdown */
.methods { display: grid; gap: 8px; }
.mrow { display: grid; grid-template-columns: 88px 1fr 48px; gap: 8px; align-items: center; font-size: 14px; }
.mtrack { height: 14px; background: var(--surface-2); border-radius: 2px; position: relative; }
.mtrack div { position: absolute; inset: 0 auto 0 0; border-radius: 2px; }
.mhead { font-family: var(--display); font-weight: 600; font-size: 15px; margin-top: 4px; }

/* Factors (diverging) */
.factors { display: grid; gap: 5px; }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(90px, 1.1fr) 46px; gap: 8px; align-items: center; font-size: 13.5px; }
.fbar { position: relative; height: 12px; }
.fbar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.fbar div { position: absolute; top: 0; bottom: 0; border-radius: 1px; }
.faxis { display: grid; grid-template-columns: minmax(0, 1fr) minmax(90px, 1.1fr) 46px; gap: 8px; font-size: 12px; color: var(--muted); }
.faxis span:nth-child(2) { display: flex; justify-content: space-between; }

/* Tale of the tape */
.tape-wrap { overflow-x: auto; }
table.tape { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tape th, table.tape td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
button.info { background: none; border: 0; padding: 0 3px; margin: 0; font: inherit; font-size: 13px; line-height: 1; color: var(--muted); cursor: pointer; border-radius: 50%; }
button.info:hover, button.info:focus-visible { color: var(--ink); background: var(--surface-2); }
svg.spark { vertical-align: middle; color: var(--muted); }
.mv-a { color: var(--red); } .mv-b { color: var(--blue); }
.edge { font-size: 12px; font-weight: 600; color: var(--edit); }
dl.srcs { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 8px 0 0; font-size: 14px; }
dl.srcs dt { color: var(--muted); } dl.srcs dd { margin: 0; }
dialog.info-dlg { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 18px 20px; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow: auto; }
dialog.info-dlg::backdrop { background: rgba(10, 14, 20, .45); }
dialog.info-dlg h3 { font-size: 22px; margin: 0 28px 6px 0; }
dialog.info-dlg .close { position: absolute; top: 10px; right: 10px; }
dialog.info-dlg dl { margin: 10px 0 0; }
dialog.info-dlg dt { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; font-size: 13px; color: var(--muted); margin-top: 12px; }
dialog.info-dlg dd { margin: 3px 0 0; }
dialog.info-dlg .vals { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14px; }
dialog.info-dlg .vals .a { color: var(--red); font-weight: 600; } dialog.info-dlg .vals .b { color: var(--blue); font-weight: 600; }
table.tape td.attr { text-align: center; color: var(--muted); font-size: 13px; white-space: nowrap; }
table.tape td.va { text-align: right; }
table.tape td.vb { text-align: left; }
table.tape th { font-family: var(--display); font-size: 17px; text-transform: uppercase; }
table.tape th.a { color: var(--red); text-align: right; }
table.tape th.b { color: var(--blue); text-align: left; }
.cell { display: inline-flex; align-items: center; gap: 4px; }
.cell input { width: 74px; text-align: right; padding: 3px 6px; font-variant-numeric: tabular-nums; }
td.vb .cell input { text-align: left; }
.cell.edited input { background: var(--edit-soft); border-color: var(--edit); }
.cell .unit { color: var(--muted); font-size: 12px; }
.cell .reset { visibility: hidden; border: 0; background: none; color: var(--edit); cursor: pointer; padding: 0 2px; font-size: 13px; }
.cell.edited .reset { visibility: visible; }
.better { font-weight: 600; }
table.tape tr.group td { padding-top: 16px; font-family: var(--display); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: .06em; text-align: center; border-bottom: 2px solid var(--ink); }
table.tape tr.group td span { display: block; font-family: var(--body); font-weight: 400; font-size: 12px; text-transform: none; letter-spacing: 0; color: var(--muted); }
table.tape tr.cat td { background: var(--surface-2); font-size: 15px; }
table.tape tr.cat td.attr { color: var(--ink); }
.catval .muted { font-size: 12px; font-weight: 400; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: var(--muted); }
.filters label { display: inline-flex; align-items: center; gap: 5px; }
.filters select, .filters input { font-size: 13.5px; color: var(--ink); }
.filters input[type="number"] { width: 64px; }
.filters input[type="search"] { flex: 1 1 200px; }
.filters .check input { accent-color: var(--ink); }
button.sorter { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
button.sorter:hover { color: var(--ink); }
.classes { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.wc { border: 1px solid var(--line); border-radius: 6px; padding: 12px; min-width: 0; }
.wc-hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.wc-hd h3 { font-size: 18px; text-transform: uppercase; }
.wc-hd span { font-size: 12px; }
.wc ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13.5px; }
.wc li { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) 24% 5.2em; gap: 6px; align-items: center; cursor: pointer; }
.wc li .uf { display: inline-block; min-width: 2.2em; margin-left: 4px; font-size: 11px; color: var(--muted); text-align: left; }
.wc li:hover .nm { text-decoration: underline; }
.wc li .rk { color: var(--muted); text-align: right; }
.wc li .wmv { display: inline-block; min-width: 2.6em; margin-left: 5px; text-align: left; }
.wc li .wmv .mv { font-size: 11px; }
.wc li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wc li .bar { height: 8px; background: var(--surface-2); border-radius: 2px; position: relative; }
.wc li .bar span { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 2px; opacity: .7; }
.wc li .v { text-align: right; }
details.more-filters > summary { cursor: pointer; font-size: 13px; color: var(--muted); }
@media (min-width: 821px) { details.more-filters > summary { display: none; } }
button.namelink { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; text-align: inherit; cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); }
button.namelink:hover { text-decoration-color: currentColor; }
.profile-hd { display: grid; gap: 8px; }
.profile-hd p { margin: 0; }
.ph-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.ph-main h2 { font-size: clamp(28px, 5vw, 42px); text-transform: uppercase; line-height: 1; }
.ph-record { font-family: var(--display); font-weight: 600; font-size: 24px; color: var(--muted); }
.ph-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.prose p { margin: 0 0 10px; max-width: 68ch; line-height: 1.55; }
.prose h3 { margin-bottom: 8px; }
.rbars { display: grid; gap: 4px; margin-top: 8px; }
.rbar { display: grid; grid-template-columns: minmax(0, 9.5em) 1fr 3em; gap: 8px; align-items: center; font-size: 13px; }
.rbar.strong { font-weight: 600; font-size: 14px; margin-top: 6px; }
.rbar .track { position: relative; height: 10px; background: var(--surface-2); border-radius: 2px; }
.rbar .track b { position: absolute; inset: 0 auto 0 0; background: var(--muted); border-radius: 2px; }
.rbar.strong .track b { background: var(--ink); }
.rbar .track .med { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--red); z-index: 1; }
.rbar > .num { text-align: right; }
ul.journal { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ul.journal li { border-left: 3px solid var(--edit); padding-left: 10px; }
ul.journal .jt { white-space: pre-wrap; }
.evtabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.evtabs button { flex: 0 0 auto; display: grid; gap: 2px; text-align: left; min-width: 150px; max-width: 220px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; font-size: 13px; }
.evtabs button strong { font-family: var(--display); font-size: 15px; line-height: 1.15; white-space: normal; }
.evtabs button[aria-selected="true"] { border-color: var(--ink); box-shadow: inset 0 -3px 0 var(--ink); }
table.bouts td { vertical-align: middle; }
.mini { display: inline-block; width: 90px; height: 10px; background: var(--blue); border-radius: 2px; position: relative; overflow: hidden; vertical-align: middle; }
.mini i { position: absolute; inset: 0 auto 0 0; background: var(--red); }
.tier { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 9px; margin-top: 3px; white-space: nowrap; }
.tier-best { background: var(--good); color: var(--surface); }
.tier-sure { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
.tier-watch { background: var(--edit-soft); color: var(--edit); }
.tier-caution { background: var(--surface-2); color: var(--edit); border: 1px solid var(--edit-soft); }
.tier-toss { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
tr.hl-best td { background: color-mix(in srgb, var(--good) 7%, transparent); }
tr.hl-watch td { background: color-mix(in srgb, var(--edit) 7%, transparent); }
.partial { font-size: 12px; color: var(--edit); margin-top: 3px; }
ul.hltags { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 2px; font-size: 12px; }
ul.hltags li::before { content: "● "; }
ul.hltags .k-sure::before, ul.hltags .k-backed::before { color: var(--good); }
ul.hltags .k-upset::before, ul.hltags .k-caution::before { color: var(--edit); }
ul.hltags .k-info::before, ul.hltags .k-toss::before { color: var(--muted); }
span.verdict { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 9px; background: var(--surface-2); white-space: nowrap; }
.verdict.v-model-underrates, .verdict.v-model-overrates { background: var(--edit-soft); color: var(--edit); font-weight: 600; }
.verdict.v-leaning-underrated, .verdict.v-leaning-overrated { color: var(--edit); }
.verdict.v-well-calibrated { color: var(--good); }
.bg p { margin: 0 0 6px; }
.bg ul { margin: 0 0 6px; padding-left: 0; list-style: none; display: grid; gap: 4px; font-size: 13.5px; }
.bg a, .notes a { color: var(--blue); }
.judge { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; background: var(--edit-soft); border-radius: 4px; font-size: 13px; }
.judge input[type="text"] { flex: 1 1 200px; }

.notes { display: grid; gap: 6px; padding-left: 18px; margin: 0; }
.notes li.mine { color: var(--edit); }
.nostats { font-size: 13px; background: var(--edit-soft); color: var(--edit); padding: 8px 10px; border-radius: 4px; }

.read { display: grid; gap: 8px; }
.read input[type="range"] { width: 100%; accent-color: var(--ink); }
.readscale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.fnotes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fnote { display: grid; gap: 6px; }
.fnote .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.elo-nudge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.elo-nudge input { width: 70px; }

.recent { width: 100%; border-collapse: collapse; font-size: 13px; }
.recent td { padding: 3px 4px; border-bottom: 1px solid var(--line); }
.res-W { color: var(--good); font-weight: 600; }
.res-L { color: var(--red); font-weight: 600; }

/* Tables for card/roster/adjustments */
.table-wrap { overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
table.list th { text-align: left; font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; font-size: 13px; color: var(--muted); padding: 6px 8px; border-bottom: 2px solid var(--line); white-space: nowrap; }
table.list td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.list tr.clickable { cursor: pointer; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.toolbar input[type="search"] { flex: 1 1 220px; }

.weights { display: grid; gap: 10px; }
.wrow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(120px, 2fr) 60px 70px; gap: 10px; align-items: center; font-size: 14px; }
.wrow input[type="range"] { width: 100%; accent-color: var(--ink); }
.wrow.edited .wv { color: var(--edit); font-weight: 600; }
.status { font-size: 13px; color: var(--muted); min-height: 1.2em; }
.empty { padding: 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; }
pre.json { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 10px; overflow: auto; max-height: 280px; font-size: 12.5px; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }

@media (max-width: 820px) {
  .grid2, .fnotes { grid-template-columns: 1fr; }
  .setup { grid-template-columns: 1fr; }
  .vs { padding: 0; text-align: center; }
  .wrow { grid-template-columns: 1fr 60px 64px; }
  .wrow .wname { grid-column: 1 / -1; }
  table.tape { font-size: 13px; }
  table.tape th, table.tape td { padding: 4px 2px; }
  table.tape td.attr { white-space: normal; font-size: 12px; line-height: 1.2; }
  .cell input { width: 54px; padding: 3px 4px; }
  .cell .unit { display: none; }
  .elo-nudge { flex-direction: column; align-items: stretch; gap: 0; font-size: 11px; }
  .elo-nudge input { width: 54px; }
}
@media (prefers-reduced-motion: reduce) { .probbar div { transition: none; } }

/* ---- Fight Bill theme layer: overrides the base component styles above ---- */
body { font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; padding-inline: 24px; padding-block: 28px 72px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; letter-spacing: .01em; text-transform: uppercase; }
h3 { font-size: 22px; }
.label { font-family: var(--cond); font-weight: 500; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

/* Masthead: the black bar across the top of the bill */
.masthead { background: var(--masthead); color: var(--mast-ink); border-bottom: 6px double var(--red); }
.mast-in { max-width: 1240px; margin: 0 auto; padding-inline: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 28px; }
header.top { display: flex; flex-direction: column; gap: 0; padding-block: 10px 8px; border: 0; margin: 0; }
header.top h1 { font-size: 30px; color: var(--mast-ink); display: flex; align-items: center; gap: 10px; letter-spacing: .02em; }
header.top h1 span { color: var(--red); }
header.top .tagline { font-family: var(--body); font-style: italic; font-size: 13.5px; color: var(--mast-muted); }
.navbar { display: flex; align-items: stretch; gap: 0; margin: 0; flex: 1 1 520px; min-width: 0; }
nav.tabs { display: flex; gap: 0; margin: 0; padding: 0; background: none; border: 0; border-radius: 0; overflow-x: auto; min-width: 0; }
nav.tabs button, .more-btn { font-family: var(--cond); font-weight: 500; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--mast-muted); background: none; border: 0; border-radius: 0; padding: 18px 14px 14px; margin: 0; border-bottom: 4px solid transparent; cursor: pointer; white-space: nowrap; }
nav.tabs button:hover, .more-btn:hover { color: var(--mast-ink); }
nav.tabs button[aria-selected="true"], .more-btn.active { color: var(--mast-ink); background: none; border-bottom-color: var(--red); }
nav.tabs .count, .more-btn .count, .more-menu .count { font-family: var(--cond); font-size: 12px; letter-spacing: 0; border-radius: 0; background: var(--red); color: #fff; padding: 0 5px; margin-left: 4px; }
.more { position: relative; margin-left: auto; flex-shrink: 0; display: flex; }
.more-btn { display: inline-flex; align-items: center; gap: 6px; }
.more-btn svg { transition: transform .15s; }
.more-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.more-menu { position: absolute; right: 0; top: 100%; z-index: 40; min-width: 230px; padding: 4px; background: var(--surface); border: 3px solid var(--rule); border-radius: 0; box-shadow: 6px 6px 0 rgba(0,0,0,.25); display: grid; gap: 0; }
.more-menu[hidden] { display: none; }
.more-menu button { text-align: left; background: none; border: 0; border-bottom: 1px dotted var(--line); border-radius: 0; padding: 10px 12px; font: 500 15px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.more-menu button:last-child { border-bottom: 0; }
.more-menu button:hover, .more-menu button:focus-visible { background: var(--surface-2); outline: none; }
.more-menu button[aria-current="page"] { color: var(--red); }
.more-menu button[aria-current="page"]::after { content: "★"; }

/* Panels are ticket stubs: square, ink-ruled, no shadow */
.panel { background: var(--surface); border: 3px solid var(--rule); border-radius: 0; padding: 22px 24px; box-shadow: none; }
.stack { gap: 22px; }
.grid2 { gap: 22px; }
.btn { font-family: var(--cond); font-weight: 500; letter-spacing: .12em; text-transform: uppercase; font-size: 14px; border: 2px solid var(--rule); border-radius: 0; background: var(--surface); padding: 7px 14px; }
.btn:hover { background: var(--rule); color: var(--bg); border-color: var(--rule); }
.btn.primary { background: var(--rule); color: var(--bg); border-color: var(--rule); }
.btn.primary:hover { background: var(--red); border-color: var(--red); color: #fff; }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn.link { font-family: var(--body); letter-spacing: 0; text-transform: none; border: 0; }
.btn.link:hover { background: none; color: var(--red); }
input[type="text"], input[type="number"], input[type="search"], textarea, select { border: 2px solid var(--line); border-radius: 0; padding: 8px 10px; background: var(--surface); }
input:focus, textarea:focus, select:focus { border-color: var(--rule); }
.corner input { font-family: var(--display); font-weight: 400; font-size: 24px; padding: 10px 14px; border-left-width: 8px; text-transform: uppercase; }
.vs { font-family: var(--body); font-style: italic; font-weight: 400; font-size: 28px; color: var(--ink); }
.seg { border: 2px solid var(--rule); border-radius: 0; }

.seg button[aria-pressed="true"] { background: var(--rule); color: var(--bg); }
.names h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(26px, 4.4vw, 48px); line-height: 1; letter-spacing: .01em; }
.probbar { border-radius: 0; height: 50px; font-family: var(--display); font-weight: 400; font-size: 22px; border: 3px solid var(--rule); }
.probbar div { padding-inline: 16px; }
.pill { font-family: var(--cond); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; border-radius: 0; border: 1px solid var(--rule); background: transparent; padding: 1px 7px; font-size: 12px; }
.pill.edit, .pill.warn { border-color: var(--edit); }
.verdict-line .pill.num { font-size: 13px; padding: 4px 10px; }
.mtrack, .mtrack div, .rbar .track, .rbar .track b, .wc li .bar, .wc li .bar span, .fbar div, .mini { border-radius: 0; }
.mhead { font-family: var(--cond); font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
table.tape th { font-family: var(--display); font-weight: 400; font-size: 21px; text-transform: uppercase; }
table.tape th, table.tape td { padding: 7px 8px; }
table.tape tr.group td { font-family: var(--cond); font-size: 14px; font-weight: 500; letter-spacing: .2em; padding-top: 22px; border-bottom: 3px double var(--rule); }
table.tape tr.group td span { font-family: var(--body); letter-spacing: 0; }
table.list th { font-family: var(--cond); font-weight: 500; font-size: 13px; letter-spacing: .14em; color: var(--ink); border-bottom: 3px solid var(--rule); }
table.list td { padding-block: 11px; border-bottom: 1px solid var(--line); }
table.list tr.clickable:hover td, .pr-row:hover td { background: var(--surface-2); }
.wc { border: 3px solid var(--rule); border-radius: 0; background: var(--surface); }
.wc-hd { border-bottom: 3px double var(--rule); padding-bottom: 6px; margin-bottom: 8px; }
.wc-hd h3 { font-family: var(--display); font-size: 20px; }
.wc li .bar span { background: var(--red); opacity: .85; }
.ph-main h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: .01em; font-size: clamp(34px, 5.4vw, 64px); line-height: .95; }
.ph-record { font-family: var(--cond); font-weight: 500; font-size: 26px; letter-spacing: .06em; color: var(--ink); }
.evtabs { gap: 0; border: 3px solid var(--rule); background: var(--surface); padding: 0; }
.evtabs button { border: 0; border-right: 1px solid var(--line); border-radius: 0; padding: 10px 14px; background: none; font-family: var(--cond); letter-spacing: .06em; }
.evtabs button strong { font-family: var(--display); font-weight: 400; font-size: 16px; text-transform: uppercase; letter-spacing: .01em; }
.evtabs button[aria-selected="true"] { background: var(--rule); color: var(--bg); box-shadow: none; }
.evtabs button[aria-selected="true"] .muted { color: var(--mast-muted); }
.tier, span.verdict { font-family: var(--cond); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; border-radius: 0; }
.nostats, .judge, .sc-read, .pk-note, .mp-slip { border-radius: 0; }
.sc-read, .pk-note { border-left: 6px solid var(--red); }
.pk-stat { border: 3px solid var(--rule); border-radius: 0; background: var(--surface); }
.pk-big { font-family: var(--display); font-weight: 400; font-size: 32px; }
.pk-alert { border-radius: 0; border: 3px solid var(--rule); font-family: var(--cond); letter-spacing: .06em; }
.odds-btn { border: 2px solid var(--line); border-radius: 0; background: var(--surface); font-family: var(--cond); font-weight: 500; letter-spacing: .04em; }
.odds-btn:hover { border-color: var(--rule); }
.odds-btn.on { background: var(--rule); color: var(--bg); border-color: var(--rule); }
.cb-list { border: 3px solid var(--rule); border-radius: 0; box-shadow: 6px 6px 0 rgba(0,0,0,.2); }
.cb-list li { border-radius: 0; }
.empty { border: 2px dashed var(--line); border-radius: 0; font-style: italic; }
pre.json { border-radius: 0; }
dialog.info-dlg { border: 4px solid var(--rule); border-radius: 0; padding: 26px 28px; box-shadow: 10px 10px 0 rgba(0,0,0,.3); background: var(--surface); }
dialog.info-dlg h3 { font-size: 28px; }
dialog.info-dlg dt { font-family: var(--cond); font-weight: 500; font-size: 13px; letter-spacing: .14em; }
input.iscore { width: 76px; text-align: center; }
a { color: var(--ink); text-decoration-color: var(--line); text-underline-offset: 3px; }
a:hover { color: var(--red); text-decoration-color: currentColor; }
button.namelink:hover { color: var(--red); }

/* The bill: main-event billing at the top of a card */
.bill { text-align: center; padding: 30px 24px 26px; background: var(--surface); border: 3px solid var(--rule); outline: 1px solid var(--rule); outline-offset: 4px; margin: 4px; }
.bill-kicker { display: flex; align-items: center; gap: 16px; font-family: var(--cond); font-size: 14px; letter-spacing: .3em; text-transform: uppercase; }
.bill-kicker::before, .bill-kicker::after { content: ""; flex: 1; height: 3px; background: var(--rule); }
.bill-event { font-family: var(--display); font-size: clamp(44px, 8vw, 104px); line-height: .92; color: var(--red); margin: 14px 0 4px; text-transform: uppercase; overflow-wrap: anywhere; }
.bill-bout { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 18px; margin-top: 14px; }
.bill-name { font-family: var(--display); font-size: clamp(28px, 4.6vw, 58px); line-height: 1; text-transform: uppercase; overflow-wrap: anywhere; }
.bill-name.a { color: var(--red); text-align: right; } .bill-name.b { color: var(--blue); text-align: left; }
.bill-vs { font-family: var(--body); font-style: italic; font-size: 34px; }
.bill-odds { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 18px; font-family: var(--cond); font-size: 15px; letter-spacing: .08em; margin-top: 8px; }
.bill-odds > :first-child { text-align: right; } .bill-odds > :last-child { text-align: left; }
.bill-sub { font-family: var(--cond); font-size: 16px; letter-spacing: .2em; text-transform: uppercase; margin-top: 14px; }
.bill-read { max-width: 60ch; margin: 10px auto 0; font-size: 17px; }
.bill-rule { height: 6px; background: var(--rule); margin: 22px 0 3px; } .bill-rule + .bill-rule { height: 2px; margin: 0; }
.fw-side { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; align-items: stretch; }
.stub { background: var(--surface); border: 3px solid var(--rule); padding: 16px 18px; display: flex; flex-direction: column; }
.stub > .btn.link { margin-top: auto !important; padding-top: 8px; align-self: flex-start; }
.stub-hd { font-family: var(--cond); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--red); margin-bottom: 8px; }
.stub-row { display: flex; justify-content: space-between; gap: 10px; font-family: var(--cond); font-size: 18px; padding: 3px 0; }
.stub-foot { border-top: 2px dashed var(--rule); margin: 12px -18px 0; padding: 10px 18px 0; font-family: var(--display); font-size: 22px; }
.stub-duel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; }
.stub-big { font-family: var(--display); font-size: 28px; line-height: 1.1; }
.stub-btn { display: block; width: 100%; margin-top: 14px; padding: 10px; }
.cp-table td { vertical-align: top; }
.stub-links { margin-top: auto; padding-top: 8px; display: flex; gap: 16px; flex-wrap: wrap; }
.note-status { font-family: var(--cond); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border: 2px solid var(--line); }
.ns-saved { border-color: var(--good); color: var(--good); }
.ns-saving { border-color: var(--edit); color: var(--edit); }
.ns-failed { border-color: var(--red); color: #fff; background: var(--red); text-transform: none; letter-spacing: 0; font-family: var(--body); }
.mv { font-family: var(--cond); font-size: 12px; letter-spacing: .04em; white-space: nowrap; }
.mv-up { color: var(--good); } .mv-down { color: var(--red); } .mv-new { color: var(--edit); border: 1px solid var(--edit); padding: 0 4px; } .mv-flat { color: var(--muted); }
.fn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px 18px; }
.fn-bout textarea { width: 100%; margin-top: 4px; }
.pe-list { display: grid; gap: 0; }
.pe-bout { border-top: 1px solid var(--line); padding: 12px 0; display: grid; gap: 6px; }
.pe-bout:first-child { border-top: 0; padding-top: 0; }
.pe-line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pe-line .label { min-width: 4.5em; }
.pe-line .seg button { padding: 6px 12px; }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.stub-pro { display: flex; gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px dotted var(--line); }
.stub-pro strong { font-family: var(--cond); font-weight: 500; font-size: 17px; text-transform: uppercase; letter-spacing: .03em; }
.stub-rank { font-family: var(--display); font-size: 20px; min-width: 50px; }
@media (max-width: 640px) {
  .bill-bout, .bill-odds { grid-template-columns: 1fr; gap: 4px; }
  .bill-name.a, .bill-name.b, .bill-odds > * { text-align: center !important; }
}
@media (max-width: 760px) {
  .mast-in { padding-inline: 16px; }
  header.top { padding-block: 12px 0; }
  table.list.bouts { min-width: 760px; }
  .navbar { flex-basis: 100%; }
  nav.tabs button, .more-btn { padding: 12px 10px 10px; font-size: 13.5px; letter-spacing: .1em; }
}
@media (max-width: 600px) { .wrap { padding-inline: 16px; padding-top: 18px; } .panel { padding: 16px; } }
  .rc-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .rc-tile { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .rc-big { font-size: 26px; font-weight: 700; }
  td.rc-good { color: var(--good); font-weight: 600; }
  td.rc-bad { color: var(--red); }
  .sg-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .sg-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); }

  button.linklike:hover strong { text-decoration: underline; }
  .chip { display: inline-block; font-size: 11.5px; font-weight: 600; line-height: 1.5; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2, transparent); color: var(--ink); white-space: nowrap; vertical-align: 1px; }
  tr.rc-note td { background: var(--surface-2); font-size: 13.5px; }
  .sg-form { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
  .sg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 14px; }

<script src="engine.js"></script>
<script>
(function () {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slug = (s) => String(s).toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 120) || "x";
  const pct = (x, d = 1) => (x * 100).toFixed(d) + "%";
  const ls = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  };

  // Tale-of-the-tape rows. kind: pct (stored 0-1, shown 0-100), num, int.
  // help: what the number is and where it comes from (shown by the (i) buttons).
  const SHRUNK = "Shrunk toward the league average until there is enough evidence, so a short record stays near average.";
  const NEEDS_STATS = "From UFCStats per-fight stats, used only on bouts whose result a second source (Sherdog) confirms and dropped where StatsFight contradicts them. Fighters without UFC bouts have none, so this shows the league average (*).";
  const ATTRS = [
    { k: "ext_rating", label: "Fight Matrix rating", kind: "int", better: "high", outside: true, help: "Fight Matrix's own Glicko-1 rating for this fighter after their last bout (an independent computer ranking; Fight Matrix displays it 500 points lower than raw Glicko). The model's outside-rating factor compares the two fighters' ratings; it is 0 when either has none. Type over it if you think it's off." },
    { k: "age", label: "Age", kind: "num", d: 1, unit: "yrs", better: "low", help: "Age on fight night, from date of birth. Feeds the age curve (a penalty that grows past 32, and a small one under 24) and multiplies wear and tear past 30." },
    { k: "reach_cm", label: "Reach", kind: "num", d: 0, unit: "cm", better: "high", help: "Arm span in centimetres. The reach factor compares the two fighters per 10 cm; it matters most at range. Used only when two sources agree on it." },
    { k: "height_cm", label: "Height", kind: "num", d: 0, unit: "cm", better: "high", help: "Height in centimetres (Sherdog, checked against UFCStats). The height factor compares the two fighters per 10 cm." },
    { k: "fight_weight", label: "Fighting weight", kind: "num", d: 0, unit: "lb", better: "high", help: "The division this fighter has been competing at: the middle of their last few bouts' weight classes (heavyweight counted as 250 lb). The size factor compares the two fighters' fighting weights, so a heavyweight facing a lightweight gets a large edge. Learned from bouts where fighters moved up or down a division. Type over it for a fight at a different weight." },
    { k: "slpm", label: "Sig. strikes landed / min", kind: "num", d: 2, better: "high", stat: true, help: `Significant strikes landed per minute of cage time, adjusted for how hard each opponent was to hit. ${SHRUNK} ${NEEDS_STATS}` },
    { k: "sapm", label: "Sig. strikes absorbed / min", kind: "num", d: 2, better: "low", stat: true, help: `Significant strikes absorbed per minute, adjusted for each opponent's output. ${SHRUNK} ${NEEDS_STATS}` },
    { k: "sig_diff5", label: "Sig. strike differential / 5 min", kind: "num", d: 1, signed: true, better: "high", stat: true, help: `Significant strikes landed minus absorbed per minute, times 5: the margin per five-minute round. Positive means out-landing opponents. Editing it keeps the fighter's total output and moves the split between landed and absorbed, which feeds the striking exchange factor. ${NEEDS_STATS}` },
    { k: "str_acc", label: "Striking accuracy", kind: "pct", better: "high", stat: true, help: `Share of significant strikes thrown that land, adjusted for opponents' defence. ${SHRUNK} ${NEEDS_STATS}` },
    { k: "str_def", label: "Striking defence", kind: "pct", better: "high", stat: true, help: `Share of opponents' significant strikes that miss, adjusted for their accuracy. ${SHRUNK} ${NEEDS_STATS}` },
    { k: "kd_per15", label: "Knockdowns / 15 min", kind: "num", d: 2, better: "high", stat: true, help: `Knockdowns scored per 15 minutes. Feeds power vs chin and the KO/TKO chance. ${SHRUNK} ${NEEDS_STATS}` },
    { k: "td_per15", label: "Takedowns / 15 min", kind: "num", d: 2, better: "high", stat: true, help: `Takedowns landed per 15 minutes. Feeds the wrestling edge (against the opponent's takedown defence). ${SHRUNK} ${NEEDS_STATS}` },
    { k: "td_acc", label: "Takedown accuracy", kind: "pct", better: "high", stat: true, help: `Share of takedown attempts that land, adjusted for opponents' takedown defence. ${SHRUNK} ${NEEDS_STATS}` },
    { k: "td_def", label: "Takedown defence", kind: "pct", better: "high", stat: true, help: `Share of opponents' takedown attempts stopped, adjusted for their accuracy. ${SHRUNK} ${NEEDS_STATS}` },
    { k: "sub_per15", label: "Sub attempts / 15 min", kind: "num", d: 2, better: "high", stat: true, help: `Submission attempts per 15 minutes. Feeds submission threat (against the opponent's rate of losing by submission). ${SHRUNK} ${NEEDS_STATS}` },
    { k: "ctrl_share", label: "Control time share", kind: "pct", better: "high", stat: true, help: `Share of cage time spent in control (on top or on the back). Feeds the control factor. ${SHRUNK} ${NEEDS_STATS}` },
    { k: "ko_loss_rate", label: "Bouts lost by KO", kind: "pct", better: "low", help: `Share of bouts lost by KO/TKO. Fights in the last 18 months count fully; older ones fade (half weight every 2 years). ${SHRUNK} Feeds chin vulnerability.` },
    { k: "sub_loss_rate", label: "Bouts lost by sub", kind: "pct", better: "low", help: `Share of bouts lost by submission, recent fights weighted most. ${SHRUNK} Feeds the opponent's submission threat.` },
    { k: "recent_ko_losses", label: "KO losses, last 3", kind: "int", better: "low", help: "KO/TKO losses in the last three fights: a sign a chin may be going." },
    { k: "late_win_rate", label: "Win rate past R2", kind: "pct", better: "high", help: "Win rate in fights that reached round 3 or later, recent fights weighted most. Feeds the cardio factor, which counts more in five-round fights." },
    { k: "form", label: "Recent form (−1 to 1)", kind: "num", d: 2, better: "high", help: "Recency-weighted results: +1 is winning everything lately, −1 losing everything. Finishes count more than decisions." },
    { k: "streak", label: "Streak (+W / −L)", kind: "int", better: "high", help: "Current run: +3 is three straight wins, −2 two straight losses." },
    { k: "layoff_days", label: "Days since last fight", kind: "int", better: "low", help: "Days since the last bout. Ring rust starts counting after about 400 days and grows for each extra year." },
    { k: "sos", label: "Avg opponent rating", kind: "int", better: "high", help: "Strength of schedule: the average overall rating of opponents at the time they were fought." },
    { k: "minutes", label: "Cage time (in data)", kind: "num", d: 0, unit: "min", better: "low", wear: true, help: "Total minutes fought in the dataset. Part of the wear index (mileage)." },
    { k: "ko_losses", label: "KO/TKO losses (career)", kind: "int", better: "low", wear: true, help: "Career KO/TKO losses. The heaviest part of the wear index (damage)." },
    { k: "kd_absorbed", label: "Knockdowns absorbed", kind: "int", better: "low", wear: true, stat: true, help: `Career knockdowns suffered. Part of the wear index (damage). ${NEEDS_STATS}` },
    { k: "sig_absorbed", label: "Sig. strikes absorbed (total)", kind: "int", better: "low", wear: true, stat: true, help: `Career significant strikes absorbed. Part of the wear index (damage). ${NEEDS_STATS}` },
  ];
  const WEIGHT_RANGE = { overall: [0, 2.5] };
  // Sub-rating rows (r_<key>), built from data.json at boot.
  let RATING_ATTRS = {};
  let INTANG_ATTRS = {};
  const attrFor = (k) => ATTRS.find((x) => x.k === k) || Object.values(RATING_ATTRS).find((x) => x.k === k)
    || Object.values(INTANG_ATTRS).find((x) => x.k === k);

  const state = {
    data: null, engine: null, byName: new Map(),
    adj: { fighters: {}, matchups: {}, weights: {} }, card: [], commentary: [], judging: null, journal: [], profile: null,
    tab: "card",
    picks: { sub: "week", summary: null, weeks: [], loaded: false },
    cp: { sub: "card", summary: null, cards: [], ev: null },
    dwcs: { data: null, loading: false },
    scout: { reports: {}, reads: {}, board: null, loaded: false },
    pros: { data: null, loading: false, error: "", view: "classes", gender: "", wc: "", q: "", unbeaten: false, open: null },
    my: { pk: { sub: "card", docs: {}, standings: {}, lb: null, status: "", cardId: null }, sub: "bet", board: null, standings: {}, lb: null, bets: [], slip: [], stake: "", uid: null, db: null, user: null, names: {}, busy: false, msg: "", player: null, readOnly: false, loaded: false },
    m: { a: null, b: null, rounds: 3, oddsA: "", oddsB: "" },
    roster: { view: "classes", sort: "proven", dir: -1, ufcOnly: true, q: "", wc: "", gender: "", style: "", stance: "", nat: "", disc: "", ageMin: "", ageMax: "", minFights: "1", inferred: true },
    store: null, storeKind: "local",
  };

  // ------------------------------------------------------------------ store
  // Shared artifact database when available; browser storage otherwise.
  const LOCAL_KEY = "mma-fight-lab";
  function localStore() {
    const saved = ls.get(LOCAL_KEY) || {};
    const persist = () => ls.set(LOCAL_KEY, { adj: state.adj, card: state.card, commentary: state.commentary, journal: state.journal });
    if (saved.adj) state.adj = Object.assign({ fighters: {}, matchups: {}, weights: {} }, saved.adj);
    if (saved.card) state.card = saved.card;
    if (saved.commentary) state.commentary = saved.commentary;
    if (saved.journal) state.journal = saved.journal;
    return {
      kind: "local",
      async saveFighter() { persist(); }, async deleteFighter() { persist(); },
      async saveMatchup() { persist(); }, async deleteMatchup() { persist(); },
      async saveWeights() { persist(); },
      async saveCard() { persist(); }, async deleteCard() { persist(); },
      async saveComment() { persist(); }, async deleteComment() { persist(); },
      async saveJournal() { persist(); }, async deleteJournal() { persist(); },
      async saveRecapNote() { ls.set(LOCAL_KEY + ":recapNotes", state.recapNotes); },
      async saveSuggestion() { ls.set(LOCAL_KEY + ":suggestions", state.sugg); },
      async deleteSuggestion() { ls.set(LOCAL_KEY + ":suggestions", state.sugg); },
    };
  }
  function dbStore(db) {
    const writers = new Map();  // one write at a time per doc
    function write(path, fn) {
      pending.add(path);
      const prev = writers.get(path) || Promise.resolve();
      const next = prev.then(fn).then(() => true, (e) => { setStatus(`Couldn't save (${e && e.code || "error"}). Your change is kept on this page only.`); state.lastSaveError = (e && e.code) || "error"; return false; })
        .finally(() => { if (writers.get(path) === next) { writers.delete(path); pending.delete(path); } });
      writers.set(path, next);
      return next;
    }
    // Snapshots never clobber an edit that is still waiting to be written.
    const keep = (path) => pending.has(path) || debounced.has(path);
    db.collection("fighters").onSnapshot((snap) => {
      const f = {};
      snap.docs.forEach((d) => { const v = d.data(); if (v && v.name) f[v.name] = { elo: v.elo || 0, overrides: v.overrides || {}, note: v.note || "" }; });
      for (const [n, v] of Object.entries(state.adj.fighters)) if (keep("fighters/" + slug(n))) f[n] = v;
      for (const n of Object.keys(f)) if (keep("fighters/" + slug(n)) && !state.adj.fighters[n]) delete f[n];
      state.adj.fighters = f; renderSoon();
    }, () => {});
    db.collection("matchups").onSnapshot((snap) => {
      const m = {};
      snap.docs.forEach((d) => { const v = d.data(); if (v && v.a) m[d.id] = { a: v.a, b: v.b, logit: v.logit || 0, note: v.note || "", ...(v.intangibles ? { intangibles: v.intangibles } : {}) }; });
      for (const [id, v] of Object.entries(state.adj.matchups)) if (keep("matchups/" + id)) m[id] = v;
      for (const id of Object.keys(m)) if (keep("matchups/" + id) && !state.adj.matchups[id]) delete m[id];
      state.adj.matchups = m; renderSoon();
    }, () => {});
    db.doc("settings/weights").onSnapshot((d) => {
      if (keep("settings/weights")) return;
      state.adj.weights = (d.exists && d.data().weights) || {}; renderSoon();
    }, () => {});
    db.collection("journal").onSnapshot((snap) => {
      state.journal = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderSoon();
    }, () => {});
    db.collection("commentary").onSnapshot((snap) => {
      state.commentary = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderSoon();
    }, () => {});
    db.collection("scouting").onSnapshot((snap) => {
      setScout(snap.docs.map((d) => Object.assign({ _id: d.id }, d.data())));
    }, () => { state.scout.loaded = true; renderSoon(); });
    db.collection("ai_picks").onSnapshot((snap) => {
      const docs = snap.docs.map((d) => Object.assign({ _id: d.id }, d.data()));
      setPicks(docs);
    }, () => { state.picks.loaded = true; renderSoon(); });
    db.collection("recap_notes").onSnapshot((snap) => {
      const m = {};
      snap.docs.forEach((d) => { m[d.id] = keep("recap_notes/" + d.id) ? state.recapNotes[d.id] : d.data(); });
      for (const id of Object.keys(state.recapNotes)) if (keep("recap_notes/" + id) && !m[id]) m[id] = state.recapNotes[id];
      state.recapNotes = m; renderSoon();
    }, () => {});
    db.collection("prospect_suggestions").onSnapshot((snap) => {
      const m = {};
      snap.docs.forEach((d) => { m[d.id] = d.data(); });
      state.sugg = m; renderSoon();
    }, () => {});
    db.collection("recap_reviews").onSnapshot((snap) => {
      const m = {};
      snap.docs.forEach((d) => { m[d.id] = d.data(); });
      state.recapReviews = m; renderSoon();
    }, () => {});
    db.collection("card").orderBy("order").onSnapshot((snap) => {
      state.card = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderSoon();
    }, () => {});
    return {
      kind: "db",
      saveFighter(name, v) { return write("fighters/" + slug(name), () => db.doc("fighters/" + slug(name)).set({ name, elo: v.elo || 0, overrides: v.overrides || {}, note: v.note || "" })); },
      deleteFighter(name) { return write("fighters/" + slug(name), () => db.doc("fighters/" + slug(name)).delete()); },
      saveMatchup(id, v) { return write("matchups/" + id, () => db.doc("matchups/" + id).set(v)); },
      deleteMatchup(id) { return write("matchups/" + id, () => db.doc("matchups/" + id).delete()); },
      saveWeights(w) { return write("settings/weights", () => db.doc("settings/weights").set({ weights: w })); },
      saveCard(item) { const { id, ...body } = item; return write("card/" + id, () => db.doc("card/" + id).set(body)); },
      saveComment(item) { const { id, ...body } = item; return write("commentary/" + id, () => db.doc("commentary/" + id).set(body)); },
      deleteComment(id) { return write("commentary/" + id, () => db.doc("commentary/" + id).delete()); },
      saveJournal(item) { const { id, ...body } = item; return write("journal/" + id, () => db.doc("journal/" + id).set(body)); },
      deleteJournal(id) { return write("journal/" + id, () => db.doc("journal/" + id).delete()); },
      deleteCard(id) { return write("card/" + id, () => db.doc("card/" + id).delete()); },
      saveRecapNote(id, v) { return write("recap_notes/" + id, () => db.doc("recap_notes/" + id).set(v)); },
      saveSuggestion(id, v) { return write("prospect_suggestions/" + id, () => db.doc("prospect_suggestions/" + id).set(v)); },
      deleteSuggestion(id) { return write("prospect_suggestions/" + id, () => db.doc("prospect_suggestions/" + id).delete()); },
    };
  }
  let statusTimer;
  function setStatus(msg) {
    const el = $("#status"); if (!el) return;
    el.textContent = msg; clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 4000);
  }
  // Coalesce typing into one write per pause. Keys are document paths.
  const debounced = new Map();
  const pending = new Set();
  function later(key, fn, ms = 600) {
    clearTimeout(debounced.get(key));
    debounced.set(key, setTimeout(() => { debounced.delete(key); fn(); }, ms));
  }
  // Remote updates wait until you stop typing in a text box.
  let deferred = false;
  function renderSoon() {
    const el = document.activeElement;
    if (el && (el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && el.type !== "range" && el.type !== "button"))) { deferred = true; return; }
    render();
  }
  document.addEventListener("focusout", () => { if (deferred) { deferred = false; setTimeout(render, 0); } });

  // --------------------------------------------------------------- helpers
  function fighter(name) {
    const base = state.byName.get(name);
    if (!base) return null;
    return state.engine.applyAdjustment(base, state.adj.fighters[name]);
  }
  function weights() { return Object.assign({}, state.data.weights, state.adj.weights); }
  function matchupKey(a, b) { return slug(a) + "--" + slug(b); }
  function manualFor(a, b) {
    let t = 0;
    for (const m of Object.values(state.adj.matchups)) {
      if (m.a === a && m.b === b) t += m.logit; else if (m.a === b && m.b === a) t -= m.logit;
    }
    return t;
  }
  function matchupDoc(a, b) {
    const k1 = matchupKey(a, b), k2 = matchupKey(b, a);
    if (state.adj.matchups[k1]) return { id: k1, doc: state.adj.matchups[k1], flip: false };
    if (state.adj.matchups[k2]) return { id: k2, doc: state.adj.matchups[k2], flip: true };
    return { id: k1, doc: null, flip: false };
  }
  function record(s) { return `${s.wins + s.prior_wins}-${s.losses + s.prior_losses}`; }
  function predict(a, b, rounds, opts = {}) {
    const fa = fighter(a), fb = fighter(b);
    const sc = intangFor(a, b);
    const edit = opts.noManual ? 0 : state.engine.intangiblesLogit(sc.a, sc.b);
    return state.engine.predict(fa, fb, { rounds, weights: weights(), manual: opts.noManual ? 0 : manualFor(a, b), intangibles: edit, scouting: opts.noScout ? 0 : scoutLogit(a, b) });
  }
  /** Your 1-10 intangibles scores for this matchup, oriented to (a, b). */
  function intangFor(a, b) {
    const md = matchupDoc(a, b), sc = (md.doc && md.doc.intangibles) || {};
    return md.flip ? { a: sc.b || {}, b: sc.a || {} } : { a: sc.a || {}, b: sc.b || {} };
  }
  const hasIntang = (doc) => !!doc && !!doc.intangibles && ["a", "b"].some((s) => Object.keys(doc.intangibles[s] || {}).length);
  function saveIntang(side, key, value) {
    const { a, b } = state.m;
    const md = matchupDoc(a, b);
    const doc = md.doc ? JSON.parse(JSON.stringify(md.doc)) : { a, b, logit: 0, note: "" };
    const stored = md.flip ? (side === "a" ? "b" : "a") : side;
    doc.intangibles = doc.intangibles || { a: {}, b: {} };
    doc.intangibles[stored] = doc.intangibles[stored] || {};
    if (value === null) delete doc.intangibles[stored][key];
    else doc.intangibles[stored][key] = value;
    if (!doc.logit && !doc.note && !hasIntang(doc)) { delete state.adj.matchups[md.id]; state.store.deleteMatchup(md.id); return; }
    state.adj.matchups[md.id] = doc;
    later("matchups/" + md.id, () => state.store.saveMatchup(md.id, doc).then(() => setStatus("Saved")));
  }
  function confidence(p, a, b) {
    const edge = Math.abs(p - 0.5), thin = Math.min(a.fights, b.fights) < 3;
    if (edge >= 0.25 && !thin) return "High confidence";
    if (edge >= 0.12) return thin ? "Medium, thin data" : "Medium confidence";
    return thin ? "Low, thin data" : "Coin-flip range";
  }
  function fmt(attr, v) {
    if (v === null || v === undefined) return "—";
    if (attr.kind === "pct") return (v * 100).toFixed(0);
    if (attr.kind === "int") return String(Math.round(v));
    const t = Number(v).toFixed(attr.d ?? 1);
    return attr.signed && Number(t) > 0 ? "+" + t : t;
  }

  // ----------------------------------------------------------------- render
  function render() {
    if (!state.data) return;
    document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
    const inMore = [...document.querySelectorAll("#more-menu [data-tab]")];
    inMore.forEach((b) => { if (b.dataset.tab === state.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    const cur = inMore.find((b) => b.dataset.tab === state.tab);
    $("#more-btn").classList.toggle("active", !!cur);
    $("#more-label").textContent = cur ? cur.firstChild.textContent.trim() : "More";
    const cc = $("#card-count"); cc.hidden = !state.card.length; cc.textContent = state.card.length;
    const pa = $("#picks-alert"); pa.hidden = !(state.picks.summary && state.picks.summary.bust);
    const view = $("#view");
    const focusId = document.activeElement && document.activeElement.id;
    const selStart = document.activeElement && document.activeElement.selectionStart;
    if (state.profile && state.byName.has(state.profile)) renderProfile(view);
    else ({ matchup: renderMatchup, card: renderCard, cardpicks: renderCardPicks, insights: renderInsights, roster: renderRoster, picks: renderPicks, mypicks: renderMyPicks, mypickem: renderMyPickem, prospects: renderProspects, model: renderModel, adjust: renderAdjust })[state.tab](view);
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch (e) { /* not a text input */ } }

  }

  // ------------------------------------------------------------ fighter profile
  const nameLink = (n) => state.byName.has(n)
    ? `<button class="namelink" type="button" data-profile="${esc(n)}">${esc(n)}</button>` : esc(n);
  function divisionPeers(f) {
    return state.data.fighters.filter((x) => x.division && x.division === f.division).map((x) => fighter(x.name));
  }
  const median = (xs) => { const s = xs.slice().sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  function ratingBars(f, peers) {
    const cats = state.data.rating_categories, labels = state.data.rating_labels;
    const lo = 1200, hi = 2300, pos = (v) => Math.max(0, Math.min(100, ((v - lo) / (hi - lo)) * 100));
    const row = (label, v, med, strong, key) => `<div class="rbar${strong ? " strong" : ""}"><span>${label}${key ? infoBtn(key, label) : ""}</span>
      <span class="track">${med != null ? `<i class="med" style="left:${pos(med).toFixed(1)}%" title="Division median ${Math.round(med)}"></i>` : ""}<b style="width:${pos(v).toFixed(1)}%"></b></span>
      <span class="num">${Math.round(v)}</span></div>`;
    const med = (key) => (peers.length >= 5 ? median(peers.map((p) => p[key])) : null);
    let html = row("Overall", f.elo, med("elo"), true, "overall");
    for (const [cat, keys] of Object.entries(cats)) {
      html += row(cat[0].toUpperCase() + cat.slice(1), f[cat], med(cat), true, cat);
      html += keys.map((k) => row(labels[k], f["r_" + k], med("r_" + k), false, "r_" + k)).join("");
    }
    if (Object.keys(INTANG_ATTRS).length) {
      html += row("Intangibles", f.intangibles, med("intangibles"), true, "intangibles");
      html += Object.values(INTANG_ATTRS).map((at) => row(at.label, f[at.k], med(at.k), false, at.k)).join("");
    }
    return `<div class="rbars">${html}</div><p class="muted" style="font-size:12px;margin:6px 0 0">Scale 1200 to 2300. The tick marks the ${esc(f.division || "division")} median${peers.length >= 5 ? ` (${peers.length} fighters)` : " (too few fighters to compare)"}.</p>`;
  }
  // Where this fighter's numbers come from, and which a second source confirmed (verify.py).
  function sourcesPanel(f) {
    const c = f.checks || {}, fm = f.fightmatrix;
    const statN = (+c.stats_official || 0) + (+c.stats_verified || 0);
    const rows = [
      ["Record", "Sherdog (every pro bout); UFC results checked against UFCStats"],
      ["Per-fight stats", statN ? `UFCStats on ${statN} UFC bouts whose result Sherdog confirms${c.stats_verified ? `, ${c.stats_verified} also cross-checked with StatsFight` : ""}` : "none yet: strike and grappling rows show league averages (*)"],
      ["Date of birth", c.dob || (f.dob ? "Sherdog only" : "unknown")],
      ["Height", c.height || (f.height_cm ? "Sherdog only" : "unknown")],
      ["Reach", c.reach || (f.reach_cm ? "confirmed" : "unknown")],
    ];
    const bad = (t) => /disputed|only|not used|none yet|unknown/.test(t);
    return `<section class="panel"><h3>Sources and verification</h3>
      <dl class="srcs">${rows.map(([k, v]) => `<dt>${k}</dt><dd class="${bad(v) ? "muted" : ""}">${bad(v) ? "" : "✓ "}${esc(v)}</dd>`).join("")}</dl>
      ${fm ? `<div class="label" style="margin-top:10px">Fight Matrix</div>
        <p class="num" style="margin:4px 0 0;font-size:14px">${f.ext_rating != null ? `Rating <strong>${Math.round(f.ext_rating)}</strong> (Glicko) · ` : ""}${fm.rankings && fm.rankings.length ? esc(fm.rankings.join(", ")) + " · " : ""}${fm.combat_age ? `Combat Age ${esc(fm.combat_age)} · ` : ""}${fm.quality_perf ? `Quality perf. ${esc(fm.quality_perf)} · ` : ""}${fm.opp_metric_540 ? `540 opponent metric ${esc(fm.opp_metric_540)}` : ""}
        <a href="${esc(fm.url)}" target="_blank" rel="noopener">profile</a></p>` : ""}
    </section>`;
  }
  function renderProfile(view) {
    const n = state.profile, f = fighter(n), peers = divisionPeers(f);
    const facts = [
      f.division ? `${esc(f.division)}${f.weight_class_source === "inferred" ? " (inferred)" : ""}` : null,
      f.age ? `${f.age.toFixed(0)} years old` : null,
      f.nationality ? esc(f.nationality) : null,
      f.team ? esc(f.team) : null,
      f.height_cm ? `${Math.round(f.height_cm)} cm tall` : null,
      f.reach_cm ? `${Math.round(f.reach_cm)} cm reach` : null,
      f.stance ? esc(f.stance) : null,
    ].filter(Boolean);
    const entries = state.journal.filter((j) => j.fighter === n).sort((a, b) => (b.at || "").localeCompare(a.at || ""));
    view.innerHTML = `<div class="stack">
      <section class="panel profile-hd">
        <div><button class="btn small" type="button" id="profile-back">← Back</button></div>
        <div class="ph-main"><h2>${esc(n)}</h2><div class="ph-record num">${record(f)}</div>${f.aka ? `<div class="muted">also known as ${esc(f.aka.join(", "))}</div>` : ""}</div>
        <p class="muted">${facts.join(" · ")}</p>
        <p class="num"><strong>Ranking ${Math.round(f.proven)}</strong> <span class="muted">(overall ${Math.round(f.elo)} ± ${Math.round(f.rd)} uncertainty)</span>${officialRank(f) !== null ? ` · <strong>UFC ${officialLabel(f)}</strong> <span class="muted">${esc((f.official.media || f.official.meta).division)}</span>` : ""}${peers.length >= 5 ? ` · <strong>#${peers.slice().sort((x, y) => y.proven - x.proven).findIndex((x) => x.name === n) + 1}</strong> <span class="muted">of ${peers.length} in ${esc(f.division)} by our ranking</span>` : ""}</p>
        <div class="ph-actions"><button class="btn" type="button" data-corner="a">Put in red corner</button><button class="btn" type="button" data-corner="b">Put in blue corner</button>
          ${state.adj.fighters[n] ? '<span class="pill edit">You have edits on this fighter</span>' : ""}</div>
      </section>
      <div class="grid2">
        <div class="stack">
          ${scoutReport(n) ? `<section class="panel"><h3>Scouting report</h3>${reportBlock(scoutReport(n), { open: true })}</section>` : ""}
          <section class="panel prose">
            <h3>Bio</h3>
            ${(f.bio || []).map((p) => `<p>${esc(p)}</p>`).join("") || '<p class="muted">No bio yet.</p>'}
            <p class="muted" style="font-size:12px">Written by Claude from this fighter's record, ratings and researched background. Ratings in the text don't include your edits.</p>
            ${f.background && f.background.credentials.length ? `<h3 style="margin-top:10px">Credentials</h3>${backgroundBlock(f, { noSummary: true })}` : ""}
          </section>
          <section class="panel stack">
            <h3>Your notes</h3>
            <div class="fnote"><label class="label" for="note-profile">Scouting note (shown in matchups)</label>
              <textarea id="note-profile" data-note="${esc(n)}" placeholder="One-line read on ${esc(n)}: camp, injuries, how they've looked">${esc((state.adj.fighters[n] || {}).note || "")}</textarea></div>
            <div class="fnote"><label class="label" for="journal-text">Add a note</label>
              <textarea id="journal-text" rows="4" placeholder="Longer thoughts, fight-by-fight observations, things to watch next time…"></textarea>
              <div><button class="btn primary small" type="button" id="journal-add">Save note</button> <span class="status" id="status" role="status"></span></div></div>
            ${entries.length ? `<ul class="journal">${entries.map((j) => `<li><div class="muted num" style="font-size:12px">${esc((j.at || "").slice(0, 16).replace("T", " "))} <button class="btn link" type="button" data-del-journal="${esc(j.id)}">delete</button></div><div class="jt">${esc(j.text)}</div></li>`).join("")}</ul>` : '<p class="muted" style="font-size:13px;margin:0">No notes yet.</p>'}
          </section>
        </div>
        <div class="stack">
          <section class="panel"><h3>Ratings</h3>${ratingBars(f, peers)}</section>
          ${sourcesPanel(f)}
          <section class="panel">${commentaryList(n, f) || '<div class="label">Fight commentary</div><p class="muted" style="font-size:13px;margin:4px 0 0">No judged fights yet. Use Judge in the fight history below.</p>'}</section>
        </div>
      </div>
      <section class="panel">
        <h3>Fight history <span class="muted" style="font-size:13px;font-weight:400">(${(f.history || []).length} bouts in the data${(f.history || []).length === 40 ? ", most recent 40" : ""})</span></h3>
        <div class="table-wrap"><table class="list num"><thead><tr><th>Date</th><th>Result</th><th>Opponent</th><th>Opp. rating</th><th>Method</th><th>Rd</th><th>Event</th><th></th></tr></thead><tbody>
        ${(f.history || []).map((x) => `<tr><td>${esc(x.date)}</td><td class="res-${x.result}">${x.result}</td><td>${nameLink(x.opponent)}</td><td>${x.opp_rating}</td>
          <td>${esc(x.method)}</td><td>${x.round} <span class="muted">${esc(x.time)}</span></td><td>${esc(x.event)}</td>
          <td><button class="btn small" type="button" data-judge="${esc(n)}" data-date="${esc(x.date)}" data-opp="${esc(x.opponent)}">Judge</button></td></tr>
          ${state.judging && state.judging.fighter === n && state.judging.date === x.date ? `<tr><td colspan="8">${judgeForm("profile")}</td></tr>` : ""}`).join("")}
        </tbody></table></div>
      </section>
    </div>`;

  function renderMatchup(view) {
    const { a, b, rounds } = state.m;
    const fa = a && fighter(a), fb = b && fighter(b);
    let html = `
      <div class="stack">
        <section class="panel">
          <div class="setup">
            <label class="corner red"><span class="label">Red corner</span>

            <label class="corner blue"><span class="label">Blue corner</span>

            </span>

              <input id="odds-a" type="text" inputmode="numeric" placeholder="Red −150" value="${esc(state.m.oddsA)}" aria-label="Red corner American odds">
              <input id="odds-b" type="text" inputmode="numeric" placeholder="Blue +130" value="${esc(state.m.oddsB)}" aria-label="Blue corner American odds"></span>
            <button class="btn" id="swap" type="button">Swap corners</button>
            <button class="btn" id="to-card" type="button" ${fa && fb ? "" : "disabled"}>Save matchup</button>
            <span class="status" id="status" role="status"></span>
          </div>
        </section>`;
    if (!fa || !fb || a === b) {
      html += `<div class="empty">${a && !fa || b && !fb ? "That name isn't in the dataset. Pick from the suggestions as you type." : "Pick two different fighters to see the prediction."}</div></div>`;
      view.innerHTML = html; return;
    }
    const r = predict(a, b, rounds);
    const base = predict(a, b, rounds, { noManual: true });
    const p = r.p;
    const pick = p >= 0.5 ? a : b;
    const best = [["a", a], ["b", b]].flatMap(([side, n]) => Object.entries(r.methods[side]).map(([m, v]) => [n, m, v])).sort((u, v) => v[2] - u[2])[0];
    const dist = r.methods.a.DEC + r.methods.b.DEC;
    let market = "";
    const oa = parseFloat(state.m.oddsA), ob = parseFloat(state.m.oddsB);
    if (isFinite(oa) && isFinite(ob) && Math.abs(oa) >= 100 && Math.abs(ob) >= 100) {
      const mp = MMAEngine.devig(oa, ob), edge = p - mp;
      const bl = blendP(p, mp);
      market = `<span class="pill num">Market ${pct(mp, 0)} / ${pct(1 - mp, 0)} (${esc((mp >= 0.5 ? a : b).split(" ").slice(-1)[0])} favoured)</span><span class="pill num">Model edge ${pct(Math.abs(edge))} to ${esc(edge >= 0 ? a : b)}</span>${bl != null ? `<span class="pill num" title="Model and market combined with the weights that tested best on past bouts">Blend ${esc((bl >= 0.5 ? a : b).split(" ").slice(-1)[0])} ${pct(Math.max(bl, 1 - bl), 0)}</span>` : ""}`;
    }
    const live = marketFor(a, b);
    if (live && live.a_open != null) {
      const po = fairP(live.a_open, live.b_open), pn = fairP(live.a_now, live.b_now);
      market += `<span class="muted num" style="font-size:13px">BestFightOdds: opened ${fmtOdds(live.a_open)} / ${fmtOdds(live.b_open)}, now ${fmtOdds(live.a_now)} / ${fmtOdds(live.b_now)} ${sparkline(live.movement_a)}${po != null && pn != null && Math.abs(pn - po) >= 0.02 ? ` (money on ${esc((pn > po ? a : b).split(" ").slice(-1)[0])}, ${Math.abs((pn - po) * 100).toFixed(0)} pts)` : ""}</span>`;
    }
    const ea = state.adj.fighters[a], eb = state.adj.fighters[b];
    const noStats = [fa, fb].filter((f) => !f.stat_minutes).map((f) => f.name);
    const md = matchupDoc(a, b);
    const readVal = md.doc ? (md.flip ? -md.doc.logit : md.doc.logit) : 0;
    const readNote = md.doc ? md.doc.note : "";

    html += `
      <section class="panel verdict" aria-live="polite">
        <div class="names"><h2 class="a">${nameLink(a)}</h2><h2 class="b">${nameLink(b)}</h2></div>
        <div class="probbar num" role="img" aria-label="${esc(a)} ${pct(p)}, ${esc(b)} ${pct(1 - p)}">
          <div class="pa" style="flex-basis:${(p * 100).toFixed(2)}%">${pct(p)}</div>
          <div class="pb" style="flex-basis:${((1 - p) * 100).toFixed(2)}%">${pct(1 - p)}</div>
        </div>
        <div class="verdict-line">
          <strong>Pick: ${esc(pick)}</strong>
          <span class="pill">${confidence(p, fa, fb)}</span>
          <span class="muted">Most likely: ${esc(best[0])} by ${best[1]} (${pct(best[2], 0)}) · Goes the distance ${pct(dist, 0)}</span>
          ${readVal ? `<span class="pill edit num">Your read moves this ${((p - base.p) * 100 >= 0 ? "+" : "")}${((p - base.p) * 100).toFixed(1)} pts for ${esc(a)}</span>` : ""}
          ${ea || eb ? `<span class="pill edit">Includes your fighter edits</span>` : ""}
          ${scoutLogit(a, b) ? (() => { const q = predict(a, b, rounds, { noScout: true }).p; return `<span class="pill num" title="Claude's scouting read (see Scouting below)">Scouting read moves this ${((p - q) * 100 >= 0 ? "+" : "")}${((p - q) * 100).toFixed(1)} pts for ${esc(a)}</span>`; })() : ""}
          ${market}

      <div class="grid2">

            ${factorBars(r.factors)}

        <section class="panel stack">
