<title>MMA Fight Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Look: calm product page (Land-book style). Ivory ground, white rounded cards, a serif display face over a clean sans, pill controls; red and blue corners keep their meaning. */
:root {
  --bg: #f6f3ec;
  --surface: #ffffff;
  --surface-2: #f3efe6;
  --ink: #17181c;
  --muted: #5b5e66;
  --line: #e6e0d4;
  --red: #b3261e;
  --red-soft: #f6deda;
  --blue: #1f4fb3;
  --blue-soft: #dce4f5;
  --edit: #955708;
  --edit-soft: #f7ead5;
  --good: #1f7a4a;
  --focus: #1f4fb3;
  --shadow: 0 1px 2px rgba(23, 24, 28, .05), 0 14px 32px -20px rgba(23, 24, 28, .22);
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --surface: #1d1c19; --surface-2: #26241f; --ink: #f2eee6; --muted: #aaa498; --line: #35322c;
    --red: #e9665c; --red-soft: #3b1f1c; --blue: #7ea2f0; --blue-soft: #1c2742; --edit: #e6aa4a; --edit-soft: #3a2c14;
    --good: #52c287; --focus: #7ea2f0; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 32px -20px rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141412; --surface: #1d1c19; --surface-2: #26241f; --ink: #f2eee6; --muted: #aaa498; --line: #35322c;
  --red: #e9665c; --red-soft: #3b1f1c; --blue: #7ea2f0; --blue-soft: #1c2742; --edit: #e6aa4a; --edit-soft: #3a2c14;
  --good: #52c287; --focus: #7ea2f0; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 32px -20px rgba(0, 0, 0, .6); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.label { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 12.5px; color: var(--muted); }
.muted { color: var(--muted); }

/* Header + tabs */
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; padding-block: 4px 12px; }
header.top h1 { font-size: 30px; text-transform: uppercase; }
header.top h1 span { color: var(--red); }
.meta { font-size: 13px; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--line); overflow-x: auto; margin-bottom: 18px; }
nav.tabs button { background: none; border: 0; padding: 10px 14px 8px; font-family: var(--display); font-weight: 600; font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
nav.tabs .count { font-family: var(--body); font-size: 12px; background: var(--edit-soft); color: var(--edit); border-radius: 9px; padding: 0 6px; margin-left: 4px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
.stack { display: grid; gap: 16px; }
.stack > * { min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 4px; padding: 6px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.small { padding: 3px 8px; font-size: 13px; }
.btn.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; }
input[type="text"], input[type="number"], input[type="search"], textarea, select { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; min-width: 0; }
textarea { width: 100%; resize: vertical; min-height: 56px; }

/* Matchup setup */
.setup { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; }
.corner { display: grid; gap: 4px; min-width: 0; }
.corner input { width: 100%; font-family: var(--display); font-weight: 600; font-size: 20px; padding: 6px 10px; }
.corner.red input { border-left: 5px solid var(--red); }
.corner.blue input { border-left: 5px solid var(--blue); }
.cb { position: relative; display: block; }
.pr-table td { vertical-align: top; }
.pr-detail td.num { white-space: nowrap; }
.pr-row:hover td { background: var(--surface-2); }
.pr-open > td { background: var(--surface-2); padding: 12px 14px; }
.pr-cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }
.pr-detail .rbar { grid-template-columns: minmax(0, 11em) 1fr 3em; }
@media (max-width: 800px) { .pr-cols { grid-template-columns: 1fr; } }
.mp-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; margin-top: 12px; }
.mp-side { position: sticky; top: 12px; }
.mp-bout { border-top: 1px solid var(--line); padding: 12px 0; }
.mp-bout:first-child { border-top: 0; padding-top: 0; }
.mp-bout-hd { margin-bottom: 8px; }
.mp-ml { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mp-props { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; margin-top: 8px; }
.mp-bout details > summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-top: 8px; }
.odds-btn { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 10px; font: 500 13px var(--body); color: var(--ink); cursor: pointer; text-align: left; }
.odds-btn.big { padding: 10px 12px; font-size: 14.5px; }
.odds-btn:hover { border-color: var(--ink); }
.odds-btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mp-slip { background: var(--surface-2); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.mp-legs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.mp-legs li { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; font-size: 13.5px; }
.mp-stake { display: grid; gap: 6px; font-size: 13.5px; }
.mp-stake input { width: 110px; }
.mp-msg { margin: 0; font-size: 13px; color: var(--edit); }
.mp-lb tr.mp-me td { background: var(--edit-soft); }
.mp-lb tr.mp-ai td { font-style: italic; }
@media (max-width: 800px) { .mp-grid { grid-template-columns: 1fr; } .mp-side { position: sticky; bottom: 8px; top: auto; order: 2; } }
.sc-read { background: var(--surface-2); border-radius: 14px; padding: 14px 16px; }
.sc-read p { margin: 8px 0 0; font-size: 14.5px; line-height: 1.5; }
.sc-read-hd { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.sc-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sc-name { margin: 0 0 6px; font-size: 17px; }
.sc-summary { margin: 0 0 8px; font-size: 14.5px; line-height: 1.5; }
.sc-report details > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.sc-how { margin: 8px 0; display: grid; gap: 6px; }
.sc-how dt { font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sc-how dd { margin: 0 0 4px; font-size: 14px; line-height: 1.5; }
.sc-lists { display: grid; gap: 8px; }
.sc-src { font-size: 12px; margin: 8px 0 0; }
.sc-chip { font-size: 11.5px; }
.pk-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.pk-stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.pk-big { font-family: var(--display); font-size: 28px; font-weight: 600; margin: 2px 0; }
.pk-note { background: var(--surface-2); border-radius: 12px; padding: 10px 14px; margin: 10px 0 12px; }
.pk-note p { margin: 4px 0 0; font-size: 14.5px; line-height: 1.5; }
.pk-why { font-size: 12.5px; color: var(--muted); margin-top: 4px; max-width: 60ch; }
.pk-bets td { vertical-align: top; }
.pk-pass { margin: 8px 0 0; }
.pk-alert { background: var(--red); color: #fff; border-radius: 14px; padding: 14px 18px; font-size: 15px; }
.count.alert { background: var(--red); color: #fff; }
.pk-curve { width: 100%; max-width: 760px; height: auto; display: block; }
.pk-table th, .pk-table td { text-align: left; }
.pk-table th.num, .pk-table td.num { text-align: right; }
.pk-line { fill: none; stroke: var(--ink); stroke-width: 2.5; }
.pk-dot { fill: var(--red); }
.pk-base { stroke: var(--line); stroke-dasharray: 4 4; }
.pk-axis { font-size: 13px; fill: var(--muted); font-family: var(--body); }
@media (max-width: 640px) {
  .pk-axis { font-size: 22px; }
  .pk-bets thead { display: none; }
  .pk-bets tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .pk-bets td { border: 0; padding: 0; text-align: left !important; }
  .pk-bets td:first-child { grid-column: 1 / -1; }
  .pk-bets td[data-l]::before { content: attr(data-l); display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
}
.cb-list { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.14); max-height: 340px; overflow-y: auto; }
.cb-list li { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 15px; }
.cb-list li[aria-selected=true] { background: var(--red-soft, rgba(0,0,0,.06)); }
.corner.blue .cb-list li[aria-selected=true] { background: var(--blue-soft, rgba(0,0,0,.06)); }
.cb-list .cb-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cb-list .cb-meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; flex-shrink: 0; }
.cb-list .cb-empty { color: var(--muted); cursor: default; }
.vs { font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--muted); padding-bottom: 8px; }
.options { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.odds { display: inline-flex; gap: 6px; align-items: center; }
.odds input { width: 96px; }

/* Verdict */
.verdict { display: grid; gap: 12px; }
.names { display: flex; justify-content: space-between; gap: 12px; }
.names h2 { font-size: clamp(22px, 4vw, 34px); text-transform: uppercase; line-height: 1.05; min-width: 0; overflow-wrap: anywhere; }
.names .a { color: var(--red); }
.names .b { color: var(--blue); text-align: right; }
.probbar { display: flex; height: 44px; border-radius: 4px; overflow: hidden; font-family: var(--display); font-weight: 700; font-size: 22px; }
.probbar div { display: flex; align-items: center; padding-inline: 12px; color: #fff; min-width: 0; transition: flex-basis .25s ease; }
.probbar .pa { background: var(--red); }
.probbar .pb { background: var(--blue); justify-content: flex-end; }
.verdict-line { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.pill { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.pill.edit { background: var(--edit-soft); color: var(--edit); border-color: transparent; }
.pill.warn { background: var(--edit-soft); color: var(--edit); border-color: transparent; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }

/* Method breakdown */
.methods { display: grid; gap: 8px; }
.mrow { display: grid; grid-template-columns: 88px 1fr 48px; gap: 8px; align-items: center; font-size: 14px; }
.mtrack { height: 14px; background: var(--surface-2); border-radius: 2px; position: relative; }
.mtrack div { position: absolute; inset: 0 auto 0 0; border-radius: 2px; }
.mhead { font-family: var(--display); font-weight: 600; font-size: 15px; margin-top: 4px; }

/* Factors (diverging) */
.factors { display: grid; gap: 5px; }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(90px, 1.1fr) 46px; gap: 8px; align-items: center; font-size: 13.5px; }
.fbar { position: relative; height: 12px; }
.fbar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.fbar div { position: absolute; top: 0; bottom: 0; border-radius: 1px; }
.faxis { display: grid; grid-template-columns: minmax(0, 1fr) minmax(90px, 1.1fr) 46px; gap: 8px; font-size: 12px; color: var(--muted); }
.faxis span:nth-child(2) { display: flex; justify-content: space-between; }

/* Tale of the tape */
.tape-wrap { overflow-x: auto; }
table.tape { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tape th, table.tape td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
button.info { background: none; border: 0; padding: 0 3px; margin: 0; font: inherit; font-size: 13px; line-height: 1; color: var(--muted); cursor: pointer; border-radius: 50%; }
button.info:hover, button.info:focus-visible { color: var(--ink); background: var(--surface-2); }
svg.spark { vertical-align: middle; color: var(--muted); }
.mv-a { color: var(--red); } .mv-b { color: var(--blue); }
.edge { font-size: 12px; font-weight: 600; color: var(--edit); }
dl.srcs { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 8px 0 0; font-size: 14px; }
dl.srcs dt { color: var(--muted); } dl.srcs dd { margin: 0; }
dialog.info-dlg { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 18px 20px; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow: auto; }
dialog.info-dlg::backdrop { background: rgba(10, 14, 20, .45); }
dialog.info-dlg h3 { font-size: 22px; margin: 0 28px 6px 0; }
dialog.info-dlg .close { position: absolute; top: 10px; right: 10px; }
dialog.info-dlg dl { margin: 10px 0 0; }
dialog.info-dlg dt { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; font-size: 13px; color: var(--muted); margin-top: 12px; }
dialog.info-dlg dd { margin: 3px 0 0; }
dialog.info-dlg .vals { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14px; }
dialog.info-dlg .vals .a { color: var(--red); font-weight: 600; } dialog.info-dlg .vals .b { color: var(--blue); font-weight: 600; }
table.tape td.attr { text-align: center; color: var(--muted); font-size: 13px; white-space: nowrap; }
table.tape td.va { text-align: right; }
table.tape td.vb { text-align: left; }
table.tape th { font-family: var(--display); font-size: 17px; text-transform: uppercase; }
table.tape th.a { color: var(--red); text-align: right; }
table.tape th.b { color: var(--blue); text-align: left; }
.cell { display: inline-flex; align-items: center; gap: 4px; }
.cell input { width: 74px; text-align: right; padding: 3px 6px; font-variant-numeric: tabular-nums; }
td.vb .cell input { text-align: left; }
.cell.edited input { background: var(--edit-soft); border-color: var(--edit); }
.cell .unit { color: var(--muted); font-size: 12px; }
.cell .reset { visibility: hidden; border: 0; background: none; color: var(--edit); cursor: pointer; padding: 0 2px; font-size: 13px; }
.cell.edited .reset { visibility: visible; }
.better { font-weight: 600; }
table.tape tr.group td { padding-top: 16px; font-family: var(--display); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: .06em; text-align: center; border-bottom: 2px solid var(--ink); }
table.tape tr.group td span { display: block; font-family: var(--body); font-weight: 400; font-size: 12px; text-transform: none; letter-spacing: 0; color: var(--muted); }
table.tape tr.cat td { background: var(--surface-2); font-size: 15px; }
table.tape tr.cat td.attr { color: var(--ink); }
.catval .muted { font-size: 12px; font-weight: 400; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: var(--muted); }
.filters label { display: inline-flex; align-items: center; gap: 5px; }
.filters select, .filters input { font-size: 13.5px; color: var(--ink); }
.filters input[type="number"] { width: 64px; }
.filters input[type="search"] { flex: 1 1 200px; }
.filters .check input { accent-color: var(--ink); }
button.sorter { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
button.sorter:hover { color: var(--ink); }
.classes { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.wc { border: 1px solid var(--line); border-radius: 6px; padding: 12px; min-width: 0; }
.wc-hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.wc-hd h3 { font-size: 18px; text-transform: uppercase; }
.wc-hd span { font-size: 12px; }
.wc ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13.5px; }
.wc li { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) 28% 4.6em; gap: 6px; align-items: center; cursor: pointer; }
.wc li .uf { display: inline-block; min-width: 2.2em; margin-left: 4px; font-size: 11px; color: var(--muted); text-align: left; }
.wc li:hover .nm { text-decoration: underline; }
.wc li .rk { color: var(--muted); text-align: right; }
.wc li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wc li .bar { height: 8px; background: var(--surface-2); border-radius: 2px; position: relative; }
.wc li .bar span { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 2px; opacity: .7; }
.wc li .v { text-align: right; }
details.more-filters > summary { cursor: pointer; font-size: 13px; color: var(--muted); }
@media (min-width: 821px) { details.more-filters > summary { display: none; } }
button.namelink { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; text-align: inherit; cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); }
button.namelink:hover { text-decoration-color: currentColor; }
.profile-hd { display: grid; gap: 8px; }
.profile-hd p { margin: 0; }
.ph-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.ph-main h2 { font-size: clamp(28px, 5vw, 42px); text-transform: uppercase; line-height: 1; }
.ph-record { font-family: var(--display); font-weight: 600; font-size: 24px; color: var(--muted); }
.ph-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.prose p { margin: 0 0 10px; max-width: 68ch; line-height: 1.55; }
.prose h3 { margin-bottom: 8px; }
.rbars { display: grid; gap: 4px; margin-top: 8px; }
.rbar { display: grid; grid-template-columns: minmax(0, 9.5em) 1fr 3em; gap: 8px; align-items: center; font-size: 13px; }
.rbar.strong { font-weight: 600; font-size: 14px; margin-top: 6px; }
.rbar .track { position: relative; height: 10px; background: var(--surface-2); border-radius: 2px; }
.rbar .track b { position: absolute; inset: 0 auto 0 0; background: var(--muted); border-radius: 2px; }
.rbar.strong .track b { background: var(--ink); }
.rbar .track .med { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--red); z-index: 1; }
.rbar > .num { text-align: right; }
ul.journal { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ul.journal li { border-left: 3px solid var(--edit); padding-left: 10px; }
ul.journal .jt { white-space: pre-wrap; }
.evtabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.evtabs button { flex: 0 0 auto; display: grid; gap: 2px; text-align: left; min-width: 150px; max-width: 220px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; font-size: 13px; }
.evtabs button strong { font-family: var(--display); font-size: 15px; line-height: 1.15; white-space: normal; }
.evtabs button[aria-selected="true"] { border-color: var(--ink); box-shadow: inset 0 -3px 0 var(--ink); }
table.bouts td { vertical-align: middle; }

<script>
(function () {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slug = (s) => String(s).toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 120) || "x";
  const pct = (x, d = 1) => (x * 100).toFixed(d) + "%";
  const ls = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  };

  // Tale-of-the-tape rows. kind: pct (stored 0-1, shown 0-100), num, int.
  // help: what the number is and where it comes from (shown by the (i) buttons).
  const SHRUNK = "Shrunk toward the league average until there is enough evidence, so a short record stays near average.";
  const NEEDS_STATS = "From UFCStats per-fight stats, used only on bouts whose result a second source (Sherdog) confirms and dropped where StatsFight contradicts them. Fighters without UFC bouts have none, so this shows the league average (*).";
  const ATTRS = [
    { k: "ext_rating", label: "Fight Matrix rating", kind: "int", better: "high", outside: true, help: "Fight Matrix's own Glicko-1 rating for this fighter after their last bout (an independent computer ranking; Fight Matrix displays it 500 points lower than raw Glicko). The model's outside-rating factor compares the two fighters' ratings; it is 0 when either has none. Type over it if you think it's off." },
    { k: "age", label: "Age", kind: "num", d: 1, unit: "yrs", better: "low", help: "Age on fight night, from date of birth. Feeds the age curve (a penalty that grows past 32, and a small one under 24) and multiplies wear and tear past 30." },
    { k: "reach_cm", label: "Reach", kind: "num", d: 0, unit: "cm", better: "high", help: "Arm span in centimetres. The reach factor compares the two fighters per 10 cm; it matters most at range. Used only when two sources agree on it." },
    { k: "height_cm", label: "Height", kind: "num", d: 0, unit: "cm", better: "high", help: "Height in centimetres (Sherdog, checked against UFCStats). The height factor compares the two fighters per 10 cm." },
    { k: "fight_weight", label: "Fighting weight", kind: "num", d: 0, unit: "lb", better: "high", help: "The division this fighter has been competing at: the middle of their last few bouts' weight classes (heavyweight counted as 250 lb). The size factor compares the two fighters' fighting weights, so a heavyweight facing a lightweight gets a large edge. Learned from bouts where fighters moved up or down a division. Type over it for a fight at a different weight." },
    { k: "slpm", label: "Sig. strikes landed / min", kind: "num", d: 2, better: "high", stat: true, help: `Significant strikes landed per minute of cage time, adjusted for how hard each opponent was to hit. ${SHRUNK} ${NEEDS_STATS}` },
    { k: "sapm", label: "Sig. strikes absorbed / min", kind: "num", d: 2, better: "low", stat: true, help: `Significant strikes absorbed per minute, adjusted for each opponent's output. ${SHRUNK} ${NEEDS_STATS}` },
    { k: "sig_diff5", label: "Sig. strike differential / 5 min", kind: "num", d: 1, signed: true, better: "high", stat: true, help: `Significant strikes landed minus absorbed per minute, times 5: the margin per five-minute round. Positive means out-landing opponents. Editing it keeps the fighter's total output and moves the split between landed and absorbed, which feeds the striking exchange factor. ${NEEDS_STATS}` },
    { k: "str_acc", label: "Striking accuracy", kind: "pct", better: "high", stat: true, help: `Share of significant strikes thrown that land, adjusted for opponents' defence. ${SHRUNK} ${NEEDS_STATS}` },
    { k: "str_def", label: "Striking defence", kind: "pct", better: "high", stat: true, help: `Share of opponents' significant strikes that miss, adjusted for their accuracy. ${SHRUNK} ${NEEDS_STATS}` },
    { k: "kd_per15", label: "Knockdowns / 15 min", kind: "num", d: 2, better: "high", stat: true, help: `Knockdowns scored per 15 minutes. Feeds power vs chin and the KO/TKO chance. ${SHRUNK} ${NEEDS_STATS}` },
    { k: "td_per15", label: "Takedowns / 15 min", kind: "num", d: 2, better: "high", stat: true, help: `Takedowns landed per 15 minutes. Feeds the wrestling edge (against the opponent's takedown defence). ${SHRUNK} ${NEEDS_STATS}` },
    { k: "td_acc", label: "Takedown accuracy", kind: "pct", better: "high", stat: true, help: `Share of takedown attempts that land, adjusted for opponents' takedown defence. ${SHRUNK} ${NEEDS_STATS}` },
    { k: "td_def", label: "Takedown defence", kind: "pct", better: "high", stat: true, help: `Share of opponents' takedown attempts stopped, adjusted for their accuracy. ${SHRUNK} ${NEEDS_STATS}` },
    { k: "sub_per15", label: "Sub attempts / 15 min", kind: "num", d: 2, better: "high", stat: true, help: `Submission attempts per 15 minutes. Feeds submission threat (against the opponent's rate of losing by submission). ${SHRUNK} ${NEEDS_STATS}` },
    { k: "ctrl_share", label: "Control time share", kind: "pct", better: "high", stat: true, help: `Share of cage time spent in control (on top or on the back). Feeds the control factor. ${SHRUNK} ${NEEDS_STATS}` },
    { k: "ko_loss_rate", label: "Bouts lost by KO", kind: "pct", better: "low", help: `Share of bouts lost by KO/TKO. Fights in the last 18 months count fully; older ones fade (half weight every 2 years). ${SHRUNK} Feeds chin vulnerability.` },
    { k: "sub_loss_rate", label: "Bouts lost by sub", kind: "pct", better: "low", help: `Share of bouts lost by submission, recent fights weighted most. ${SHRUNK} Feeds the opponent's submission threat.` },
    { k: "recent_ko_losses", label: "KO losses, last 3", kind: "int", better: "low", help: "KO/TKO losses in the last three fights: a sign a chin may be going." },
    { k: "late_win_rate", label: "Win rate past R2", kind: "pct", better: "high", help: "Win rate in fights that reached round 3 or later, recent fights weighted most. Feeds the cardio factor, which counts more in five-round fights." },
    { k: "form", label: "Recent form (−1 to 1)", kind: "num", d: 2, better: "high", help: "Recency-weighted results: +1 is winning everything lately, −1 losing everything. Finishes count more than decisions." },
    { k: "streak", label: "Streak (+W / −L)", kind: "int", better: "high", help: "Current run: +3 is three straight wins, −2 two straight losses." },
    { k: "layoff_days", label: "Days since last fight", kind: "int", better: "low", help: "Days since the last bout. Ring rust starts counting after about 400 days and grows for each extra year." },
    { k: "sos", label: "Avg opponent rating", kind: "int", better: "high", help: "Strength of schedule: the average overall rating of opponents at the time they were fought." },
    { k: "minutes", label: "Cage time (in data)", kind: "num", d: 0, unit: "min", better: "low", wear: true, help: "Total minutes fought in the dataset. Part of the wear index (mileage)." },
    { k: "ko_losses", label: "KO/TKO losses (career)", kind: "int", better: "low", wear: true, help: "Career KO/TKO losses. The heaviest part of the wear index (damage)." },
    { k: "kd_absorbed", label: "Knockdowns absorbed", kind: "int", better: "low", wear: true, stat: true, help: `Career knockdowns suffered. Part of the wear index (damage). ${NEEDS_STATS}` },
    { k: "sig_absorbed", label: "Sig. strikes absorbed (total)", kind: "int", better: "low", wear: true, stat: true, help: `Career significant strikes absorbed. Part of the wear index (damage). ${NEEDS_STATS}` },
  ];
  const WEIGHT_RANGE = { overall: [0, 2.5] };
  // Sub-rating rows (r_<key>), built from data.json at boot.
  let RATING_ATTRS = {};
  let INTANG_ATTRS = {};

  const state = {
    data: null, engine: null, byName: new Map(),
    adj: { fighters: {}, matchups: {}, weights: {} }, card: [], commentary: [], judging: null, journal: [], profile: null,
    tab: "card",
    picks: { sub: "week", summary: null, weeks: [], loaded: false },

    pros: { data: null, loading: false, error: "", view: "classes", gender: "", wc: "", q: "", unbeaten: false, open: null },

  // ------------------------------------------------------------------ store
  // Shared artifact database when available; browser storage otherwise.
  const LOCAL_KEY = "mma-fight-lab";
  function localStore() {

    if (saved.adj) state.adj = Object.assign({ fighters: {}, matchups: {}, weights: {} }, saved.adj);

      kind: "local",
      async saveFighter() { persist(); }, async deleteFighter() { persist(); },
      async saveMatchup() { persist(); }, async deleteMatchup() { persist(); },
      async saveWeights() { persist(); },
      async saveCard() { persist(); }, async deleteCard() { persist(); },
      async saveComment() { persist(); }, async deleteComment() { persist(); },

  function dbStore(db) {
    const writers = new Map();  // one write at a time per doc
    function write(path, fn) {

      const next = prev.then(fn).catch((e) => setStatus(`Couldn't save (${e && e.code || "error"}). Your change is kept on this page only.`))
        .finally(() => { if (writers.get(path) === next) { writers.delete(path); pending.delete(path); } });
      writers.set(path, next);
      return next;
    }
    // Snapshots never clobber an edit that is still waiting to be written.
    const keep = (path) => pending.has(path) || debounced.has(path);
    db.collection("fighters").onSnapshot((snap) => {
      const f = {};
      snap.docs.forEach((d) => { const v = d.data(); if (v && v.name) f[v.name] = { elo: v.elo || 0, overrides: v.overrides || {}, note: v.note || "" }; });
      for (const [n, v] of Object.entries(state.adj.fighters)) if (keep("fighters/" + slug(n))) f[n] = v;
      for (const n of Object.keys(f)) if (keep("fighters/" + slug(n)) && !state.adj.fighters[n]) delete f[n];
      state.adj.fighters = f; renderSoon();
    }, () => {});
    db.collection("matchups").onSnapshot((snap) => {
      const m = {};
      snap.docs.forEach((d) => { const v = d.data(); if (v && v.a) m[d.id] = { a: v.a, b: v.b, logit: v.logit || 0, note: v.note || "", ...(v.intangibles ? { intangibles: v.intangibles } : {}) }; });
      for (const [id, v] of Object.entries(state.adj.matchups)) if (keep("matchups/" + id)) m[id] = v;

    }, () => {});

    }, () => {});
    db.collection("journal").onSnapshot((snap) => {
      state.journal = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderSoon();
    }, () => {});
    db.collection("commentary").onSnapshot((snap) => {
      state.commentary = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderSoon();
    }, () => {});

    }, () => { state.scout.loaded = true; renderSoon(); });

      const m = {};

      for (const id of Object.keys(state.recapNotes)) if (keep("recap_notes/" + id) && !m[id]) m[id] = state.recapNotes[id];
      state.recapNotes = m; renderSoon();
    }, () => {});
    db.collection("recap_reviews").onSnapshot((snap) => {
      const m = {};
      snap.docs.forEach((d) => { m[d.id] = d.data(); });

    db.collection("card").orderBy("order").onSnapshot((snap) => {

    }, () => {});
    return {
      kind: "db",
      saveFighter(name, v) { return write("fighters/" + slug(name), () => db.doc("fighters/" + slug(name)).set({ name, elo: v.elo || 0, overrides: v.overrides || {}, note: v.note || "" })); },

      saveWeights(w) { return write("settings/weights", () => db.doc("settings/weights").set({ weights: w })); },
      saveCard(item) { const { id, ...body } = item; return write("card/" + id, () => db.doc("card/" + id).set(body)); },
      saveComment(item) { const { id, ...body } = item; return write("commentary/" + id, () => db.doc("commentary/" + id).set(body)); },
      deleteComment(id) { return write("commentary/" + id, () => db.doc("commentary/" + id).delete()); },
      saveJournal(item) { const { id, ...body } = item; return write("journal/" + id, () => db.doc("journal/" + id).set(body)); },
      deleteJournal(id) { return write("journal/" + id, () => db.doc("journal/" + id).delete()); },

  function ratingBars(f, peers) {

              <span class="cb"><input id="in-b" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cb-b" value="${esc(b || "")}" placeholder="Search blue corner…" autocomplete="off" spellcheck="false"><ul class="cb-list" id="cb-b" role="listbox" aria-label="Blue corner results" hidden></ul></span></label>
          </div>
          <div class="options">
            <span class="label">Rounds</span>
            <span class="seg" role="group" aria-label="Scheduled rounds">
              <button type="button" data-rounds="3" aria-pressed="${rounds === 3}">3</button>
              <button type="button" data-rounds="5" aria-pressed="${rounds === 5}">5</button>
            </span>
            <span class="odds"><span class="label">Moneyline</span>
              <input id="odds-a" type="text" inputmode="numeric" placeholder="Red −150" value="${esc(state.m.oddsA)}" aria-label="Red corner American odds">
              <input id="odds-b" type="text" inputmode="numeric" placeholder="Blue +130" value="${esc(state.m.oddsB)}" aria-label="Blue corner American odds"></span>

            <button class="btn" id="to-card" type="button" ${fa && fb ? "" : "disabled"}>Save matchup</button>
            <span class="status" id="status" role="status"></span>
          </div>
        </section>`;
    if (!fa || !fb || a === b) {
      html += `<div class="empty">${a && !fa || b && !fb ? "That name isn't in the dataset. Pick from the suggestions as you type." : "Pick two different fighters to see the prediction."}</div></div>`;
      view.innerHTML = html; return;
    }
    const r = predict(a, b, rounds);
    const base = predict(a, b, rounds, { noManual: true });
    const p = r.p;
    const pick = p >= 0.5 ? a : b;
    const best = [["a", a], ["b", b]].flatMap(([side, n]) => Object.entries(r.methods[side]).map(([m, v]) => [n, m, v])).sort((u, v) => v[2] - u[2])[0];
    const dist = r.methods.a.DEC + r.methods.b.DEC;
    let market = "";
    const oa = parseFloat(state.m.oddsA), ob = parseFloat(state.m.oddsB);
    if (isFinite(oa) && isFinite(ob) && Math.abs(oa) >= 100 && Math.abs(ob) >= 100) {
      const mp = MMAEngine.devig(oa, ob), edge = p - mp;
      const bl = blendP(p, mp);
      market = `<span class="pill num">Market ${pct(mp, 0)} / ${pct(1 - mp, 0)} (${esc((mp >= 0.5 ? a : b).split(" ").slice(-1)[0])} favoured)</span><span class="pill num">Model edge ${pct(Math.abs(edge))} to ${esc(edge >= 0 ? a : b)}</span>${bl != null ? `<span class="pill num" title="Model and market combined with the weights that tested best on past bouts">Blend ${esc((bl >= 0.5 ? a : b).split(" ").slice(-1)[0])} ${pct(Math.max(bl, 1 - bl), 0)}</span>` : ""}`;
    }
    const live = marketFor(a, b);
    if (live && live.a_open != null) {
      const po = fairP(live.a_open, live.b_open), pn = fairP(live.a_now, live.b_now);
      market += `<span class="muted num" style="font-size:13px">BestFightOdds: opened ${fmtOdds(live.a_open)} / ${fmtOdds(live.b_open)}, now ${fmtOdds(live.a_now)} / ${fmtOdds(live.b_now)} ${sparkline(live.movement_a)}${po != null && pn != null && Math.abs(pn - po) >= 0.02 ? ` (money on ${esc((pn > po ? a : b).split(" ").slice(-1)[0])}, ${Math.abs((pn - po) * 100).toFixed(0)} pts)` : ""}</span>`;
    }
    const ea = state.adj.fighters[a], eb = state.adj.fighters[b];
    const noStats = [fa, fb].filter((f) => !f.stat_minutes).map((f) => f.name);
    const md = matchupDoc(a, b);
    const readVal = md.doc ? (md.flip ? -md.doc.logit : md.doc.logit) : 0;
    const readNote = md.doc ? md.doc.note : "";

    html += `
      <section class="panel verdict" aria-live="polite">
        <div class="names"><h2 class="a">${nameLink(a)}</h2><h2 class="b">${nameLink(b)}</h2></div>
        <div class="probbar num" role="img" aria-label="${esc(a)} ${pct(p)}, ${esc(b)} ${pct(1 - p)}">
          <div class="pa" style="flex-basis:${(p * 100).toFixed(2)}%">${pct(p)}</div>
          <div class="pb" style="flex-basis:${((1 - p) * 100).toFixed(2)}%">${pct(1 - p)}</div>
        </div>
        <div class="verdict-line">
          <strong>Pick: ${esc(pick)}</strong>
          <span class="pill">${confidence(p, fa, fb)}</span>
          <span class="muted">Most likely: ${esc(best[0])} by ${best[1]} (${pct(best[2], 0)}) · Goes the distance ${pct(dist, 0)}</span>
          ${readVal ? `<span class="pill edit num">Your read moves this ${((p - base.p) * 100 >= 0 ? "+" : "")}${((p - base.p) * 100).toFixed(1)} pts for ${esc(a)}</span>` : ""}
          ${ea || eb ? `<span class="pill edit">Includes your fighter edits</span>` : ""}
          ${scoutLogit(a, b) ? (() => { const q = predict(a, b, rounds, { noScout: true }).p; return `<span class="pill num" title="Claude's scouting read (see Scouting below)">Scouting read moves this ${((p - q) * 100 >= 0 ? "+" : "")}${((p - q) * 100).toFixed(1)} pts for ${esc(a)}</span>`; })() : ""}
          ${market}
        </div>
      </section>

      <div class="grid2">
        <section class="panel stack">
          <div>
            <h3>Method of victory</h3>
            <div class="methods" style="margin-top:8px">
              ${["a", "b"].map((side) => `
                <div class="mhead" style="color:var(--${side === "a" ? "red" : "blue"})">${esc(side === "a" ? a : b)}</div>
                ${MMAEngine.BUCKETS.map((m) => `
                  <div class="mrow num"><span>${m === "DEC" ? "Decision" : m === "SUB" ? "Submission" : "KO/TKO"}</span>
                    <span class="mtrack"><div style="width:${(r.methods[side][m] * 100).toFixed(2)}%;background:var(--${side === "a" ? "red" : "blue"})"></div></span>
                    <span style="text-align:right">${pct(r.methods[side][m], 0)}</span></div>`).join("")}`).join("")}
            </div>
          </div>
          <div>
            <h3>What's driving it</h3>
            <p class="muted" style="margin:4px 0 8px;font-size:13px">Each bar is that factor's pull on the log-odds. Left favours ${esc(a)}, right favours ${esc(b)}.</p>
            ${factorBars(r.factors)}
          </div>
        </section>

        <section class="panel stack">
          <div>
            <h3>Your read on this fight</h3>
            <p class="muted" style="margin:4px 0 8px;font-size:13px">For things the numbers can't see: a bad weight cut, an injury in camp, a short-notice replacement, a style the model underrates.</p>
            <div class="read">
              <input type="range" id="read" min="-1.5" max="1.5" step="0.05" value="${(-readVal).toFixed(2)}" aria-label="Shift toward red or blue corner">
              <div class="readscale num"><span style="color:var(--red)">◀ Toward ${esc(a)}</span><span>${readVal ? `${readVal > 0 ? "+" : ""}${readVal.toFixed(2)} log-odds` : "No change"}</span><span style="color:var(--blue)">Toward ${esc(b)} ▶</span></div>
              <textarea id="read-note" placeholder="Why? (saved with the adjustment)">${esc(readNote)}</textarea>
              <div><button class="btn small" id="read-clear" type="button" ${md.doc ? "" : "disabled"}>Clear my read</button></div>
            </div>
          </div>
          <div>
            <h3>Matchup patterns</h3>
            <ul class="notes" style="margin-top:8px">
              ${ea && ea.note ? `<li class="mine">Your note on ${esc(a)}: ${esc(ea.note)}</li>` : ""}
              ${eb && eb.note ? `<li class="mine">Your note on ${esc(b)}: ${esc(eb.note)}</li>` : ""}
              ${readNote ? `<li class="mine">Your read: ${esc(readNote)}</li>` : ""}
              ${r.insights.map((t) => `<li>${esc(t)}</li>`).join("") || `<li class="muted">No strong stylistic edges detected.</li>`}
            </ul>
          </div>
        </section>
      </div>

      ${scoutPanel(a, b)}
      <section class="panel stack">
        <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
          <h3>Tale of the tape</h3>
          <span class="muted" style="font-size:13px">Type over any number to apply what you know. Edited values turn amber and are saved; ↺ resets one.</span>
        </div>
        ${noStats.length ? `<div class="nostats">No verified per-fight stats for ${esc(noStats.join(" and "))} yet (they come from UFCStats, which covers UFC bouts only), so rows marked * show league averages. Edit them from what you've seen.</div>` : ""}
        <div class="tape-wrap"><table class="tape num">
          <thead><tr><th class="a">${nameLink(a)}</th><th></th><th class="b">${nameLink(b)}</th></tr></thead>
          <tbody>
            <tr><td class="va">${record(fa)}</td><td class="attr">Record</td><td class="vb">${record(fb)}</td></tr>
            <tr><td class="va">${esc(fa.stance || "—")}</td><td class="attr">Stance</td><td class="vb">${esc(fb.stance || "—")}</td></tr>
            <tr><td class="va">${state.engine.classify(fa).join(", ")}</td><td class="attr">Style</td><td class="vb">${state.engine.classify(fb).join(", ")}</td></tr>
            <tr class="group"><td colspan="3">Ratings <span>1500 = average. Overall = ${Object.entries(state.data.category_weights).map(([c, w]) => `${Math.round(w * 100)}% ${c}`).join(" + ")}</span></td></tr>
            <tr><td class="va">${eloCell(a, fa)}</td><td class="attr"><strong>Overall</strong>${infoBtn("overall", "Overall")}</td><td class="vb">${eloCell(b, fb)}</td></tr>
            ${Object.entries(state.data.rating_categories).map(([cat, keys]) => `
              <tr class="cat"><td class="va">${catCell(fa, fb, cat, "a")}</td><td class="attr"><strong>${cat[0].toUpperCase() + cat.slice(1)}</strong>${infoBtn(cat, cat)}</td><td class="vb">${catCell(fa, fb, cat, "b")}</td></tr>
              ${keys.map((k) => tapeRow(RATING_ATTRS[k], a, fa, b, fb)).join("")}`).join("")}
            ${ATTRS.filter((at) => at.outside).map((at) => tapeRow(at, a, fa, b, fb)).join("")}
            ${intangRows(a, b)}
            <tr class="group"><td colspan="3">Career stats</td></tr>
            ${ATTRS.filter((at) => !at.wear && !at.outside).map((at) => tapeRow(at, a, fa, b, fb)).join("")}
            <tr class="group"><td colspan="3">Wear and tear <span>Mileage and damage, weighted more heavily past 30. A 30-year-old with 50 fights is older than one with 5.</span></td></tr>
            <tr><td class="va">${fa.wins + fa.losses + fa.prior_wins + fa.prior_losses}</td><td class="attr">Pro fights</td><td class="vb">${fb.wins + fb.losses + fb.prior_wins + fb.prior_losses}</td></tr>
            ${ATTRS.filter((at) => at.wear).map((at) => tapeRow(at, a, fa, b, fb)).join("")}
            <tr class="cat"><td class="va">${wearCell(fa, fb)}</td><td class="attr"><strong>Wear index</strong></td><td class="vb">${wearCell(fb, fa)}</td></tr>
          </tbody>
        </table></div>
      </section>

      <section class="fnotes">
        ${[[a, fa, "red"], [b, fb, "blue"]].map(([n, f, c]) => `
          <div class="panel fnote">
            <div class="hd"><h3 style="color:var(--${c})">${nameLink(n)}</h3>
              ${state.adj.fighters[n] ? `<button class="btn small" data-clear-fighter="${esc(n)}" type="button">Clear all edits</button>` : ""}</div>
            ${backgroundBlock(f)}
            <textarea id="note-${c}" data-note="${esc(n)}" placeholder="Your scouting note on ${esc(n)} (camp, injuries, how they've looked)">${esc((state.adj.fighters[n] || {}).note || "")}</textarea>
            <div class="label">Recent fights · judge how they performed</div>
            <table class="recent num"><tbody>
              ${f.recent.map((x) => `<tr><td>${esc(x.date)}</td><td class="res-${x.result}">${x.result}</td><td>${nameLink(x.opponent)}</td><td>${esc(x.method)} R${x.round}</td>
                <td><button class="btn small" type="button" data-judge="${esc(n)}" data-date="${esc(x.date)}" data-opp="${esc(x.opponent)}">Judge</button></td></tr>
                ${state.judging && state.judging.fighter === n && state.judging.date === x.date ? `<tr><td colspan="5">${judgeForm(c)}</td></tr>` : ""}`).join("")}
            </tbody></table>
            ${commentaryList(n, f)}
          </div>`).join("")}
      </section>
    </div>`;
    view.innerHTML = html;
  }

  function factorBars(factors) {
    const labels = state.data.feature_labels;
    const shown = factors.filter(([, c]) => Math.abs(c) >= 0.005).slice(0, 9);
    if (!shown.length) return `<p class="muted">The model sees these two as even on every factor.</p>`;
    const max = Math.max(0.5, ...shown.map(([, c]) => Math.abs(c)));
    return `<div class="factors">${shown.map(([k, c]) => {
      const w = (Math.abs(c) / max) * 50;
      const left = c > 0 ? 50 - w : 50;
      return `<div class="frow num"><span>${esc(labels[k] || EXTRA_LABELS[k] || k)}</span>
        <span class="fbar"><div style="left:${left}%;width:${w}%;background:var(--${c > 0 ? "red" : "blue"})"></div></span>
        <span style="text-align:right">${c > 0 ? "+" : "−"}${Math.abs(c).toFixed(2)}</span></div>`;
    }).join("")}
      <div class="faxis"><span></span><span><span>${esc(state.m.a)}</span><span>${esc(state.m.b)}</span></span><span></span></div></div>`;
  }

  function wearCell(me, other) {
    const w = MMAEngine.wearIndex(me), aged = MMAEngine.wearPenalty(me);
    const less = aged < MMAEngine.wearPenalty(other) - 1e-9;
    return `<span class="catval ${less ? "better" : ""}">${w.toFixed(1)}<span class="muted"> (×age ${aged.toFixed(1)})</span></span>`;
  }
  function backgroundBlock(f, opts = {}) {
    const bg = opts.noSummary && f.background ? Object.assign({}, f.background, { summary: "" }) : f.background;
    const ped = Object.entries(f.pedigree || {}).filter(([, v]) => v >= 1).sort((u, v) => v[1] - u[1]);
    if (!bg && !ped.length) return `<p class="muted" style="font-size:13px;margin:0">No background researched yet.</p>`;
    return `<div class="bg">
      ${bg && bg.summary ? `<p>${esc(bg.summary)}</p>` : ""}
      ${bg && bg.credentials.length ? `<ul>${bg.credentials.map((c) => `<li><span class="pill">${esc(c.discipline.replace("_", " "))} · ${esc(c.level)}</span> ${esc(c.detail)}${c.source ? ` <a href="${esc(c.source)}" target="_blank" rel="noopener">source</a>` : ""}</li>`).join("")}</ul>` : ""}
      ${ped.length ? `<p class="muted" style="font-size:13px">Pedigree still adds: ${ped.map(([k, v]) => `${esc(state.data.rating_labels[k])} +${Math.round(v)}`).join(", ")} (fades as MMA fights accumulate)</p>` : ""}
    </div>`;
  }
  const RATING_WORDS = { "-2": "Dominated", "-1": "Lost it", "0": "Even", "1": "Won it", "2": "Dominant" };
  function judgeForm(c) {
    const j = state.judging;
    return `<div class="judge">
      <span>${esc(j.fighter)} vs ${esc(j.opp)}: in</span>
      <select id="judge-cat-${c}">${["striking", "wrestling", "grappling"].map((k) => `<option value="${k}">${k}</option>`).join("")}</select>
      <select id="judge-rating-${c}">${[2, 1, 0, -1, -2].map((v) => `<option value="${v}" ${v === 0 ? "selected" : ""}>${RATING_WORDS[v]}</option>`).join("")}</select>
      <input id="judge-note-${c}" type="text" placeholder="What did you see? (e.g. survived back mount for a full round)">
      <button class="btn small primary" type="button" data-judge-save="${c}">Save</button>
      <button class="btn small" type="button" data-judge-cancel="1">Cancel</button>
    </div>`;
  }
  function commentaryList(n, f) {
    const mine = state.commentary.filter((x) => x.fighter === n);
    const theirs = (f.notes || []).filter((x) => x.fighter === n);
    if (!mine.length && !theirs.length) return "";
    const row = (x, own) => `<li><span class="pill ${own ? "edit" : ""}">${esc(x.category)}: ${RATING_WORDS[String(Math.round(x.rating))] || x.rating}</span> vs ${esc(x.opponent)} (${esc(x.date)})${x.note ? `: ${esc(x.note)}` : ""}
      ${x.source ? ` <a href="${esc(x.source)}" target="_blank" rel="noopener">source</a>` : ""}${own ? ` <button class="btn link" type="button" data-del-comment="${esc(x.id)}">remove</button>` : ""}</li>`;
    return `<div><div class="label">Fight commentary</div><ul class="notes" style="margin-top:4px">
      ${theirs.map((x) => row(x, false)).join("")}${mine.map((x) => row(x, true)).join("")}</ul>
      ${mine.length ? `<p class="muted" style="font-size:12px;margin:4px 0 0">Your judgments (amber) are saved now and feed the ratings when the data is next rebuilt.</p>` : ""}</div>`;
  }

  function eloCell(name, f) {
    const nudge = (state.adj.fighters[name] || {}).elo || 0;
    const side = name === state.m.a ? "a" : "b";
    const other = side === "a" ? fighter(state.m.b) : fighter(state.m.a);
    const better = other && f.elo > other.elo + 1e-9;
    return `<span class="cell ${nudge ? "edited" : ""} ${better ? "better" : ""}"><span>${Math.round(f.elo)}</span>
      <span class="elo-nudge">nudge all <input id="elo-${side}" type="number" step="10" value="${nudge || ""}" placeholder="0" data-elo="${esc(name)}" aria-label="Nudge every rating for ${esc(name)}"></span></span>`;
  }
  function catCell(fa, fb, cat, side) {
    const [me, other] = side === "a" ? [fa, fb] : [fb, fa];
    const v = me[cat], diff = v - other[cat];
    return `<span class="catval ${diff > 1e-9 ? "better" : ""}">${Math.round(v)}<span class="muted"> (${diff >= 0 ? "+" : "−"}${Math.abs(Math.round(diff))})</span></span>`;
  }
  function tapeRow(at, a, fa, b, fb) {
    const cell = (name, f, side) => {
      const ov = ((state.adj.fighters[name] || {}).overrides || {})[at.k];
      const edited = ov !== undefined && ov !== null;
      const v = f[at.k];
      const shownVal = v === null || v === undefined ? "" : fmt(at, v);
      const cmp = compare(at, fa[at.k], fb[at.k]);
      const better = (side === "a" && cmp > 0) || (side === "b" && cmp < 0);
      return `<span class="cell ${edited ? "edited" : ""} ${better ? "better" : ""}">
        ${side === "b" ? `<button class="reset" type="button" data-reset="${esc(name)}" data-key="${at.k}" title="Reset to data">↺</button>` : ""}
        <input id="t-${side}-${at.k}" type="text" inputmode="decimal" value="${shownVal}" data-attr="${at.k}" data-fighter="${esc(name)}" aria-label="${esc(at.label)} for ${esc(name)}">
        ${at.kind === "pct" ? `<span class="unit">%</span>` : at.unit ? `<span class="unit">${at.unit}</span>` : ""}
        ${side === "a" ? `<button class="reset" type="button" data-reset="${esc(name)}" data-key="${at.k}" title="Reset to data">↺</button>` : ""}
      </span>`;
    };
    const star = at.stat && (!fa.stat_minutes || !fb.stat_minutes) ? " *" : "";
    return `<tr><td class="va">${cell(a, fa, "a")}</td><td class="attr">${esc(at.label)}${star}${infoBtn(at.k, at.label)}</td><td class="vb">${cell(b, fb, "b")}</td></tr>`;
  }
  // ------------------------------------------------------------------- info
  // What each rating or stat measures, opened by the (i) buttons.
  function infoFor(key) {
    const d = state.data, RH = d.rating_help || {}, IN = d.intangibles || {};
    const recordsNote = "The current data is Sherdog fight records, so this is the evidence in use now.";
    if (RH[key] || (key.startsWith("r_") && RH[key.slice(2)])) {
      const h = RH[key] || RH[key.slice(2)];
      const cat = Object.entries(d.rating_categories).find(([, ks]) => ks.includes(key.slice(2)));
      const title = key.startsWith("r_") ? d.rating_labels[key.slice(2)] : key[0].toUpperCase() + key.slice(1);
      const rows = [["What it measures", h.measures], ["With per-fight stats", h.stats], ["With records only", h.records + " " + recordsNote]];
      if (key.startsWith("r_") && cat) rows.push(["Part of", `${cat[0][0].toUpperCase() + cat[0].slice(1)} (the mean of ${cat[1].map((k) => d.rating_labels[k]).join(", ")}).`]);
      rows.push(["Always", "Judged against the opponent's level: surviving an elite grappler counts more than surviving an average one. Background credentials add a head start that fades over about 10 fights; your fight commentary and edits count on top. 1500 is average."]);
      return { title, rows, key: key === "overall" ? "elo" : key };
    }
    if (key === "scouting") {
      return { title: "Scouting", key, rows: [
        ["What it is", "Claude reads the major MMA outlets every week (MMA Fighting, Sherdog, Bloody Elbow, Cageside Press, MMA Mania, BJPenn.com, MMA Weekly, LowKick MMA, ESPN, UFC.com) plus fight previews and breakdowns, and writes a report on each fighter: how they actually fight, their habits, what's worrying, how to beat them, and the news. Every claim links to its source; facts are checked against the verified fight records."],
        ["The read", "For each bout Claude then makes a read: a lean of up to 0.8 log-odds toward one fighter, for what the numbers can't see (style matchups, layoffs, weight cuts, short notice, age). It's added to the prediction as its own factor, on this site and in the AI Picks betting sheet."],
        ["Keeping it honest", "Every read is graded after the fight against the model alone. Pundits' picks are recorded and graded too; each counts equally until they have a long enough record to prove they beat, or trail, the betting market."]] };
    }
    if (key === "recaps") {
      const R = state.data.recaps || {}, w = R.blend_weights;
      return { title: "Card recaps", key, rows: [
        ["Model", "The chance our model gave the winner. For cards before live logging began, it's the walk-forward backtest: the model refitted on only the fights before that card, so it never saw the result (marked 'backtest'). From UFC 332 on, it's the live pick frozen before the card (marked 'live')."],
        ["Market", "BestFightOdds' closing line with the bookmaker's margin taken out: what the betting market believed when the fight started."],
        ["Blend", `The mix the AI Picks betting sheet uses${w ? ` (${w.model.toFixed(2)} × model + ${w.market.toFixed(2)} × market, on the log-odds scale)` : ""}, fitted on earlier fights.`],
        ["Log-loss", "The average penalty −log(chance given to what happened). A coin flip scores 0.693; lower is better. Unlike picks right, it rewards being confident when right and punishes being confident when wrong."],
        ["Why it matters", "A forecaster has to beat the closing line to make money betting. If the blend isn't beating the market over a full season, the betting sheet should lean harder on the market."]] };
    }
    if (key === "prospects") {
      const P = state.pros.data || {};
      return { title: "How prospects are chosen and ranked", key, rows: [
        ["Who qualifies", "Under 28, fewer than 14 professional fights, never fought in a major promotion (UFC, PFL or Bellator, ONE, ACA, RIZIN; the Contender Series doesn't count), and fought in the last two years."],

  // --------------------------------------------------------------- highlights
  // Uses the backtest: how often picks at this confidence won, and how the

  function patternStat(key) {

  function highlightsFor(bt, r) {
    const ins = state.data.insights;

    const pickSide = r.p >= 0.5 ? "a" : "b", pp = Math.max(r.p, 1 - r.p);

        else tags.push({ kind: "info", text: `${fact} (${record})`, key: st.key });
      } else {
        const dog = pickSide === "a" ? bt.b_id : bt.a_id;

  const TIER_LABEL = { best: "Best bet", sure: "High certainty", watch: "Upset watch", caution: "Caution", toss: "Toss-up" };

  const SEGMENT_ORDER = ["Fight card", "Main card", "Preliminary card", "Early preliminary card", "Announced"];

  const fmtOdds = (n) => (n == null ? "—" : n > 0 ? "+" + n : "−" + Math.abs(n));
  const impliedP = (n) => (n == null ? null : n > 0 ? 100 / (n + 100) : -n / (-n + 100));
  const fairP = (x, y) => { const a = impliedP(x), b = impliedP(y); return a == null || b == null ? null : a / (a + b); };
  /** BestFightOdds line for a scheduled bout, oriented to (a, b). */
  function marketFor(a, b) {
    for (const e of (state.data.upcoming || { events: [] }).events) for (const bt of e.bouts) {
      if (!bt.market) continue;

      if (bt.a_id === b && bt.b_id === a) {

        return { a_open: m.b_open, b_open: m.a_open, a_now: m.b_now, b_now: m.a_now, movement_a: (m.movement_a || []).map((x) => (x > 1 ? x / (x - 1) : x)) };

  /** Model + market blend, weighted as the backtest found best (Insights, Betting market). */
  function blendP(p, pm) {
    const bw = state.data.insights && state.data.insights.market && state.data.insights.market.blend;
    if (!bw || pm == null) return null;
    const lg = (x) => Math.log(Math.min(1 - 1e-6, Math.max(1e-6, x)) / (1 - Math.min(1 - 1e-6, Math.max(1e-6, x))));

  function sparkline(series) {

    const mk = ins.market;

        </tbody></table></div>` : ""}
        ${mk.value && mk.value.length ? `<h3 style="margin-top:14px">Where the model disagrees with the price</h3>

          ${mk.value.map((v) => `<tr><td>${Math.round(v.edge * 100)}+ pts</td><td>${v.bets}</td><td>${pct(v.win_rate)}</td><td>${pct(v.market_expected)}</td><td>${v.roi >= 0 ? "+" : "−"}${Math.abs(v.roi * 100).toFixed(1)}%</td></tr>`).join("")}

  function savedMatchups() {
    if (!state.card.length) return "";
    const rows = state.card.map((c) => {
      if (!state.byName.has(c.a) || !state.byName.has(c.b)) return `<tr><td colspan="6">${esc(c.a)} vs ${esc(c.b)} <span class="muted">(fighter not in dataset)</span></td></tr>`;
      const r = predict(c.a, c.b, c.rounds || 3);
      const pick = r.p >= 0.5 ? c.a : c.b, pp = Math.max(r.p, 1 - r.p);
      const best = [["a", c.a], ["b", c.b]].flatMap(([s, n]) => Object.entries(r.methods[s]).map(([m, v]) => [n, m, v])).sort((u, v) => v[2] - u[2])[0];
      let edge = "";
      if (isFinite(parseFloat(c.oddsA)) && isFinite(parseFloat(c.oddsB))) {
        const mp = MMAEngine.devig(parseFloat(c.oddsA), parseFloat(c.oddsB));
        const e = (pick === c.a ? r.p - mp : (1 - r.p) - (1 - mp));
        edge = `${e >= 0 ? "+" : "−"}${(Math.abs(e) * 100).toFixed(1)}`;
      }
      const touched = state.adj.fighters[c.a] || state.adj.fighters[c.b] || manualFor(c.a, c.b);
      return `<tr class="clickable" data-open="${esc(c.id)}">
        <td><span style="color:var(--red)">${nameLink(c.a)}</span> vs <span style="color:var(--blue)">${nameLink(c.b)}</span>${c.rounds === 5 ? ' <span class="pill">5 rds</span>' : ""}${touched ? ' <span class="pill edit">edited</span>' : ""}</td>
        <td><strong>${esc(pick)}</strong></td><td class="num">${pct(pp)}</td>
        <td>${esc(best[0])} by ${best[1]} <span class="muted num">(${pct(best[2], 0)})</span></td>
        <td class="num">${edge}</td>
        <td><button class="btn small" type="button" data-remove-card="${esc(c.id)}">Remove</button></td></tr>`;
    }).join("");
    return `<section class="panel"><div class="toolbar"><h3>Your saved matchups</h3><span class="muted" style="font-size:13px">Matchups you added from the Create a Matchup tab. Edge is model minus market (percentage points) when you entered odds.</span></div>
      <div class="table-wrap"><table class="list"><thead><tr><th>Bout</th><th>Pick</th><th>Win prob</th><th>Most likely</th><th>Edge</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }

  const WEIGHT_ORDER = ["Heavyweight", "Light Heavyweight", "Middleweight", "Welterweight", "Lightweight",
    "Featherweight", "Bantamweight", "Flyweight", "Strawweight", "Atomweight"];
  const wcRank = (wc) => { const i = WEIGHT_ORDER.indexOf(wc); return i < 0 ? 99 : i; };
  // Men's divisions heaviest to lightest, then women's.
  const divisionOrder = (x, y) => {
    const key = (d) => { const w = /^women's /i.test(d); return (w ? 100 : 0) + wcRank(d.replace(/^women's /i, "")); };
    return key(x) - key(y);
  };
  // Official UFC rank (media panel, else Meta): 0 = champion, null = unranked.
  function officialRank(f) {
    const o = f.official && (f.official.media || f.official.meta);
    if (!o) return null;
    return o.rank === "C" || o.rank === "IC" ? 0 : parseInt(o.rank, 10);
  }
  const officialLabel = (f) => { const r = officialRank(f); return r === null ? "—" : r === 0 ? "C" : "#" + r; };
  const disciplines = (f) => (f.background ? f.background.credentials.map((c) => c.discipline) : []);
  const DISC_SHORT = { wrestling: "Wrestling", bjj: "BJJ", judo: "Judo", boxing: "Boxing", kickboxing: "Kickboxing", muay_thai: "Muay Thai", karate: "Karate", sambo: "Sambo", taekwondo: "Taekwondo", grappling: "Grappling" };
  function rankOptions() {
    const base = [["proven", "Ranking (proven)"], ["elo", "Overall (unadjusted)"], ["striking", "Striking"], ["wrestling", "Wrestling"], ["grappling", "Grappling"]];
    const subs = Object.values(state.data.rating_categories).flat().map((k) => ["r_" + k, state.data.rating_labels[k]]);
    const intang = Object.values(INTANG_ATTRS).map((at) => [at.k, at.label]);
    return base.concat(intang.length ? [["intangibles", "Intangibles"]] : [], subs, intang);
  }
  function sortValue(f, key) {
    if (key === "name") return f.name;
    if (key === "weight_class") return wcRank(f.weight_class);
    if (key === "wear") return MMAEngine.wearPenalty(f);
    if (key === "record") return (f.wins + f.prior_wins) / Math.max(1, f.wins + f.losses + f.prior_wins + f.prior_losses);
    if (key === "ufc") { const r = officialRank(f); return r === null ? -Infinity : -r; }
    const v = f[key];
    return v === null || v === undefined ? -Infinity : v;
  }
  function rosterList() {
    const r = state.roster, q = r.q.toLowerCase();
    const ageMin = parseFloat(r.ageMin), ageMax = parseFloat(r.ageMax), minF = parseInt(r.minFights, 10) || 0;
    return state.data.fighters.map((f) => fighter(f.name)).filter((f) =>
      (!q || f.name.toLowerCase().includes(q) || (f.team || "").toLowerCase().includes(q) || (f.aka || []).some((x) => x.toLowerCase().includes(q))) &&
      (!r.ufcOnly || f.weight_class_source === "ufc-roster") &&
      (!r.wc || f.division === r.wc) &&
      (!r.gender || f.gender === r.gender) &&
      (r.inferred || !f.weight_class_inferred) &&
      (!r.style || state.engine.classify(f).includes(r.style)) &&
      (!r.stance || (f.stance || "") === r.stance) &&
      (!r.nat || f.nationality === r.nat) &&
      (!r.disc || disciplines(f).includes(r.disc)) &&
      (!isFinite(ageMin) || (f.age != null && f.age >= ageMin)) &&
      (!isFinite(ageMax) || (f.age != null && f.age <= ageMax)) &&
      f.fights >= minF);
  }
  function renderRoster(view) {
    const r = state.roster, fs = state.data.fighters;
    const opts = (vals, cur, all) => `<option value="">${all}</option>` + vals.map((v) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(v)}</option>`).join("");
    const uniq = (fn) => [...new Set(fs.map(fn).filter(Boolean))].sort();
    const classes = uniq((f) => f.division).sort(divisionOrder);
    const styles = [...new Set(fs.flatMap((f) => state.engine.classify(f)))].sort();
    const narrowOpen = ["style", "disc", "stance", "nat", "ageMin", "ageMax"].some((k) => r[k]) || r.minFights !== "1" || !r.inferred;
    const filters = `<div class="filters">
      <input type="search" id="roster-q" placeholder="Search fighter or team" value="${esc(r.q)}">
      <label>Division <select data-rfilter="wc">${opts(classes, r.wc, "All")}</select></label>
      <label class="check"><input type="checkbox" data-rfilter="ufcOnly" ${r.ufcOnly ? "checked" : ""}> Current UFC roster only</label>
      <label>Gender <select data-rfilter="gender"><option value="">Any</option><option value="M" ${r.gender === "M" ? "selected" : ""}>Men</option><option value="F" ${r.gender === "F" ? "selected" : ""}>Women</option></select></label>
      </div><details class="more-filters" ${narrowOpen || window.innerWidth > 820 ? "open" : ""}><summary>More filters</summary><div class="filters" style="margin-top:8px">
      <label>Style <select data-rfilter="style">${opts(styles, r.style, "Any")}</select></label>
      <label>Background <select data-rfilter="disc">${opts([...new Set(fs.flatMap(disciplines))].sort(), r.disc, "Any")}</select></label>

      <label>Country <select data-rfilter="nat">${opts(uniq((f) => f.nationality), r.nat, "Any")}</select></label>
      <label>Age <input type="number" data-rfilter="ageMin" value="${esc(r.ageMin)}" placeholder="min" min="16" max="50"> – <input type="number" data-rfilter="ageMax" value="${esc(r.ageMax)}" placeholder="max" min="16" max="50"></label>
      <label>Min bouts <input type="number" data-rfilter="minFights" value="${esc(r.minFights)}" min="0" max="60"></label>
      <label class="check"><input type="checkbox" data-rfilter="inferred" ${r.inferred ? "checked" : ""}> Include inferred weight classes</label>
    </div></details>`;
    const list = rosterList();
    const head = `<div class="toolbar">
      <span class="seg" role="group" aria-label="View">
        <button type="button" data-roster-view="classes" aria-pressed="${r.view === "classes"}">By weight class</button>
        <button type="button" data-roster-view="table" aria-pressed="${r.view === "table"}" title="Pound for pound: every fighter in one ranked list">P4P (Pound for Pound)</button>
      </span>
      <label class="label" for="roster-rank">Rank by</label>
      <select id="roster-rank" data-rfilter="sort">${rankOptions().map(([k, l]) => `<option value="${k}" ${r.sort === k ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
      <span class="muted num" style="font-size:13px">${list.length} of ${fs.length} fighters · click one to open their profile</span>
      ${Object.entries(r).some(([k, v]) => k in ROSTER_FILTERS && v !== ROSTER_FILTERS[k]) ? `<button class="btn small" type="button" id="roster-reset">Clear filters</button>` : ""}
    </div>`;
    view.innerHTML = `<section class="panel stack">${head}${filters}${r.view === "classes" ? classBreakout(list) : rosterTable(list)}</section>`;
  }
  const ROSTER_FILTERS = { ufcOnly: true, q: "", wc: "", gender: "", style: "", stance: "", nat: "", disc: "", ageMin: "", ageMax: "", minFights: "1", inferred: true };
  function rosterTable(list) {
    const r = state.roster;
    const sorted = list.slice().sort((x, y) => {
      const a = sortValue(x, r.sort), b = sortValue(y, r.sort);
      return typeof a === "string" ? a.localeCompare(b) * r.dir : (b - a) * -r.dir;
    }).slice(0, 400);
    const th = (key, label) => `<th><button class="sorter" type="button" data-sort="${key}">${label}${r.sort === key ? (r.dir < 0 ? " ▼" : " ▲") : ""}</button></th>`;
    const extraLabel = r.sort.startsWith("r_") ? state.data.rating_labels[r.sort.slice(2)] : r.sort.startsWith("i_") ? (attrFor(r.sort) || {}).label : r.sort === "intangibles" ? "Intangibles" : null;
    const extra = extraLabel ? th(r.sort, esc(extraLabel)) : "";
    return `<div class="table-wrap"><table class="list num"><thead><tr><th>#</th>${th("name", "Fighter")}${th("weight_class", "Class")}
      ${th("proven", "Ranking")}${th("ufc", "UFC")}${th("elo", "Overall")}${th("striking", "Striking")}${th("wrestling", "Wrestling")}${th("grappling", "Grappling")}${extra}
      ${th("record", "Record")}${th("age", "Age")}${th("wear", "Wear")}${th("streak", "Streak")}<th>Style</th><th>Country</th></tr></thead><tbody>
      ${sorted.map((f, i) => `<tr class="clickable" data-profile="${esc(f.name)}"><td>${i + 1}</td>
        <td>${esc(f.name)} ${state.adj.fighters[f.name] ? '<span class="pill edit">edited</span>' : ""}${f.background && f.background.credentials.length ? ` <span class="pill" title="Combat-sports background before MMA (researched, with sources on the fighter's profile)">${esc([...new Set(f.background.credentials.map((c) => DISC_SHORT[c.discipline] || c.discipline.replace("_", " ")))].slice(0, 3).join(" · "))}</span>` : ""}</td>
        <td>${esc(f.division || "—")}${f.weight_class_inferred ? '<span class="muted" title="Inferred from opponents">*</span>' : ""}</td>
        <td><strong>${Math.round(f.proven)}</strong></td><td>${officialLabel(f)}</td><td>${Math.round(f.elo)} <span class="muted" style="font-size:12px">±${Math.round(f.rd)}</span></td><td>${Math.round(f.striking)}</td><td>${Math.round(f.wrestling)}</td><td>${Math.round(f.grappling)}</td>
        ${extra ? `<td><strong>${Math.round(f[r.sort])}</strong></td>` : ""}
        <td>${record(f)}</td><td>${f.age ? f.age.toFixed(0) : "—"}</td><td>${MMAEngine.wearPenalty(f).toFixed(1)}</td>
        <td>${f.streak > 0 ? "W" + f.streak : f.streak < 0 ? "L" + -f.streak : "—"}</td>
        <td>${state.engine.classify(f).join(", ")}</td><td>${esc(f.nationality || "—")}</td></tr>`).join("")}
      </tbody></table></div>
      ${sorted.length === 400 ? '<p class="muted" style="font-size:13px">Showing the first 400. Filter to narrow.</p>' : ""}
      <p class="muted" style="font-size:12px;margin:0">* Weight class inferred from recent opponents (fighter page not crawled). Divisions come from the UFC roster on Wikipedia where available, otherwise Sherdog.</p>`;
  }
  function classBreakout(list) {
    const r = state.roster, key = r.sort;

    const groups = {};
    for (const f of list) (groups[f.division || "Unknown"] = groups[f.division || "Unknown"] || []).push(f);
    const order = Object.keys(groups).sort(divisionOrder);
    if (!order.length) return `<div class="empty">No fighters match these filters.</div>`;
    return `<div class="classes">${order.map((wc) => {
      const g = groups[wc].slice().sort((x, y) => sortValue(y, key) - sortValue(x, key));
      const avg = g.reduce((t, f) => t + sortValue(f, key), 0) / g.length;
      const top = g[0] ? sortValue(g[0], key) : 0;
      return `<div class="wc"><div class="wc-hd"><h3>${esc(wc)}</h3><span class="muted num">${g.length} fighters · avg ${Math.round(avg)}</span></div>
        <ol>${g.slice(0, 10).map((f, i) => {
          const v = sortValue(f, key), w = Math.max(4, 100 - (top - v) / 4);
          return `<li class="clickable" data-profile="${esc(f.name)}"><span class="rk num">${i + 1}</span><span class="nm" title="${esc(f.name)}">${esc(f.name)}${f.weight_class_inferred ? '<span class="muted">*</span>' : ""}</span>
            <span class="bar"><span style="width:${w.toFixed(1)}%"></span></span><span class="v num" title="Official UFC rank: ${officialLabel(f)}">${Math.round(v)}<span class="uf">${officialRank(f) === null ? "" : officialLabel(f)}</span></span></li>`;
        }).join("")}</ol>
        ${g.length > 10 ? `<button class="btn link" type="button" data-show-class="${esc(wc)}">All ${g.length} in the table</button>` : ""}</div>`;
    }).join("")}</div><p class="muted" style="font-size:12px;margin:0">Top 10 per division by ${esc(label)}. Bars show the gap to the division leader; the small grey label is the official UFC rank.</p>`;
  }

  function renderModel(view) {
    const w = weights(), trained = state.data.weights, prior = state.data.prior_weights, labels = state.data.feature_labels;
    const meta = state.data.meta;
    view.innerHTML = `<div class="stack">
      <section class="panel">
        <h3>How much each factor counts</h3>

              <input type="range" id="w-${k}" data-weight="${k}" min="${lo}" max="${hi}" step="0.01" value="${w[k]}" aria-label="${esc(labels[k] || k)} weight">

          }).join("")}
        </div>
        <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="w-reset" type="button" ${Object.keys(state.adj.weights).length ? "" : "disabled"}>Reset all to trained</button>
          <span class="status" id="status" role="status"></span></div>
      </section>
      <section class="panel"><h3>Dataset</h3>
        <p class="num" style="margin:6px 0 0">${meta.bouts.toLocaleString()} bouts through ${esc(meta.last_fight)}; ${meta.fighters_exported.toLocaleString()} active fighters shown (of ${meta.fighters_total.toLocaleString()}). Source: ${esc(meta.source || "—")}.</p>
        ${meta.backtest ? `<p class="num" style="margin:6px 0 0">Walk-forward backtest on ${meta.backtest.n.toLocaleString()} ${esc(meta.backtest.scope || "")} bouts: picked the winner ${pct(meta.backtest.accuracy)} of the time (Elo alone: ${pct(meta.backtest.elo_accuracy)}); log-loss ${meta.backtest.log_loss.toFixed(3)}.</p>` : ""}
      </section></div>`;
  }

  function renderAdjust(view) {
    const f = Object.entries(state.adj.fighters);
    const m = Object.entries(state.adj.matchups).filter(([, v]) => v.logit || v.note || hasIntang(v));
    const w = Object.entries(state.adj.weights);
    const exportObj = {
      fighters: Object.fromEntries(f.map(([n, v]) => [n, v])),
      weights: state.adj.weights,
      matchups: m.map(([, v]) => v),
      commentary: state.commentary.map(({ id, ...x }) => x),
    };
    const json = JSON.stringify(exportObj, null, 2);
    view.innerHTML = `<div class="stack">
      <section class="panel">
        <div class="toolbar"><h3>My adjustments</h3><span class="muted" style="font-size:13px">${state.storeKind === "db" ? "Saved to this page's database. Claude can read them back into the project." : "Saved in this browser only."}</span></div>
        ${!f.length && !m.length && !w.length ? `<div class="empty">Nothing yet. Edit a number in the tale of the tape, nudge a rating, set your read on a fight, or move a model weight, and it will be listed here.</div>` : ""}
        ${f.length ? `<h3 style="font-size:17px;margin-top:6px">Fighters</h3><div class="table-wrap"><table class="list num"><thead><tr><th>Fighter</th><th>Changes</th><th>Note</th><th></th></tr></thead><tbody>
          ${f.map(([n, v]) => `<tr><td>${esc(n)}</td><td>${[v.elo ? `All ratings ${v.elo > 0 ? "+" : ""}${v.elo}` : "", ...Object.entries(v.overrides || {}).map(([k, x]) => { const at = attrFor(k); return `${at ? at.label : k}: ${at ? fmt(at, x) + (at.kind === "pct" ? "%" : "") : x}`; })].filter(Boolean).map(esc).join("<br>") || "—"}</td>
            <td>${esc(v.note || "")}</td><td><button class="btn small" type="button" data-clear-fighter="${esc(n)}">Remove</button></td></tr>`).join("")}</tbody></table></div>` : ""}
        ${m.length ? `<h3 style="font-size:17px;margin-top:14px">Matchup reads</h3><div class="table-wrap"><table class="list num"><thead><tr><th>Bout</th><th>Shift</th><th>Note</th><th></th></tr></thead><tbody>
          ${m.map(([id, v]) => `<tr><td>${esc(v.a)} vs ${esc(v.b)}</td><td>${v.logit ? `${Math.abs(v.logit).toFixed(2)} toward ${esc(v.logit > 0 ? v.a : v.b)}` : "—"}</td><td>${esc(v.note)}</td><td><button class="btn small" type="button" data-remove-matchup="${esc(id)}">Remove</button></td></tr>`).join("")}</tbody></table></div>` : ""}

  // ----------------------------------------------------------------- events
  function parseInput(at, raw) {
    const v = parseFloat(String(raw).replace(/[,%]/g, ""));
    if (!isFinite(v)) return null;
    return at.kind === "pct" ? v / 100 : v;
  }
  function setFighterAdj(name, mutate) {
    const cur = JSON.parse(JSON.stringify(state.adj.fighters[name] || { elo: 0, overrides: {}, note: "" }));
    mutate(cur);
    const empty = !cur.elo && !cur.note && !Object.keys(cur.overrides).length;
    if (empty) { delete state.adj.fighters[name]; state.store.deleteFighter(name); }
    else { state.adj.fighters[name] = cur; later("fighters/" + slug(name), () => state.store.saveFighter(name, state.adj.fighters[name] || cur).then(() => setStatus("Saved"))); }
  }
  function saveRead(value, note) {
    const { a, b } = state.m;
    const md = matchupDoc(a, b);
    const logit = md.flip ? -value : value;
    const doc = md.doc ? Object.assign({}, md.doc, { logit, note }) : { a, b, logit, note };
    if (!doc.logit && !doc.note && !hasIntang(doc)) { delete state.adj.matchups[md.id]; state.store.deleteMatchup(md.id); return; }
    state.adj.matchups[md.id] = doc;
    later("matchups/" + md.id, () => state.store.saveMatchup(md.id, doc).then(() => setStatus("Saved")));
  }

  document.addEventListener("click", (e) => {
    if (e.target.id === "info-dlg") {  // a click on the backdrop lands on the dialog itself, outside its box
      const r = e.target.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) e.target.close();
      return;
    }
    if (e.target.closest("a")) return;
    const t = e.target.closest("button, tr[data-pick], tr[data-profile], li[data-profile], tr[data-open], tr[data-prospect], li[data-prospect-open]");
    if (!t) return;
    if (t.dataset.info) { e.stopPropagation(); openInfo(t.dataset.info); return; }
    if (t.dataset.infoClose) { $("#info-dlg").close(); return; }
    if (t.id === "more-btn") { moreMenu($("#more-menu").hidden); return; }
    if (t.dataset.tab && t.closest("#more-menu")) moreMenu(false, false);
    if (t.dataset.tab) { state.tab = t.dataset.tab; state.profile = null; ls.set(LOCAL_KEY + ":tab", state.tab); render(); return; }
    if (t.dataset.rounds) { state.m.rounds = +t.dataset.rounds; render(); return; }
    if (t.id === "swap") { Object.assign(state.m, { a: state.m.b, b: state.m.a, oddsA: state.m.oddsB, oddsB: state.m.oddsA }); render(); return; }
    if (t.id === "to-card") {
      const { a, b, rounds, oddsA, oddsB } = state.m;
      const id = matchupKey(a, b);
      if (state.card.some((c) => c.id === id)) { setStatus("Already on the card"); return; }
      const item = { id, a, b, rounds, oddsA, oddsB, order: Date.now() };
      state.card = state.card.concat(item); state.store.saveCard(item); render(); setStatus("Saved to Upcoming cards → Your saved matchups"); return;
    }
    if (t.dataset.reset) { const n = t.dataset.reset, k = t.dataset.key; setFighterAdj(n, (c) => { delete c.overrides[k]; }); render(); return; }
    if (t.dataset.clearFighter) { const n = t.dataset.clearFighter; delete state.adj.fighters[n]; state.store.deleteFighter(n); render(); return; }
    if (t.dataset.removeMatchup) { const id = t.dataset.removeMatchup; delete state.adj.matchups[id]; state.store.deleteMatchup(id); render(); return; }

  // ------------------------------------------------------------ scouting
  const EXTRA_LABELS = { scouting: "Claude's scouting read", intangibles: "your intangibles (1-10 scores)", manual: "your read" };
  const SLUG = (n) => String(n).normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const pairId = (a, b) => "read--" + [SLUG(a), SLUG(b)].sort().join("--");
  function setScout(docs) {
    const S = { reports: {}, reads: {}, board: null, loaded: true };
    for (const d of docs) {
      if (d.kind === "report" || (!d.kind && d.how_they_fight)) S.reports[d.name] = d;
      else if (d.kind === "read") S.reads[pairId(d.a, d.b)] = d;

  }
