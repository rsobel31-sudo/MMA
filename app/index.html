              <textarea id="read-note" placeholder="Why? (saved with the adjustment)">${esc(readNote)}</textarea>
              <div><button class="btn small" id="read-clear" type="button" ${md.doc ? "" : "disabled"}>Clear my read</button></div>
            </div>
          </div>
          <div>
            <h3>Matchup patterns</h3>
            <ul class="notes" style="margin-top:8px">
              ${ea && ea.note ? `<li class="mine">Your note on ${esc(a)}: ${esc(ea.note)}</li>` : ""}
              ${eb && eb.note ? `<li class="mine">Your note on ${esc(b)}: ${esc(eb.note)}</li>` : ""}
              ${readNote ? `<li class="mine">Your read: ${esc(readNote)}</li>` : ""}
              ${r.insights.map((t) => `<li>${esc(t)}</li>`).join("") || `<li class="muted">No strong stylistic edges detected.</li>`}
            </ul>
          </div>
        </section>
      </div>

      ${scoutPanel(a, b)}
      <section class="panel stack">
        <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
          <h3>Tale of the tape</h3>
          <span class="muted" style="font-size:13px">Type over any number to apply what you know. Edited values turn amber and are saved; ↺ resets one.</span>
        </div>
        ${noStats.length ? `<div class="nostats">No verified per-fight stats for ${esc(noStats.join(" and "))} yet (they come from UFCStats, which covers UFC bouts only), so rows marked * show league averages. Edit them from what you've seen.</div>` : ""}
        <div class="tape-wrap"><table class="tape num">
          <thead><tr><th class="a">${nameLink(a)}</th><th></th><th class="b">${nameLink(b)}</th></tr></thead>
          <tbody>
            <tr><td class="va">${record(fa)}</td><td class="attr">Record</td><td class="vb">${record(fb)}</td></tr>
            <tr><td class="va">${esc(fa.stance || "—")}</td><td class="attr">Stance</td><td class="vb">${esc(fb.stance || "—")}</td></tr>
            <tr><td class="va">${state.engine.classify(fa).join(", ")}</td><td class="attr">Style</td><td class="vb">${state.engine.classify(fb).join(", ")}</td></tr>
            <tr class="group"><td colspan="3">Ratings <span>1500 = average. Overall = ${Object.entries(state.data.category_weights).map(([c, w]) => `${Math.round(w * 100)}% ${c}`).join(" + ")}</span></td></tr>
            <tr><td class="va">${eloCell(a, fa)}</td><td class="attr"><strong>Overall</strong>${infoBtn("overall", "Overall")}</td><td class="vb">${eloCell(b, fb)}</td></tr>
            ${Object.entries(state.data.rating_categories).map(([cat, keys]) => `
              <tr class="cat"><td class="va">${catCell(fa, fb, cat, "a")}</td><td class="attr"><strong>${cat[0].toUpperCase() + cat.slice(1)}</strong>${infoBtn(cat, cat)}</td><td class="vb">${catCell(fa, fb, cat, "b")}</td></tr>
              ${keys.map((k) => tapeRow(RATING_ATTRS[k], a, fa, b, fb)).join("")}`).join("")}
            ${ATTRS.filter((at) => at.outside).map((at) => tapeRow(at, a, fa, b, fb)).join("")}
            ${intangRows(a, b)}
            <tr class="group"><td colspan="3">Career stats</td></tr>
            ${ATTRS.filter((at) => !at.wear && !at.outside).map((at) => tapeRow(at, a, fa, b, fb)).join("")}

            ${ATTRS.filter((at) => at.wear).map((at) => tapeRow(at, a, fa, b, fb)).join("")}
            <tr class="cat"><td class="va">${wearCell(fa, fb)}</td><td class="attr"><strong>Wear index</strong></td><td class="vb">${wearCell(fb, fa)}</td></tr>
          </tbody>
        </table></div>
      </section>

      <section class="fnotes">
        ${[[a, fa, "red"], [b, fb, "blue"]].map(([n, f, c]) => `
          <div class="panel fnote">

            </tbody></table>
            ${commentaryList(n, f)}
          </div>`).join("")}
      </section>
    </div>`;
    view.innerHTML = html;
  }

  function factorBars(factors) {
    const labels = state.data.feature_labels;
    const shown = factors.filter(([, c]) => Math.abs(c) >= 0.005).slice(0, 9);
    if (!shown.length) return `<p class="muted">The model sees these two as even on every factor.</p>`;
    const max = Math.max(0.5, ...shown.map(([, c]) => Math.abs(c)));
    return `<div class="factors">${shown.map(([k, c]) => {
      const w = (Math.abs(c) / max) * 50;
      const left = c > 0 ? 50 - w : 50;
      return `<div class="frow num"><span>${esc(labels[k] || EXTRA_LABELS[k] || k)}</span>
        <span class="fbar"><div style="left:${left}%;width:${w}%;background:var(--${c > 0 ? "red" : "blue"})"></div></span>
        <span style="text-align:right">${c > 0 ? "+" : "−"}${Math.abs(c).toFixed(2)}</span></div>`;
    }).join("")}
      <div class="faxis"><span></span><span><span>${esc(state.m.a)}</span><span>${esc(state.m.b)}</span></span><span></span></div></div>`;
  }

  function wearCell(me, other) {
    const w = MMAEngine.wearIndex(me), aged = MMAEngine.wearPenalty(me);

  }

      ${ped.length ? `<p class="muted" style="font-size:13px">Pedigree still adds: ${ped.map(([k, v]) => `${esc(state.data.rating_labels[k])} +${Math.round(v)}`).join(", ")} (fades as MMA fights accumulate)</p>` : ""}

  function eloCell(name, f) {
    const nudge = (state.adj.fighters[name] || {}).elo || 0;

        <input id="t-${side}-${at.k}" type="text" inputmode="decimal" value="${shownVal}" data-attr="${at.k}" data-fighter="${esc(name)}" aria-label="${esc(at.label)} for ${esc(name)}">

    return `<tr><td class="va">${cell(a, fa, "a")}</td><td class="attr">${esc(at.label)}${star}${infoBtn(at.k, at.label)}</td><td class="vb">${cell(b, fb, "b")}</td></tr>`;

  // ------------------------------------------------------------------- info
  // What each rating or stat measures, opened by the (i) buttons.
  function infoFor(key) {
    const d = state.data, RH = d.rating_help || {}, IN = d.intangibles || {};

    if (RH[key] || (key.startsWith("r_") && RH[key.slice(2)])) {
      const h = RH[key] || RH[key.slice(2)];
      const cat = Object.entries(d.rating_categories).find(([, ks]) => ks.includes(key.slice(2)));
      const title = key.startsWith("r_") ? d.rating_labels[key.slice(2)] : key[0].toUpperCase() + key.slice(1);
      const rows = [["What it measures", h.measures], ["With per-fight stats", h.stats], ["With records only", h.records + " " + recordsNote]];
      if (key.startsWith("r_") && cat) rows.push(["Part of", `${cat[0][0].toUpperCase() + cat[0].slice(1)} (the mean of ${cat[1].map((k) => d.rating_labels[k]).join(", ")}).`]);
      rows.push(["Always", "Judged against the opponent's level: surviving an elite grappler counts more than surviving an average one. Background credentials add a head start that fades over about 10 fights; your fight commentary and edits count on top. 1500 is average."]);
      return { title, rows, key: key === "overall" ? "elo" : key };
    }
    if (key === "scouting") {
      return { title: "Scouting", key, rows: [
        ["What it is", "Claude reads the major MMA outlets every week (MMA Fighting, Sherdog, Bloody Elbow, Cageside Press, MMA Mania, BJPenn.com, MMA Weekly, LowKick MMA, ESPN, UFC.com) plus fight previews and breakdowns, and writes a report on each fighter: how they actually fight, their habits, what's worrying, how to beat them, and the news. Every claim links to its source; facts are checked against the verified fight records."],
        ["The read", "For each bout Claude then makes a read: a lean of up to 0.8 log-odds toward one fighter, for what the numbers can't see (style matchups, layoffs, weight cuts, short notice, age). It's added to the prediction as its own factor, on this site and in the AI Bets betting sheet."],
        ["Keeping it honest", "Every read is graded after the fight against the model alone. Pundits' picks are recorded and graded too; each counts equally until they have a long enough record to prove they beat, or trail, the betting market."]] };
    }
    if (key === "recaps") {
      const R = state.data.recaps || {}, w = R.blend_weights;
      return { title: "Card recaps", key, rows: [
        ["Model", "The chance our model gave the winner. For cards before live logging began, it's the walk-forward backtest: the model refitted on only the fights before that card, so it never saw the result (marked 'backtest'). From UFC 332 on, it's the live pick frozen before the card (marked 'live')."],
        ["Market", "BestFightOdds' closing line with the bookmaker's margin taken out: what the betting market believed when the fight started."],
        ["Blend", `The mix the AI Bets betting sheet uses${w ? ` (${w.model.toFixed(2)} × model + ${w.market.toFixed(2)} × market, on the log-odds scale)` : ""}, fitted on earlier fights.`],
        ["Log-loss", "The average penalty −log(chance given to what happened). A coin flip scores 0.693; lower is better. Unlike picks right, it rewards being confident when right and punishes being confident when wrong."],
        ["Why it matters", "A forecaster has to beat the closing line to make money betting. If the blend isn't beating the market over a full season, the betting sheet should lean harder on the market."]] };
    }
    if (key === "prospects") {
      const P = state.pros.data || {};
      return { title: "How prospects are chosen and ranked", key, rows: [
        ["Who qualifies", "Under 28, fewer than 14 professional fights, a winning record, not in a major promotion, and fought in the last two years. The majors are the UFC, PFL (with Bellator), ONE, ACA and RIZIN; the Contender Series doesn't count. Anyone who has fought in the UFC is out for good. A fighter who has formally left PFL, ONE, ACA or RIZIN (their most recent fight is outside the majors) is back in, tagged with where they were (e.g. ex-ACA)."],
        ["Where they come from", `Fight Matrix's divisional rankings, which rank fighters in every promotion worldwide (${P.screened ? P.screened.toLocaleString() : "thousands of"} ranked fighters screened), plus prospects named on outlet lists and by commentators, and every fighter on the last two years of cards of leagues we sweep (RCC). A swept fighter Fight Matrix doesn't rank at all is rated below everyone it does.`],
        ["Two sources", "Each prospect's birth date, record and promotions are checked on Fight Matrix and on Sherdog (or, for list picks, Sherdog and the published list). Anyone whose sources disagree, or who shows a major-promotion fight on either, is left out."],
        ["Who called it", "Outlets, creators on X and forum posters who name prospects are tracked like the betting pundits: every call is graded on what the fighter did next (signing with a major promotion is a hit; see Signed!), and a caller's buzz is weighted up or down only once their record is long enough to show real skill (20 graded calls and a clear edge)."],
        ["The score", "50% Fight Matrix rating (as a percentile within the division; it already weighs opponent quality), 15% winning (unbeaten records get a bonus), 10% youth, 10% activity, 5% finishing rate, 10% buzz (named on independent prospect lists)."],
        ["Does it work?", "Tested on the field as it really was: every ranked fighter who fit our rules in Fight Matrix's January 2019 and January 2021 rankings (297 and 246 prospects), scored as of that date and followed for four years. Of the 2019 top 50, 76% went on to win in a major promotion (the base rate was 39%); of the 2021 top 50, 42% (base 33%). The Fight Matrix rating carries most of the signal; buzz couldn't be tested (no list history that far back)."],
        ["Refresh", "The list is rebuilt as the data is re-crawled; a prospect who signs with a major promotion drops off."]] };
    }
    if (key === "my_pickem") {
      return { title: "How My Picks works", key, rows: [
        ["The game", "No money: pick every bout on the card, the winner, how it ends (KO/TKO, submission or decision) and, for a finish, the round. Claude plays the same game in AI Picks, and the leaderboard ranks everyone, Claude included."],
        ["Scoring", "The same as AI Picks: 2 points for the winner, 1 more for the method when the winner is right, and a bonus point when the round is right too (4 at most per bout). A decision goes the distance, so a right decision pick earns the bonus."],
        ["Locking and grading", "Picks save as you make them and lock when the card starts; anything saved after the lock doesn't count. After the card, Claude grades everyone from results Wikipedia and Sherdog agree on, the same results Claude's own picks are graded on."],
        ["Against Claude", "Your record shows how Claude scored on the same bouts you picked, so the comparison is like for like even if you skip a fight."],
        ["Who can play", "Anyone the page is shared with as a Contributor (or above). Viewers from a public link can watch the leaderboard."]] };
    }
    if (key === "my_picks") {
      return { title: "How My Bets works", key, rows: [
        ["The game", "Everyone who plays starts with $100 of play money and bets UFC cards at FanDuel's prices: moneylines, method, rounds, over/unders and parlays across different bouts. Claude plays the same game in AI Bets; the leaderboard ranks everyone, Claude included."],
        ["Prices", "The board is FanDuel's prices as listed on BestFightOdds when Claude last checked (Tuesday and Friday). Your bet is recorded at the board's price."],
        ["Locking and grading", "Betting closes when the card starts. After the card, Claude grades every bet from results that Wikipedia and Sherdog agree on, the same way it grades its own. A bet saved after the lock, at a price that wasn't on the board, or for more than your available money is voided and refunded."],
        ["Who can play", "Anyone the page is shared with as a Contributor (or above). Viewers from a public link can watch the leaderboard but can't place bets."]] };
    }
    if (key === "card_picks") {
      return { title: "How AI Picks works", key, rows: [
        ["The game", "No money. Before every UFC card Claude picks every bout: the winner, how it ends (KO/TKO, submission or decision) and the round. Picks lock when the card starts and are committed to the project's history first, so nothing is picked after the fact."],
        ["Scoring", "2 points for the winner, 1 more for the method when the winner is right, and a bonus point when the winner, method and round are all right: 4 at most per bout. A decision goes the distance, so a decision pick's round is the last scheduled round. Draws, no contests and cancelled bouts don't count. Results must agree on two sources (the Wikipedia event page and Sherdog's records); the round point needs them to agree on the round too. UFC 332 was picked before rounds were added, so it scores winner and method only (3 at most per bout)."],
        ["Claude vs the model", "Each pick is stored beside the model's own pick for the same bout: the statistics alone, without Claude's scouting read. The model takes its likeliest winner and method; its round is the likeliest for that method in this fight (the league's finish timing moved by both fighters' records). The round is a nuance read: it never changes the model's winner or method. Claude reads the round fight by fight. Where Claude picks a different winner or method, that's an override, and the record shows whether overrides help or hurt."],
        ["How it updates the model", "After each card the grader compares how often the model expected each ending (KO/TKO, submission, decision) with what happened. Once 100 bouts are graded, an ending it gets wrong beyond noise (|z| ≥ 1.96) is re-weighted in the method model; once Claude has 30 overrides, they decide whether the scouting reads earn more weight or less. The lessons are listed under Track record."],
        ["AI Bets is separate", "AI Bets judges betting (prices, stakes, bankroll). AI Picks judges reading the fights."]] };
    }
    if (key === "ai_picks") {
      return { title: "How AI Bets works", key, rows: [
        ["Bankroll", "$100 to start. Every settled bet adds its profit or loses its stake; there is no top-up. Minimum bet $1: below that the bankroll is bust and an alert shows here."],
        ["Prices", "FanDuel's odds as listed on BestFightOdds when the bets are placed (Friday). A bet is recorded at that exact price, so nothing can be picked after the fact."],
        ["How Claude decides", "Each Friday a betting sheet prices every FanDuel market on the card: our win probability (the model blended with the market, as the backtest found best), method and round props from the finish model (calibrated to real decision rates, then shrunk halfway to FanDuel's price), edge, expected value and a Kelly stake. Claude then bets at its own discretion: all in, a little, or nothing."],
        ["Grading", "Results must agree on two sources (the Wikipedia event page and Sherdog's records) before a bet is settled. Draws and no contests refund moneylines; a void leg drops out of a parlay."],
        ["Honesty", "Bets are committed to the project's history before the fights, and the record keeps losses, passes and closing-line value (did we beat FanDuel's final price?). Several cards are needed before the record says anything about skill."]] };
    }
    if (key === "intangibles") {
      return { title: "Intangibles", key, rows: [
        ["What it measures", "The things stats miss: " + (IN.keys || []).map((k) => IN.labels[k]).join(", ") + "."],
        ["Your call", "Nothing is filled in. Score each fighter from 1 (poor) to 10 (elite) for this specific matchup, from what you know. Only qualities you score for both fighters count."],
        ["How it's used", `Adds ${IN.weight ?? 0.15} log-odds per point of average score gap to the prediction: a one-point edge across the board is worth about 4 percentage points near a coin flip, and 10 vs 1 on everything about 29.`]] };
    }
    if (key.startsWith("i_") && IN.help) {
      const k = key.slice(2);
      return { title: IN.labels[k], key, rows: [["What it measures", IN.help[k]], ["Your call", "Score each fighter 1 (poor) to 10 (elite) for this matchup. Blank means not scored; it only counts once both fighters have a score."]] };
    }
    const at = ATTRS.find((x) => x.k === key);
    if (at && at.help) return { title: at.label, key, rows: [["What it measures", at.help]] };
    return null;
  }
  function infoBtn(key, label) {
    return state.data && infoFor(key) ? ` <button class="info" type="button" data-info="${esc(key)}" aria-label="What ${esc(label)} measures">ⓘ</button>` : "";
  }
  function openInfo(key) {
    const info = infoFor(key);
    if (!info) return;
    const at = attrFor(key) || { k: info.key, kind: "int" };
    const vals = [];
    const show = (f, side) => {
      if (!f || f[info.key] == null) return;
      vals.push(`<span><span class="${side}">${esc(f.name)}</span> ${esc(fmt(at, f[info.key]))}${at.kind === "pct" ? "%" : at.unit ? " " + at.unit : ""}</span>`);
    };
    if (state.profile) show(fighter(state.profile), "a");
    else { show(fighter(state.m.a), "a"); show(fighter(state.m.b), "b"); }
    $("#info-body").innerHTML = `<h3 id="info-title">${esc(info.title)}</h3><dl>${info.rows.filter((r) => r[1]).map(([h, t]) => `<dt>${esc(h)}</dt><dd>${esc(t)}</dd>`).join("")}</dl>
      ${vals.length ? `<div class="vals">${vals.join("")}</div>` : ""}`;
    const dlg = $("#info-dlg");
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  }

  function intangRows(a, b) {
    const IN = state.data.intangibles || { keys: [] };
    if (!IN.keys.length) return "";
    const sc = intangFor(a, b), lg = state.engine.intangiblesLogit(sc.a, sc.b);
    const scored = IN.keys.filter((k) => sc.a[k] != null && sc.b[k] != null).length;
    const cell = (side, k) => `<span class="cell ${(side === "a" ? sc.a : sc.b)[k] != null ? "edited" : ""}"><input id="i-${side}-${k}" class="iscore" type="number" inputmode="numeric" min="1" max="10" step="1" placeholder="1–10" value="${(side === "a" ? sc.a : sc.b)[k] ?? ""}" data-intang="${side}|${k}" aria-label="${esc(IN.labels[k])} for ${esc(side === "a" ? a : b)}, 1 to 10"></span>`;
    return `<tr class="group"><td colspan="3">Intangibles${infoBtn("intangibles", "Intangibles")} <span>Your 1–10 read for this matchup. Left blank, they don't count; only qualities you score for both fighters do.</span></td></tr>
      ${IN.keys.map((k) => `<tr><td class="va">${cell("a", k)}</td><td class="attr">${esc(IN.labels[k])}${infoBtn("i_" + k, IN.labels[k])}</td><td class="vb">${cell("b", k)}</td></tr>`).join("")}
      <tr><td colspan="3" class="muted" style="text-align:center;font-size:13px">${scored ? `${scored} of ${IN.keys.length} scored for both · moves the pick ${Math.abs(lg) < 1e-9 ? "nowhere (even)" : `toward <strong>${esc(lg > 0 ? a : b)}</strong> (${lg > 0 ? "+" : "−"}${Math.abs(lg).toFixed(2)} log-odds)`}` : "Not scored yet: the prediction is data only."}</td></tr>`;
  }
  function compare(at, x, y) {
    if (x == null || y == null || Math.abs(x - y) < 1e-9) return 0;
    return (x > y ? 1 : -1) * (at.better === "low" ? -1 : 1);
  }

  // --------------------------------------------------------------- highlights
  // Uses the backtest: how often picks at this confidence won, and how the
  // side with each matched pattern has done against the model's expectation.
  function patternStat(key) {
    const ins = state.data.insights;
    return ins ? ins.patterns.find((p) => p.key === key) : null;
  }
  function highlightsFor(bt, r) {
    const ins = state.data.insights;
    if (!ins || !r) return { tier: null, tags: [] };
    const pickSide = r.p >= 0.5 ? "a" : "b", pp = Math.max(r.p, 1 - r.p);
    const band = ins.calibration.find((b) => pp >= b.from && pp < b.to + 1e-9);
    const tags = [];
    const sure = pp >= 0.7 && band && band.n >= 40 && band.hit_rate >= 0.78;
    if (sure) tags.push({ kind: "sure", text: `High certainty: picks at ${pct(band.from, 0)}–${pct(band.to, 0)} won ${pct(band.hit_rate, 0)} of ${band.n} past bouts` });
    let backed = 0, caution = 0, upset = 0;
    for (const pt of bt.patterns || []) {
      const st = patternStat(pt.key);
      if (!st || st.n < 50) continue;
      // Only a significant miscalibration counts (analysis.py: |z| >= 1.96); "leaning ..." is noise-level.
      const overrates = st.verdict === "model overrates", underrates = st.verdict === "model underrates";
      const fact = pt.detail || st.label;
      const record = `fighters with this edge won ${pct(st.win_rate, 0)} of ${st.n} past UFC bouts`;
      if (pt.side === pickSide) {
        if (overrates) { caution++; tags.push({ kind: "caution", text: `${fact}. Caution: the model has overrated this edge (${record}, vs ${pct(st.expected, 0)} expected)`, key: st.key }); }
        else if (st.win_rate >= 0.65) { backed++; tags.push({ kind: "backed", text: `${fact}. Supports the pick: ${record}`, key: st.key }); }
        else tags.push({ kind: "info", text: `${fact} (${record})`, key: st.key });
      } else {
        const dog = pickSide === "a" ? bt.b_id : bt.a_id;
        if (underrates || (st.win_rate >= 0.65 && pp < 0.62)) { upset++; tags.push({ kind: "upset", text: `${fact}. Edge to the underdog, ${dog}: ${record}${underrates ? ", more than the model expected" : ""}`, key: st.key }); }
        else tags.push({ kind: "info", text: `${fact} (edge to ${dog}; ${record})`, key: st.key });
      }
    }
    if (pp < 0.56) tags.push({ kind: "toss", text: "Toss-up: picks this close have won about half the time" });
    // Upset watch = the underdog has an edge that has historically won; Caution = the pick leans on an
    // edge the model has significantly overrated. Neither overrides a clean high-certainty pick.
    const tier = sure && backed && !caution && !upset ? "best" : sure && !caution ? "sure" : upset ? "watch" : caution ? "caution" : pp < 0.56 ? "toss" : null;
    // Most telling reasons first; plain pattern matches are left out.
    const rank = { sure: 0, caution: 1, upset: 2, backed: 3, toss: 4 };
    const shown = tags.filter((t) => t.kind in rank).sort((x, y) => rank[x.kind] - rank[y.kind]).slice(0, 3);
    return { tier, tags: shown, all: tags };
  }
  const TIER_LABEL = { best: "Best bet", sure: "High certainty", watch: "Upset watch", caution: "Caution", toss: "Toss-up" };

  // ---------------------------------------------------------- upcoming cards

  const WEIGHT_ORDER = ["Heavyweight", "Light Heavyweight", "Middleweight", "Welterweight", "Lightweight",

  // Official UFC rank (media panel, else Meta): 0 = champion, null = unranked.

  const DISC_SHORT = { wrestling: "Wrestling", bjj: "BJJ", judo: "Judo", boxing: "Boxing", kickboxing: "Kickboxing", muay_thai: "Muay Thai", karate: "Karate", sambo: "Sambo", taekwondo: "Taekwondo", grappling: "Grappling" };
  function rankOptions() {

    const subs = Object.values(state.data.rating_categories).flat().map((k) => ["r_" + k, state.data.rating_labels[k]]);
    const intang = Object.values(INTANG_ATTRS).map((at) => [at.k, at.label]);
    return base.concat(intang.length ? [["intangibles", "Intangibles"]] : [], subs, intang);
  }
  function sortValue(f, key) {
    if (key === "name") return f.name;
    if (key === "weight_class") return wcRank(f.weight_class);
    if (key === "wear") return MMAEngine.wearPenalty(f);
    if (key === "record") return (f.wins + f.prior_wins) / Math.max(1, f.wins + f.losses + f.prior_wins + f.prior_losses);
    if (key === "ufc") { const r = officialRank(f); return r === null ? -Infinity : -r; }
    const v = f[key];
    return v === null || v === undefined ? -Infinity : v;
  }
  function rosterList() {
    const r = state.roster, q = r.q.toLowerCase();

      (!q || f.name.toLowerCase().includes(q) || (f.team || "").toLowerCase().includes(q) || (f.aka || []).some((x) => x.toLowerCase().includes(q))) &&

        <button type="button" data-roster-view="table" aria-pressed="${r.view === "table"}" title="Pound for pound: every fighter in one ranked list">P4P (Pound for Pound)</button>

      <select id="roster-rank" data-rfilter="sort">${rankOptions().map(([k, l]) => `<option value="${k}" ${r.sort === k ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>

  }
  const ROSTER_FILTERS = { ufcOnly: true, q: "", wc: "", gender: "", style: "", stance: "", nat: "", disc: "", ageMin: "", ageMax: "", minFights: "1", inferred: true };
  function rosterTable(list) {

      </tbody></table></div>

  function classBreakout(list) {

  }

  function renderModel(view) {

    view.innerHTML = `<div class="stack">
      <section class="panel">
        <h3>How much each factor counts</h3>
        <p class="muted" style="margin:4px 0 12px">Weights were ${meta.trained_on ? `learned from ${meta.trained_on.toLocaleString()} past bouts` : "set from MMA conventions (not yet trained)"}. Drag to change how much the model trusts a factor; 0 ignores it. Your changes apply to every prediction and turn amber.</p>
        <div class="weights">
          ${state.data.features.map((k) => {
            const [lo, hi] = WEIGHT_RANGE[k] || [-0.5, 1.5];
            const edited = k in state.adj.weights;
            return `<div class="wrow num ${edited ? "edited" : ""}"><span class="wname">${esc(labels[k] || k)}</span>
              <input type="range" id="w-${k}" data-weight="${k}" min="${lo}" max="${hi}" step="0.01" value="${w[k]}" aria-label="${esc(labels[k] || k)} weight">
              <span class="wv">${w[k].toFixed(2)}</span>
              <span class="muted" style="font-size:12px" title="Trained weight">data ${trained[k].toFixed(2)}</span></div>`;
          }).join("")}
        </div>
        <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="w-reset" type="button" ${Object.keys(state.adj.weights).length ? "" : "disabled"}>Reset all to trained</button>
          <span class="status" id="status" role="status"></span></div>
      </section>
      <section class="panel"><h3>Dataset</h3>
        <p class="num" style="margin:6px 0 0">${meta.bouts.toLocaleString()} bouts through ${esc(meta.last_fight)}; ${meta.fighters_exported.toLocaleString()} active fighters shown (of ${meta.fighters_total.toLocaleString()}). Source: ${esc(meta.source || "—")}.</p>
        ${meta.backtest ? `<p class="num" style="margin:6px 0 0">Walk-forward backtest on ${meta.backtest.n.toLocaleString()} ${esc(meta.backtest.scope || "")} bouts: picked the winner ${pct(meta.backtest.accuracy)} of the time (Elo alone: ${pct(meta.backtest.elo_accuracy)}); log-loss ${meta.backtest.log_loss.toFixed(3)}.</p>` : ""}
      </section></div>`;
  }

  function renderAdjust(view) {
    const f = Object.entries(state.adj.fighters);
    const m = Object.entries(state.adj.matchups).filter(([, v]) => v.logit || v.note || hasIntang(v));
    const w = Object.entries(state.adj.weights);
    const exportObj = {
      fighters: Object.fromEntries(f.map(([n, v]) => [n, v])),
      weights: state.adj.weights,
      matchups: m.map(([, v]) => v),
      commentary: state.commentary.map(({ id, ...x }) => x),
    };
    const json = JSON.stringify(exportObj, null, 2);
    view.innerHTML = `<div class="stack">
      <section class="panel">
        <div class="toolbar"><h3>My adjustments</h3><span class="muted" style="font-size:13px">${state.storeKind === "db" ? "Saved to this page's database. Claude can read them back into the project." : "Saved in this browser only."}</span></div>
        ${!f.length && !m.length && !w.length ? `<div class="empty">Nothing yet. Edit a number in the tale of the tape, nudge a rating, set your read on a fight, or move a model weight, and it will be listed here.</div>` : ""}
        ${f.length ? `<h3 style="font-size:17px;margin-top:6px">Fighters</h3><div class="table-wrap"><table class="list num"><thead><tr><th>Fighter</th><th>Changes</th><th>Note</th><th></th></tr></thead><tbody>
          ${f.map(([n, v]) => `<tr><td>${esc(n)}</td><td>${[v.elo ? `All ratings ${v.elo > 0 ? "+" : ""}${v.elo}` : "", ...Object.entries(v.overrides || {}).map(([k, x]) => { const at = attrFor(k); return `${at ? at.label : k}: ${at ? fmt(at, x) + (at.kind === "pct" ? "%" : "") : x}`; })].filter(Boolean).map(esc).join("<br>") || "—"}</td>
            <td>${esc(v.note || "")}</td><td><button class="btn small" type="button" data-clear-fighter="${esc(n)}">Remove</button></td></tr>`).join("")}</tbody></table></div>` : ""}
        ${m.length ? `<h3 style="font-size:17px;margin-top:14px">Matchup reads</h3><div class="table-wrap"><table class="list num"><thead><tr><th>Bout</th><th>Shift</th><th>Note</th><th></th></tr></thead><tbody>
          ${m.map(([id, v]) => `<tr><td>${esc(v.a)} vs ${esc(v.b)}</td><td>${v.logit ? `${Math.abs(v.logit).toFixed(2)} toward ${esc(v.logit > 0 ? v.a : v.b)}` : "—"}</td><td>${esc(v.note)}</td><td><button class="btn small" type="button" data-remove-matchup="${esc(id)}">Remove</button></td></tr>`).join("")}</tbody></table></div>` : ""}
        ${w.length ? `<h3 style="font-size:17px;margin-top:14px">Model weights</h3><p class="num">${w.map(([k, v]) => `${esc(state.data.feature_labels[k] || k)}: ${v.toFixed(2)} (data ${state.data.weights[k].toFixed(2)})`).join(" · ")}</p>` : ""}
      </section>
      <section class="panel stack">
        <div><h3>Use them in the Python tools</h3>
          <p class="muted" style="margin:4px 0 8px">Save this as <code>data/adjustments.json</code> and pass <code>--adjustments data/adjustments.json</code> to <code>predict</code> or <code>card</code>.</p>
          <pre class="json" id="json">${esc(json)}</pre>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn" id="copy-json" type="button">Copy JSON</button><span class="status" id="status" role="status"></span></div></div>
        <div><h3>Import</h3>
          <p class="muted" style="margin:4px 0 8px">Paste adjustments JSON here to merge it in.</p>
          <textarea id="import-json" rows="4" placeholder='{"fighters": {...}, "weights": {...}, "matchups": [...]}'></textarea>
          <div style="margin-top:8px"><button class="btn" id="import-btn" type="button">Merge in</button></div></div>
      </section></div>`;
  }

  // ----------------------------------------------------------------- events
  function parseInput(at, raw) {
    const v = parseFloat(String(raw).replace(/[,%]/g, ""));
    if (!isFinite(v)) return null;
    return at.kind === "pct" ? v / 100 : v;
  }
  function setFighterAdj(name, mutate) {
    const cur = JSON.parse(JSON.stringify(state.adj.fighters[name] || { elo: 0, overrides: {}, note: "" }));
    mutate(cur);
    const empty = !cur.elo && !cur.note && !Object.keys(cur.overrides).length;
    if (empty) { delete state.adj.fighters[name]; state.store.deleteFighter(name); }
    else { state.adj.fighters[name] = cur; later("fighters/" + slug(name), () => state.store.saveFighter(name, state.adj.fighters[name] || cur).then(() => setStatus("Saved"))); }
  }
  function saveRead(value, note) {
    const { a, b } = state.m;
    const md = matchupDoc(a, b);
    const logit = md.flip ? -value : value;
    const doc = md.doc ? Object.assign({}, md.doc, { logit, note }) : { a, b, logit, note };
    if (!doc.logit && !doc.note && !hasIntang(doc)) { delete state.adj.matchups[md.id]; state.store.deleteMatchup(md.id); return; }
    state.adj.matchups[md.id] = doc;
    later("matchups/" + md.id, () => state.store.saveMatchup(md.id, doc).then(() => setStatus("Saved")));
  }

  document.addEventListener("click", (e) => {
    if (e.target.id === "info-dlg") {  // a click on the backdrop lands on the dialog itself, outside its box
      const r = e.target.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) e.target.close();
      return;
    }
    if (e.target.closest("a")) return;
    const t = e.target.closest("button, tr[data-pick], tr[data-profile], li[data-profile], tr[data-open], tr[data-prospect], li[data-prospect-open]");
    if (!t) return;
    if (t.dataset.follow) {
      const u = t.dataset.follow;
      if (state.follows.has(u)) state.follows.delete(u); else state.follows.add(u);
      saveFollows(); render(); return;
    }
    if (t.dataset.info) { e.stopPropagation(); openInfo(t.dataset.info); return; }
    if (t.dataset.infoClose) { $("#info-dlg").close(); return; }
    if (t.id === "more-btn") { moreMenu($("#more-menu").hidden); return; }
    if (t.dataset.tab && t.closest("#more-menu")) moreMenu(false, false);
    if (t.dataset.tab) { state.tab = t.dataset.tab; state.profile = null; ls.set(LOCAL_KEY + ":tab", state.tab); render(); return; }
    if (t.dataset.goto) {
      const [tab, sub] = t.dataset.goto.split(":");
      state.tab = tab; state.profile = null; ls.set(LOCAL_KEY + ":tab", tab);
      if (tab === "prospects" && sub) state.pros.view = sub;
      if (tab === "card" && sub) state.cardView = sub;
      render(); window.scrollTo(0, 0); return;
    }
    if (t.dataset.rounds) { state.m.rounds = +t.dataset.rounds; render(); return; }
    if (t.id === "swap") { Object.assign(state.m, { a: state.m.b, b: state.m.a, oddsA: state.m.oddsB, oddsB: state.m.oddsA }); render(); return; }
    if (t.id === "to-card") {
      const { a, b, rounds, oddsA, oddsB } = state.m;
      const id = matchupKey(a, b);
      if (state.card.some((c) => c.id === id)) { setStatus("Already on the card"); return; }
      const item = { id, a, b, rounds, oddsA, oddsB, order: Date.now() };
      state.card = state.card.concat(item); state.store.saveCard(item); render(); setStatus("Saved to Upcoming cards → Your saved matchups"); return;
    }
    if (t.dataset.reset) { const n = t.dataset.reset, k = t.dataset.key; setFighterAdj(n, (c) => { delete c.overrides[k]; }); render(); return; }
    if (t.dataset.clearFighter) { const n = t.dataset.clearFighter; delete state.adj.fighters[n]; state.store.deleteFighter(n); render(); return; }
    if (t.dataset.removeMatchup) { const id = t.dataset.removeMatchup; delete state.adj.matchups[id]; state.store.deleteMatchup(id); render(); return; }
    if (t.dataset.removeCard) { e.stopPropagation(); const id = t.dataset.removeCard; state.card = state.card.filter((c) => c.id !== id); state.store.deleteCard(id); render(); return; }
    if (t.id === "read-clear") { saveRead(0, ""); render(); return; }
    if (t.id === "w-reset") { state.adj.weights = {}; state.store.saveWeights({}); render(); return; }
    if (t.dataset.judge) { state.judging = { fighter: t.dataset.judge, date: t.dataset.date, opp: t.dataset.opp }; render(); return; }
    if (t.dataset.judgeCancel) { state.judging = null; render(); return; }
    if (t.dataset.judgeSave) {
      const c = t.dataset.judgeSave, j = state.judging;
      const item = {
        id: slug(j.fighter) + "--" + slug(j.opp) + "--" + j.date + "--" + $("#judge-cat-" + c).value,
        date: j.date, fighter: j.fighter, opponent: j.opp, category: $("#judge-cat-" + c).value,
        rating: parseFloat($("#judge-rating-" + c).value), note: $("#judge-note-" + c).value.trim(),
      };
      state.commentary = state.commentary.filter((x) => x.id !== item.id).concat(item);
      state.store.saveComment(item); state.judging = null; render(); setStatus("Judgment saved"); return;
    }
    if (t.dataset.delComment) { const id = t.dataset.delComment; state.commentary = state.commentary.filter((x) => x.id !== id); state.store.deleteComment(id); render(); return; }
    if (t.dataset.profile) { state.profile = t.dataset.profile; state.judging = null; render(); window.scrollTo(0, 0); return; }
    if (t.id === "profile-back") { state.profile = null; render(); return; }
    if (t.dataset.corner) {
      const n = state.profile, side = t.dataset.corner, other = side === "a" ? "b" : "a";
      state.m[side] = n; if (state.m[other] === n) state.m[other] = null;
      state.profile = null; state.tab = "matchup"; render(); window.scrollTo(0, 0); return;
    }
    if (t.id === "journal-add") {
      const text = ($("#journal-text") || {}).value || "";
      if (!text.trim()) { setStatus("Write something first."); return; }
      const item = { id: slug(state.profile) + "--" + Date.now().toString(36), fighter: state.profile, text: text.trim(), at: new Date().toISOString() };
      state.journal = state.journal.concat(item); state.store.saveJournal(item); $("#journal-text").value = "";
      render(); setStatus("Note saved"); return;
    }
    if (t.dataset.delJournal) { const id = t.dataset.delJournal; state.journal = state.journal.filter((j) => j.id !== id); state.store.deleteJournal(id); render(); return; }
    if (t.dataset.event) { state.upEvent = t.dataset.event; render(); return; }
    if (t.dataset.cardView) { state.cardView = t.dataset.cardView; ls.set(LOCAL_KEY + ":cardView", state.cardView); render(); return; }
    if (t.dataset.recap) { state.recapEvent = t.dataset.recap; render(); return; }
    if (t.dataset.recapOpen) { state.recapOpen = state.recapOpen === t.dataset.recapOpen ? null : t.dataset.recapOpen; render(); const el = document.querySelector(`[data-recap-note="${CSS.escape(t.dataset.recapOpen)}"]`); if (el) el.focus(); return; }
    if (t.dataset.openBout) {
      const [a, b, rounds] = t.dataset.openBout.split("|");
      const mk = marketFor(a, b);
      Object.assign(state.m, { a, b, rounds: +rounds, oddsA: mk && mk.a_now != null ? String(mk.a_now) : "", oddsB: mk && mk.b_now != null ? String(mk.b_now) : "" });
      state.tab = "matchup"; render(); window.scrollTo(0, 0); return;
    }
    if (t.dataset.picksSub) { state.picks.sub = t.dataset.picksSub; render(); return; }
    if (t.dataset.cpSub) { state.cp.sub = t.dataset.cpSub; render(); return; }
    if (t.dataset.cpEv) { state.cp.ev = t.dataset.cpEv; state.cp.sub = "card"; render(); return; }
    if (t.dataset.suggDel) { const id = t.dataset.suggDel; delete state.sugg[id]; state.store.deleteSuggestion(id); render(); return; }
    if (t.dataset.prosView) { state.pros.view = t.dataset.prosView; render(); return; }
    if (t.dataset.prosClass) { Object.assign(state.pros, { view: "table", wc: t.dataset.prosClass, open: null }); render(); return; }
    if (t.dataset.prospectOpen) { Object.assign(state.pros, { view: "table", open: t.dataset.prospectOpen, q: "", wc: "" }); render(); const el = document.querySelector(`[data-prospect="${CSS.escape(t.dataset.prospectOpen)}"]`); if (el) el.scrollIntoView({ block: "center" }); return; }
    if (t.dataset.prospect) { state.pros.open = state.pros.open === t.dataset.prospect ? null : t.dataset.prospect; render(); return; }
    if (t.dataset.mySub) { state.my.sub = t.dataset.mySub; state.my.msg = ""; render(); return; }
    if (t.dataset.pkSub) { state.my.pk.sub = t.dataset.pkSub; render(); return; }
    if (t.dataset.pk) { const [bout, field, value] = t.dataset.pk.split("|"); pkSet(bout, field, value); return; }
    if (t.dataset.slip) { slipToggle(t.dataset.slip); return; }
    if (t.id === "mp-place") { placeBet(); return; }
    if (t.id === "mp-clear") { state.my.slip = []; state.my.msg = ""; render(); return; }
    if (t.id === "mp-nick-save") { saveNickname(($("#mp-nick") || {}).value || ""); return; }
    if (t.dataset.rosterView) { state.roster.view = t.dataset.rosterView; render(); return; }
    if (t.dataset.sort) {
      const k = t.dataset.sort, r = state.roster;
      if (r.sort === k) r.dir = -r.dir; else { r.sort = k; r.dir = k === "name" || k === "weight_class" ? 1 : -1; }
      render(); return;
    }
    if (t.dataset.showClass) { Object.assign(state.roster, { view: "table", wc: t.dataset.showClass }); render(); return; }
    if (t.id === "roster-reset") { Object.assign(state.roster, ROSTER_FILTERS); render(); return; }
    if (t.dataset.pick) { state.m.a = t.dataset.pick; if (state.m.b === state.m.a) state.m.b = null; state.tab = "matchup"; render(); return; }
    if (t.dataset.open) { const c = state.card.find((x) => x.id === t.dataset.open); if (c) { Object.assign(state.m, { a: c.a, b: c.b, rounds: c.rounds || 3, oddsA: c.oddsA || "", oddsB: c.oddsB || "" }); state.tab = "matchup"; render(); } return; }
    if (t.id === "copy-json") {
      const txt = $("#json").textContent;
      Promise.resolve().then(() => navigator.clipboard.writeText(txt)).then(() => setStatus("Copied"), () => {
        const r = document.createRange(); r.selectNodeContents($("#json")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); setStatus("Selected. Press Ctrl/Cmd+C to copy.");
      });
      return;
    }
    if (t.id === "import-btn") {
      let obj; try { obj = JSON.parse($("#import-json").value); } catch (err) { setStatus("That isn't valid JSON. Check for a missing brace or quote."); return; }
      for (const [n, v] of Object.entries(obj.fighters || {})) { state.adj.fighters[n] = { elo: +v.elo || 0, overrides: v.overrides || {}, note: v.note || "" }; state.store.saveFighter(n, state.adj.fighters[n]); }
      for (const v of obj.matchups || []) { const id = matchupKey(v.a, v.b); state.adj.matchups[id] = { a: v.a, b: v.b, logit: +v.logit || 0, note: v.note || "", ...(v.intangibles ? { intangibles: v.intangibles } : {}) }; state.store.saveMatchup(id, state.adj.matchups[id]); }
      if (obj.weights) { Object.assign(state.adj.weights, obj.weights); state.store.saveWeights(state.adj.weights); }
      render(); setStatus("Merged"); return;
    }
  });

  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "in-a" || t.id === "in-b") {
      const v = t.value.trim();
      const low = v.toLowerCase();
      const name = state.byName.has(v) ? v : ([...state.byName.keys()].find((n) => n.toLowerCase() === low)
        || (state.data.fighters.find((f) => (f.aka || []).some((x) => x.toLowerCase() === low)) || {}).name || (searchFighters(v)[0] || {}).name || v);
      state.m[t.id === "in-a" ? "a" : "b"] = name || null; render(); return;
    }
    if (t.dataset.prosFilter) {
      const k = t.dataset.prosFilter;
      state.pros[k] = t.type === "checkbox" ? t.checked : t.value;
      if (k === "gender" && state.pros.wc && (state.pros.gender === "women") !== isWomen(state.pros.wc)) state.pros.wc = "";
      render(); return;
    }
    if (t.dataset.intang) {
      const [side, key] = t.dataset.intang.split("|");
      const v = t.value.trim() === "" ? null : Math.round(Number(t.value));
      if (v !== null && !(v >= 1 && v <= 10)) { setStatus("Intangibles are scored 1 to 10."); t.value = ""; return; }
      saveIntang(side, key, v);
      render(); return;
    }
    if (t.dataset.attr) {
      const at = attrFor(t.dataset.attr), n = t.dataset.fighter;
      const v = parseInput(at, t.value);
      const base = state.byName.get(n)[at.k];
      setFighterAdj(n, (c) => {
        if (v === null || (base != null && Math.abs(v - base) < 1e-6)) delete c.overrides[at.k];
        else c.overrides[at.k] = at.kind === "int" ? Math.round(v) : v;
      });
      render(); return;
    }
    if (t.type === "range") { render(); return; }
    if (t.dataset.elo) { const n = t.dataset.elo, v = parseFloat(t.value) || 0; setFighterAdj(n, (c) => { c.elo = v; }); render(); return; }
    if (t.id === "up-only") { state.upOnlyHighlights = t.checked; render(); return; }
    if (t.dataset.rfilter) {
      const k = t.dataset.rfilter;
      state.roster[k] = t.type === "checkbox" ? t.checked : t.value;
      if (k === "sort") state.roster.dir = -1;
      render(); return;
    }
    if (t.id === "odds-a" || t.id === "odds-b") { state.m[t.id === "odds-a" ? "oddsA" : "oddsB"] = t.value.trim(); render(); return; }
  });

  document.addEventListener("submit", (e) => {
    const form = e.target.closest && e.target.closest("[data-sugg-form]");
    if (!form) return;
    e.preventDefault();
    const v = Object.fromEntries(new FormData(form).entries());
    const name = String(v.name || "").trim();
    if (!name) return;
    const id = slug(name) + "-" + Date.now().toString(36);
    const doc = { name, commentator: String(v.commentator || "").trim(), where: v.where || "Other", said_on: v.said_on || "",
      link: String(v.link || "").trim(), background: String(v.background || "").trim().slice(0, 2000), status: "pending", submitted: new Date().toISOString() };
    state.sugg[id] = doc;
    state.store.saveSuggestion(id, doc).then(() => setStatus(`${name} added; checked on the next run`));
    render();
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset.recapNote !== undefined) {
      const id = t.dataset.recapId, which = t.dataset.recapNote, ev = ((state.data.recaps || {}).events || []).find((x) => recapId(x) === id);
      const n = state.recapNotes[id] = Object.assign({ event: ev ? ev.event : t.dataset.recapEvent || "", date: ev ? ev.date : t.dataset.recapDate || "", card: "", bouts: {} }, state.recapNotes[id]);
      if (which === "card") n.card = t.value; else n.bouts = Object.assign({}, n.bouts, { [which]: t.value });
      n.updated = new Date().toISOString();
      ls.set(LOCAL_KEY + ":noteCopy:" + id, n);  // a copy in this browser too, whatever happens to the save
      noteStatus(id, "saving");
      later("recap_notes/" + id, () => state.store.saveRecapNote(id, n).then((ok) => noteStatus(id, ok === false ? "failed" : "saved")), 400);
      return;
    }
    if (t.id === "read") {
      const v = -parseFloat(t.value);
      saveRead(v, ($("#read-note") || {}).value || "");
      const lab = t.parentElement.querySelector(".readscale span:nth-child(2)");
      if (lab) lab.textContent = v ? `${v > 0 ? "+" : ""}${v.toFixed(2)} log-odds` : "No change";
      return;
    }
    if (t.id === "read-note") { const md = matchupDoc(state.m.a, state.m.b); const v = md.doc ? (md.flip ? -md.doc.logit : md.doc.logit) : 0; saveRead(v, t.value); return; }
    if (t.dataset.note !== undefined && t.dataset.note) { const n = t.dataset.note, val = t.value; setFighterAdj(n, (c) => { c.note = val; }); return; }
    if (t.dataset.weight) {
      const k = t.dataset.weight, v = parseFloat(t.value);
      if (Math.abs(v - state.data.weights[k]) < 0.005) delete state.adj.weights[k]; else state.adj.weights[k] = v;
      later("settings/weights", () => state.store.saveWeights(state.adj.weights).then(() => setStatus("Saved")));
      const lab = t.parentElement.querySelector(".wv");
      if (lab) lab.textContent = v.toFixed(2);
      t.parentElement.classList.toggle("edited", k in state.adj.weights);
      return;
    }
    if (t.id === "roster-q") { state.roster.q = t.value; render(); return; }
    if (t.id === "pros-q") { state.pros.q = t.value; render(); return; }
    if (t.id === "mp-stake") {
      state.my.stake = t.value;
      const out = t.closest(".mp-stake").querySelector(".num strong");
      if (out) { const dec = state.my.slip.reduce((x, l) => x * decOdds(l.odds), 1); out.textContent = money((+t.value || 0) * (dec - 1)); }
      return;
    }
  });

  // ------------------------------------------------------------ scouting

      body = `<p class="muted" style="font-size:13.5px;margin:0;max-width:80ch">The list is snapshotted on the 1st of each month. Each prospect's arrow is the places moved since then; the monthly report compares one month with the last, with the fights behind each move. Some movement has no fight behind it: a newly swept promotion or a new Fight Matrix release reshuffles the field, and youth and activity change as time passes.</p>

    } else if (P.view === "week") {

      // The global top 200 by today's ranking (not the rank when the bout was found), plus anyone starred.

        ${rec.length ? `<div><h3 style="margin:16px 0 6px">Recent results</h3><div class="table-wrap"><table class="recent pk-table"><thead><tr><th>Date</th><th>Prospect</th><th>Opponent</th><th>Result</th><th>Event</th></tr></thead><tbody>

      body = `<p class="muted" style="font-size:13.5px;margin:0;max-width:80ch">Prospects who signed with a major promotion after someone we track named them, or after they made our list. A signing is dated by the first major-promotion fight on Sherdog and confirmed on BestFightOdds. The first caller gets the credit, and every signing counts as a hit in <em>Who called it</em>.</p>
        ${S.length ? `<div class="sg-list">${S.map((x) => `<article class="sg-card">
          <div class="toolbar" style="margin:0;justify-content:space-between"><strong style="font-size:17px">${esc(x.name)}</strong><span class="chip">${esc(x.promotion)}</span></div>
          <div class="muted" style="font-size:13px">Debut ${fmtD(x.debut)} · ${esc(x.event)}${x.result ? ` · <strong>${esc(x.result)}</strong>${x.method ? ` (${esc(x.method)})` : ""}` : ""}</div>
          ${x.first_call ? `<div style="font-size:14px;margin-top:6px">Called first by <strong>${who(x.first_call)}</strong>${x.first_call.author && x.first_call.outlet ? ` <span class="muted">(${esc(x.first_call.outlet)})</span>` : ""}, ${months(x.lead_days)} before the debut${x.first_call.url ? ` · <a href="${esc(x.first_call.url)}" target="_blank" rel="noopener">the call</a>` : ""}</div>` : ""}
          ${x.called_by.length > 1 ? `<div class="muted" style="font-size:12.5px">Also called by ${x.called_by.slice(1).map(who).join(", ")}</div>` : ""}
          ${x.on_our_list ? `<div class="muted" style="font-size:12.5px">On our list (best #${x.our_rank})</div>` : ""}
          <div class="muted" style="font-size:12px;margin-top:4px">${x.confirmed_by ? `Confirmed: Sherdog + <a href="${esc(x.confirmed_by.url)}" target="_blank" rel="noopener">BestFightOdds</a>` : "Sherdog only so far; awaiting a second source"}${x.sherdog_url ? ` · <a href="${esc(x.sherdog_url)}" target="_blank" rel="noopener">Sherdog</a>` : ""}</div>
        </article>`).join("")}</div>` : `<div class="empty">No signings yet.</div>`}`;
    } else if (P.view === "callers") {
      const T = P.data.callers || [];
      const kind = { outlet: "Outlet", creator: "Creator", forum: "Forum" };
      body = `<p class="muted" style="font-size:13.5px;margin:0;max-width:80ch">Every prospect call we track (outlets, creators on X, forum posters), graded on what the fighter did next: a hit means they signed with a major promotion after the call, or won at least two thirds of their decided fights since it (at least two). Fighters who were already in a major promotion when named aren't counted. Each caller is compared with the pooled hit rate; their buzz counts equally until they have ${20} graded calls and a clear edge either way (beyond ±1.96 standard errors), then it's weighted up, down, or dropped.</p>
        <div class="table-wrap"><table class="recent pk-table"><thead><tr><th>Caller</th><th>Type</th><th class="num">Calls</th><th class="num">Graded</th><th class="num">Hits</th><th class="num">Hit rate</th><th class="num">vs all (z)</th><th class="num">Weight</th></tr></thead><tbody>
        ${T.map((t) => `<tr><td>${esc(t.author || t.outlet)}${t.author && t.outlet ? `<div class="muted" style="font-size:12px">${esc(t.outlet)}</div>` : ""}</td><td>${kind[t.kind] || esc(t.kind)}</td><td class="num">${t.calls}</td><td class="num">${t.graded}</td><td class="num">${t.hits}</td><td class="num">${t.hit_rate != null ? Math.round(t.hit_rate * 100) + "%" : "—"}</td><td class="num">${t.z > 0 ? "+" : ""}${t.z.toFixed(2)}</td><td class="num"><strong>${t.weight}</strong></td></tr>`).join("")}
        </tbody></table></div><p class="muted" style="font-size:12px;margin:0">Pooled hit rate across all graded calls: ${T.length ? Math.round(T[0].baseline * 100) : 0}%.</p>`;
    } else if (P.view === "classes") {
      const groups = {};
      for (const x of list) (groups[x.division] = groups[x.division] || []).push(x);
      const order = Object.keys(groups).sort(divisionOrder);
      body = order.length ? `<div class="classes">${order.map((wc) => {
        const g = groups[wc], top = g[0].score;
        return `<div class="wc"><div class="wc-hd"><h3>${esc(wc)}</h3><span class="muted num">${g.length} prospects</span></div>
          <ol>${g.slice(0, 10).map((x, i) => `<li class="clickable" data-prospect-open="${esc(x.name)}"><span class="rk num">${i + 1}</span><span class="nm" title="${esc(x.name)} · ${prRecord(x)} · age ${Math.floor(x.age)}">${esc(x.name)}</span>
            <span class="bar"><span style="width:${Math.max(4, 100 - (top - x.score) * 2).toFixed(1)}%"></span></span><span class="v num">${Math.round(x.score)}<span class="wmv">${moveBadge(x)}</span></span></li>`).join("")}</ol>
          ${g.length > 10 ? `<button class="btn link" type="button" data-pros-class="${esc(wc)}">All ${g.length} in the list</button>` : ""}</div>`;
      }).join("")}</div><p class="muted" style="font-size:12px;margin:0">Top 10 per division by prospect score. Click a name for the full card.</p>` : `<div class="empty">No prospects match these filters.</div>`;
    } else {
      body = list.length ? `<div class="table-wrap"><table class="list pr-table"><thead><tr><th class="num">#</th><th class="num" title="Places moved since the last monthly snapshot">Move</th><th>Prospect</th><th class="num">Age</th><th class="num">Record</th><th class="num">Finish</th><th>Promotion · last fight</th><th>From</th><th class="num">Score</th></tr></thead>
        <tbody>${list.map((x, i) => prospectRow(x, i + 1)).join("")}</tbody></table></div>` : `<div class="empty">No prospects match these filters.</div>`;
    }
    view.innerHTML = `<div class="stack">${intro}<section class="panel stack">${head}${body}</section></div>`;

  // ------------------------------------------------------------ My Bets (the betting league) and My Picks (the pick'em)
  async function startLeague(db) {
    const M = state.my;
    M.db = db;
    db.collection("standings").onSnapshot((snap) => {
      const st = {};
      let lb = null;
      const pst = {};
      let plb = null;
      snap.docs.forEach((d) => {
        const v = d.data();
        if (d.id === "leaderboard") lb = v;
        else if (d.id === "picks-leaderboard") plb = v;
        else if (d.id.startsWith("picks-")) pst[d.id.slice(6)] = v;
        else st[d.id] = v;
      });
      M.standings = st; M.lb = lb; M.pk.standings = pst; M.pk.lb = plb; M.loaded = true; namesFor(); renderSoon();
    }, () => { M.loaded = true; renderSoon(); });
    db.collection("players").onSnapshot((snap) => {
      M.nicks = {};
      snap.docs.forEach((d) => { const v = d.data(); if (v && v.nickname) M.nicks[d.id] = v.nickname; });
      namesFor(); renderSoon();
    }, () => {});
    const user = await window.claude.use("user").catch(() => null);
    M.user = user;
    M.uid = user ? await user.id() : null;
    if (!M.uid) { renderSoon(); return; }
    db.collection("players/" + M.uid + "/bets").onSnapshot((snap) => {
      M.bets = snap.docs.map((d) => Object.assign({ _id: d.id }, d.data())).sort((a, b) => (b.placed_at || "").localeCompare(a.placed_at || ""));
      renderSoon();
    }, () => {});
    db.doc("players/" + M.uid).onSnapshot((d) => { M.player = d.exists ? d.data() : null; renderSoon(); }, () => {});
    db.collection("players/" + M.uid + "/picks").onSnapshot((snap) => {
      const docs = {};
      snap.docs.forEach((d) => {
        const v = d.data();
        // Saved as a list of {bout, winner, method, round}; the page works with them keyed by bout.
        docs[d.id] = Object.assign({}, v, { picks: Array.isArray(v.picks) ? Object.fromEntries(v.picks.filter((x) => x && x.bout).map(({ bout, ...p }) => [bout, p])) : (v.picks || {}) });
      });
      // Edits still waiting to be written win over what the database last said.
      for (const id of Object.keys(M.pk.docs)) if (debounced.has("pickem/" + id) || pending.has("pickem/" + id)) docs[id] = M.pk.docs[id];
      M.pk.docs = docs; renderSoon();
    }, () => {});
  }
  // Names for the leaderboard: a player's own nickname, else their profile name (resolved each render, never stored).
  async function namesFor() {
    const M = state.my;
    const ids = [...new Set([...((M.lb && M.lb.rows) || []), ...((M.pk.lb && M.pk.lb.rows) || [])].map((r) => r.uid).filter((u) => u !== "claude"))];
    if (!ids.length) return;
    const ps = M.user ? await M.user.profiles(ids).catch(() => ({})) : {};
    let changed = false;
    for (const id of ids) {
      const n = (M.nicks || {})[id] || (ps[id] && ps[id].name) || "";
      if (M.names[id] !== n) { M.names[id] = n; changed = true; }
    }
    if (changed && (state.tab === "mypicks" || state.tab === "mypickem")) renderSoon();
  }
  const myStanding = () => (state.my.uid && state.my.standings[state.my.uid]) || null;
  /** Your bankroll as of Claude's last grading, minus bets placed since. */
  function myMoney() {
    const M = state.my, st = myStanding();
    const graded = new Set(((st && st.bets) || []).map((b) => b.id));
    const pending = M.bets.filter((b) => !graded.has(b._id));
    const pendingStake = pending.reduce((x, b) => x + (+b.stake || 0), 0);
    const bankroll = st ? st.bankroll : 100;
    const available = (st ? st.available : 100) - pendingStake;
    return { bankroll, available: Math.round(available * 100) / 100, open: Math.round(((st ? st.open_stakes : 0) + pendingStake) * 100) / 100, pending, st };
  }
  const boardLocked = (bd) => !bd || !bd.locks_at || Date.now() >= Date.parse(bd.locks_at);
  const decOdds = (o) => (o > 0 ? 1 + o / 100 : 1 + 100 / -o);
  const amerOdds = (d) => (d >= 2 ? "+" + Math.round((d - 1) * 100) : String(Math.round(-100 / (d - 1))));
  function slipToggle(id) {
    const M = state.my, bd = M.board;
    const m = bd && bd.markets.find((x) => x.id === id);
    if (!m) return;
    const i = M.slip.findIndex((l) => l.id === id);
    if (i >= 0) M.slip.splice(i, 1);
    else { M.slip = M.slip.filter((l) => l.bout !== m.bout); M.slip.push({ id: m.id, bout: m.bout, market: m.market, selection: m.selection, odds: m.odds }); }
    M.msg = "";
    render();
  }
  async function placeBet() {
    const M = state.my, bd = M.board;
    const stake = Math.round((+M.stake || 0) * 100) / 100;
    const mon = myMoney();
    if (!M.uid || !bd || boardLocked(bd) || !M.slip.length) return;
    if (!(stake >= 1)) { M.msg = "Minimum stake is $1.00."; render(); return; }
    if (stake > mon.available + 1e-9) { M.msg = `You have ${money(mon.available)} available.`; render(); return; }
    const dec = M.slip.reduce((x, l) => x * decOdds(l.odds), 1);
    const doc = { event: bd.event, placed_at: new Date().toISOString(), board_fetched_at: bd.fetched_at, stake,
      odds: +amerOdds(dec), legs: M.slip.map((l) => ({ id: l.id, bout: l.bout, market: l.market, selection: l.selection, odds: l.odds })) };
    M.busy = true; render();
    try {
      if (!M.player) await M.db.doc("players/" + M.uid).set({ joined: new Date().toISOString() });
      await M.db.collection("players/" + M.uid + "/bets").add(doc);
      M.slip = []; M.stake = ""; M.msg = "Bet placed. It's graded with everyone's after the card.";
    } catch (e) {
      M.readOnly = (e && e.code) === "invalid_argument";
      M.msg = M.readOnly ? "This view can't place bets: ask the page's owner to invite you as a Contributor." : `Couldn't place the bet (${(e && e.code) || "error"}).`;
    }
    M.busy = false; render();
  }
  async function saveNickname(v) {
    const M = state.my;
    if (!M.uid) return;
    try { await M.db.doc("players/" + M.uid).set(Object.assign({}, M.player || { joined: new Date().toISOString() }, { nickname: v.trim().slice(0, 40) })); M.msg = "Leaderboard name saved."; }
    catch (e) { M.msg = "Couldn't save the name."; }
    render();
  }
  function boardHtml(bd) {
    const M = state.my, inSlip = new Set(M.slip.map((l) => l.id));
    const btn = (m, cls = "") => `<button type="button" class="odds-btn ${cls} ${inSlip.has(m.id) ? "on" : ""}" data-slip="${esc(m.id)}" aria-pressed="${inSlip.has(m.id)}"><span>${esc(m.selection)}</span><strong class="num">${m.odds > 0 ? "+" : ""}${m.odds}</strong></button>`;
    return bd.bouts.map((b) => {
      const ms = bd.markets.filter((m) => m.bout === b.bout);
      if (!ms.length) return "";
      const ml = ms.filter((m) => m.market[0] === "ml"), props = ms.filter((m) => m.market[0] !== "ml");
      return `<div class="mp-bout"><div class="mp-bout-hd"><strong>${esc(b.bout)}</strong>${b.rounds === 5 ? ' <span class="pill">5 rds</span>' : ""}</div>
        <div class="mp-ml">${ml.map((m) => btn(m, "big")).join("")}</div>
        ${props.length ? `<details><summary>${props.length} more markets: method, rounds, over/under</summary><div class="mp-props">${props.map((m) => btn(m)).join("")}</div></details>` : ""}</div>`;
    }).join("");
  }
  function slipHtml(bd, mon) {
    const M = state.my;
    if (!M.slip.length) return `<div class="mp-slip"><div class="label">Bet slip</div><p class="muted" style="font-size:13.5px;margin:6px 0 0">Tap a price to add it. Pick legs from different bouts to build a parlay.</p>${M.msg ? `<p class="mp-msg">${esc(M.msg)}</p>` : ""}</div>`;
    const dec = M.slip.reduce((x, l) => x * decOdds(l.odds), 1), stake = +M.stake || 0;
    return `<div class="mp-slip"><div class="label">Bet slip · ${M.slip.length > 1 ? `${M.slip.length}-leg parlay` : "single"}</div>
      <ul class="mp-legs">${M.slip.map((l) => `<li><span>${esc(l.selection)} <span class="muted" style="font-size:12px">${esc(l.bout)}</span></span><span class="num">${l.odds > 0 ? "+" : ""}${l.odds}</span><button type="button" class="btn link" data-slip="${esc(l.id)}" aria-label="Remove">✕</button></li>`).join("")}</ul>
      <div class="mp-stake"><label>Stake $ <input id="mp-stake" type="number" inputmode="decimal" min="1" step="0.5" value="${esc(M.stake)}" placeholder="0.00"></label>
        <span class="num">@ ${amerOdds(dec)} · to win <strong>${money(stake * (dec - 1))}</strong></span></div>

  function leaderboardHtml() {

  // My Picks: the pick'em. Every bout on the board: winner, method and (for a finish) round, saved to
  // players/<uid>/picks/<card id> as you go; graded by Claude with AI Picks' scoring (standings/picks-*).
  const PK_METHODS = [["KO/TKO", "KO/TKO"], ["SUB", "Submission"], ["DEC", "Decision"]];
  const pkCardId = (bd) => slug(bd.date + " " + bd.event);
  function pkStatusText() {
    const st = state.my.pk.status;
    return st === "saving" ? ["saving", "Saving…"] : st === "saved" ? ["saved", "Saved ✓"] : st && st.startsWith("failed") ? ["failed", "Not saved: " + st.slice(7)] : ["idle", "Saves as you pick"];
  }
  function pkStatusPaint() {
    const [cls, text] = pkStatusText();
    document.querySelectorAll("[data-pk-status]").forEach((el) => { el.className = "note-status ns-" + cls; el.textContent = text; });
  }
  function pkSet(boutName, field, value) {
    const M = state.my, bd = M.board;
    if (!M.uid || !bd || boardLocked(bd)) return;
    const id = pkCardId(bd), bout = bd.bouts.find((b) => b.bout === boutName);
    if (!bout) return;
    const doc = M.pk.docs[id] = Object.assign({ event: bd.event, date: bd.date, picks: {} }, M.pk.docs[id] || ls.get(LOCAL_KEY + ":pickem:" + id));
    doc.picks = Object.assign({}, doc.picks);
    const p = Object.assign({}, doc.picks[boutName]);
    if (field === "winner") p.winner = value;
    if (field === "method") { p.method = value; if (value === "DEC") delete p.round; }
    if (field === "round") { p.round = +value; if (!p.method || p.method === "DEC") p.method = "KO/TKO"; }
    if (field === "clear") { delete doc.picks[boutName]; } else doc.picks[boutName] = p;
    doc.updated = new Date().toISOString();
    M.pk.status = "saving"; render();
    const key = "pickem/" + id;
    later(key, async () => {
      pending.add(key);
      const doc = M.pk.docs[id];
      ls.set(LOCAL_KEY + ":pickem:" + id, doc);  // a copy in this browser too, whatever happens to the save
      // Stored as a list: bout names make poor field keys ("Allen Frye Jr. vs ..." has a dot in it).
      const body = { event: doc.event, date: doc.date, updated: doc.updated, picks: Object.entries(doc.picks || {}).map(([bout, p]) => Object.assign({ bout }, p)) };
      // "unavailable" is a passing platform hiccup: try once more after a short random pause.
      const retry = (fn) => fn().catch((e) => { if ((e && e.code) !== "unavailable") throw e; return new Promise((r) => setTimeout(r, 700 + Math.random() * 900)).then(fn); });
      try {
        if (!M.player) await retry(() => M.db.doc("players/" + M.uid).set({ joined: new Date().toISOString() }));
        await retry(() => M.db.doc("players/" + M.uid + "/picks/" + id).set(body));
        M.pk.status = "saved";
      } catch (e) {
        M.readOnly = (e && e.code) === "invalid_argument";
        M.pk.status = "failed " + (M.readOnly ? "this view can't save picks (ask the owner to invite you as a Contributor)" : `${(e && e.code) || "error"}. Your picks are kept in this browser; pick again in a minute to retry.`);
      } finally { pending.delete(key); }
      pkStatusPaint();
    }, 500);
  }
  const pkPickText = (p, rounds) => !p || !p.winner ? '<span class="muted">no pick</span>'
    : `<strong>${esc(p.winner)}</strong>${p.method ? ` <span class="muted">by</span> ${esc(METHOD_WORD[p.method] || p.method)}` : ' <span class="muted">(method?)</span>'}${p.method && p.method !== "DEC" ? (p.round ? ` <span class="muted">in</span> R${p.round}` : ' <span class="muted">(round?)</span>') : ""}`;
  function pkCardHtml(bd) {
    const M = state.my, id = pkCardId(bd), doc = M.pk.docs[id] || ls.get(LOCAL_KEY + ":pickem:" + id) || { picks: {} }, locked = boardLocked(bd);
    const same = (x) => x && fold(x).includes(fold(bd.event.split(":")[0]));
    const claude = state.cp.cards.find((c) => same(c.event));
    const cb = {};
    if (claude) for (const b of claude.bouts) cb[[b.a, b.b].map((n) => fold(n).split(" ").pop()).sort().join("|")] = b;
    const mine = (M.pk.standings[M.uid] || { cards: [] }).cards.find((c) => c.id === id);
    const graded = {};
    if (mine) for (const b of mine.bouts) graded[b.bout] = b;
    const n = bd.bouts.filter((b) => (doc.picks[b.bout] || {}).winner && (doc.picks[b.bout] || {}).method && ((doc.picks[b.bout] || {}).method === "DEC" || (doc.picks[b.bout] || {}).round)).length;
    const seg = (bout, field, opts, cur, dis) => `<span class="seg" role="group">${opts.map(([v, lab]) => `<button type="button" data-pk="${esc(bout)}|${field}|${esc(v)}" aria-pressed="${String(cur) === String(v)}" ${dis ? "disabled" : ""}>${esc(lab)}</button>`).join("")}</span>`;
    const rows = bd.bouts.map((b) => {
      const p = doc.picks[b.bout] || {}, rounds = b.rounds || 3;
      const c = cb[[b.a, b.b].map((x) => fold(x).split(" ").pop()).sort().join("|")];
      const g = graded[b.bout];
      const res = g && g.result ? (g.result.void ? `<span class="muted">${esc(g.result.void)} (not counted)</span>` : `${esc(g.result.winner)} <span class="muted">by</span> ${esc(METHOD_WORD[g.result.method] || g.result.method)}${g.result.method !== "DEC" ? ` R${g.result.round}` : ""}`) : "";
      const body = locked
        ? `<div class="pe-line"><span class="label">You</span> ${pkPickText((g && g.pick) || p, rounds)} ${g && g.score ? cpPts(g.score) : ""}</div>`
        : `<div class="pe-line">${seg(b.bout, "winner", [[b.a, b.a], [b.b, b.b]], p.winner)}</div>
           <div class="pe-line">${seg(b.bout, "method", PK_METHODS, p.method)} ${seg(b.bout, "round", Array.from({ length: rounds }, (_, i) => [i + 1, "R" + (i + 1)]), p.method === "DEC" ? "" : p.round, p.method === "DEC")}
             ${p.winner ? `<button type="button" class="btn link" data-pk="${esc(b.bout)}|clear|1">clear</button>` : ""}</div>`;
      return `<div class="pe-bout"><div class="pe-hd"><strong><span style="color:var(--red)">${esc(b.a)}</span> <span class="muted">vs</span> <span style="color:var(--blue)">${esc(b.b)}</span></strong>${rounds === 5 ? ' <span class="pill">5 rds</span>' : ""}${b.title ? ' <span class="pill">Title</span>' : ""}</div>
        ${body}
        ${locked && c ? `<div class="pe-line"><span class="label">Claude</span> ${cpPick(c.pick.winner, c.pick.method, c.pick.round)} ${c.claude ? cpPts(c.claude, claude.rounds_picked ? 4 : 3) : ""}</div>` : ""}
        ${res ? `<div class="pe-line"><span class="label">Result</span> ${res}</div>` : ""}</div>`;
    }).join("");
    const [cls, text] = pkStatusText();
    return `<section class="panel stack"><div class="toolbar" style="justify-content:space-between;margin:0"><div><h3 style="margin:0">${esc(bd.event)}</h3>
        <div class="muted num" style="font-size:13px">${esc(bd.date)} · ${locked ? "<strong>Picks locked</strong>" : `picks lock ${esc(when(bd.locks_at))}`} · ${n} of ${bd.bouts.length} picked</div></div>
        ${locked ? (mine ? `<span class="pill num">${mine.points} pts${mine.graded ? ` · Claude ${mine.claude_points} on the same bouts` : ""}</span>` : "") : `<span class="note-status ns-${cls}" data-pk-status role="status" aria-live="polite">${esc(text)}</span>`}</div>
      ${locked ? (claude ? "" : '<p class="muted" style="margin:0;font-size:13px">Claude\'s picks for this card aren\'t in yet.</p>') : `<p class="muted" style="margin:0;font-size:13px">Pick the winner, the method and, for a finish, the round. Claude's picks for this card show here once it locks (they're on the AI Picks tab too).</p>`}
      <div class="pe-list">${rows}</div></section>`;
  }
  function renderMyPickem(view) {

    const intro = `<section class="panel"><div class="toolbar" style="justify-content:space-between;margin:0"><h2 style="margin:0">My Picks</h2>${infoBtn("my_pickem", "How My Picks works")}</div><p class="muted" style="margin:6px 0 0;font-size:14px;max-width:74ch">No money: pick every bout on the card, the winner, how it ends and the round, against Claude and everyone else who plays. 2 points for the winner, 1 for the method, and a bonus point for the round. Picks lock when the card starts.</p></section>`;

        ${L.rows.map((r, i) => { const me = r.uid === M.uid, ai = r.uid === "claude"; const name = ai ? "Claude (AI)" : (M.names[r.uid] || (me ? "You" : "Player"));

  // ------------------------------------------------------------ AI picks
  function setPicks(docs) {
    state.picks.summary = docs.find((d) => d._id === "summary") || null;
    state.my.board = docs.find((d) => d._id === "board") || state.my.board;
    state.picks.weeks = docs.filter((d) => /^w\d+$/.test(d._id) && d.event).sort((a, b) => (b.placed_at || "").localeCompare(a.placed_at || ""));
    // AI Picks (the pick'em) shares the collection: "card-summary" and one "card-<date>-<event>" per card.
    state.cp.summary = docs.find((d) => d._id === "card-summary") || null;
    state.cp.cards = docs.filter((d) => /^card-\d/.test(d._id) && d.bouts).sort((a, b) => b.date.localeCompare(a.date));
    state.picks.loaded = true;
    renderSoon();
  }
  const money = (x) => (x < 0 ? "−$" : "$") + Math.abs(x).toFixed(2);
  const signed = (x) => (x > 0 ? "+" : x < 0 ? "−" : "") + "$" + Math.abs(x).toFixed(2);
  const amer = (o) => (o > 0 ? "+" : "") + o;
  const STATUS = { open: ["Open", "tier-toss"], won: ["Won", "tier-best"], lost: ["Lost", "tier-caution"], void: ["Void (refunded)", "tier-toss"] };
  function nextFriday() {
    // Friday in Eastern time.
    const et = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
    et.setDate(et.getDate() + ((5 - et.getDay() + 7) % 7));
    return et.toLocaleDateString("en-US", { weekday: "long", day: "numeric", month: "long" });
  }
  // Times are shown in US Eastern for everyone (the site runs on ET).
  const when = (iso) => { try { return new Date(iso).toLocaleString("en-US", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }) + " ET"; } catch (e) { return iso; } };
  function picksStats(s) {
    const cells = [
      ["Bankroll", money(s.bankroll), `started at ${money(s.start)}`],
      ["Profit", signed(s.bankroll - s.start), s.roi != null ? `ROI ${(s.roi * 100).toFixed(1)}% on ${money(s.staked)} staked` : "nothing settled yet"],
      ["Record", `${s.won}–${s.lost}${s.void ? `–${s.void}` : ""}`, `won–lost${s.void ? "–void" : ""} · ${s.weeks} week${s.weeks === 1 ? "" : "s"}${s.passes ? `, ${s.passes} passed` : ""}`],

  function curve(points) {

    const x = (i) => pad + (i * (W - pad * 2)) / (points.length - 1), y = (v) => H - pad - ((v - lo) / (hi - lo)) * (H - pad * 2);
    const path = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.bankroll).toFixed(1)}`).join("");
    return `<svg class="pk-curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bankroll after each card">
      <line x1="${pad}" x2="${W - pad}" y1="${y(points[0].bankroll)}" y2="${y(points[0].bankroll)}" class="pk-base"/>
      <path d="${path}" class="pk-line"/>${points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.bankroll)}" r="3.5" class="pk-dot"><title>${esc(p.week)}: ${money(p.bankroll)}</title></circle>`).join("")}
