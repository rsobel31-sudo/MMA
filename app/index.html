  const scoutRead = (a, b) => state.scout.reads[pairId(a, b)] || null;
  /** Claude's read on this bout as log-odds toward a (capped at 0.8), 0 without one. */
  function scoutLogit(a, b) {
    const r = scoutRead(a, b);
    if (!r || r.logit == null) return 0;
    const x = Math.max(-0.8, Math.min(0.8, +r.logit));
    return r.favours === a ? x : r.favours === b ? -x : 0;
  }
  const SECTIONS = ["Striking", "Grappling", "Defense", "Defense & durability", "Pace & cardio", "Fight IQ"];
  function reportBlock(rep, opts = {}) {
    const how = rep.how_they_fight || {};
    const keys = SECTIONS.filter((k) => how[k]).concat(Object.keys(how).filter((k) => !SECTIONS.includes(k)));
    const list = (title, xs) => (xs && xs.length ? `<div><div class="label">${title}</div><ul class="notes">${xs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "");
    return `<div class="sc-report">
      <p class="sc-summary">${esc(rep.summary)}</p>
      <details ${opts.open ? "open" : ""}><summary>How ${esc(rep.name.split(" ")[0])} fights</summary>
        <dl class="sc-how">${keys.map((k) => `<dt>${esc(k)}</dt><dd>${esc(how[k])}</dd>`).join("")}</dl>
        <div class="sc-lists">${list("Patterns", rep.patterns)}${list("Concerns", rep.concerns)}${list("How to beat them", rep.keys_to_beat)}</div>
        ${rep.news && rep.news.length ? `<div class="label">News</div><ul class="notes">${rep.news.map((n) => `<li><span class="muted num">${esc(n.date)}</span> ${esc(n.text)} ${n.source ? `<a href="${esc(n.source)}" target="_blank" rel="noopener">source</a>` : ""}</li>`).join("")}</ul>` : ""}
        <p class="muted sc-src">Sources: ${(rep.sources || []).map((x) => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.outlet)}${x.author ? ` (${esc(x.author)})` : ""}</a>`).join(" · ")}. Written by Claude ${esc((rep.updated || "").slice(0, 10))}${rep.depth === "thin" ? "; thin coverage so far" : ""}.</p>
      </details></div>`;
  }
  function scoutPanel(a, b) {
    const rd = scoutRead(a, b), ra = scoutReport(a), rb = scoutReport(b);

    const readHtml = rd ? `<div class="sc-read">
        <div class="sc-read-hd"><span class="label">Claude's read</span>
          ${rd.logit ? `<strong>Leans ${esc(rd.favours)}</strong> <span class="pill num">${lg > 0 ? "+" : "−"}${Math.abs(lg).toFixed(2)} log-odds</span>` : "<strong>No lean</strong>"}

        <p>${esc(rd.reasoning)}</p>

        ${rd.pundits && rd.pundits.length ? `<div class="label" style="margin-top:10px">Pundit picks</div><ul class="notes">${rd.pundits.map((x) => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.outlet)}${x.author ? ` · ${esc(x.author)}` : ""}</a>: <strong>${esc(x.pick)}</strong>${x.method ? ` <span class="muted">(${esc(x.method)})</span>` : ""}</li>`).join("")}</ul>` : ""}
        ${rd.winner ? `<p class="num" style="margin:8px 0 0"><strong>Result:</strong> ${esc(rd.winner)} (${esc(rd.result.method)} R${rd.result.round}) · the read was ${lg === 0 ? "neutral" : (lg > 0) === (rd.winner === a) ? "right" : "wrong"}</p>` : ""}

  // ------------------------------------------------------------ My Picks (the league)
  async function startLeague(db) {
    const M = state.my;
    M.db = db;
    db.collection("standings").onSnapshot((snap) => {
      const st = {};
      let lb = null;
      snap.docs.forEach((d) => { const v = d.data(); if (d.id === "leaderboard") lb = v; else st[d.id] = v; });
      M.standings = st; M.lb = lb; M.loaded = true; namesFor(); renderSoon();
    }, () => { M.loaded = true; renderSoon(); });
    db.collection("players").onSnapshot((snap) => {
      M.nicks = {};
      snap.docs.forEach((d) => { const v = d.data(); if (v && v.nickname) M.nicks[d.id] = v.nickname; });
      namesFor(); renderSoon();
    }, () => {});
    const user = await window.claude.use("user").catch(() => null);
    M.user = user;
    M.uid = user ? await user.id() : null;
    if (!M.uid) { renderSoon(); return; }
    db.collection("players/" + M.uid + "/bets").onSnapshot((snap) => {
      M.bets = snap.docs.map((d) => Object.assign({ _id: d.id }, d.data())).sort((a, b) => (b.placed_at || "").localeCompare(a.placed_at || ""));
      renderSoon();
    }, () => {});
    db.doc("players/" + M.uid).onSnapshot((d) => { M.player = d.exists ? d.data() : null; renderSoon(); }, () => {});
  }
  // Names for the leaderboard: a player's own nickname, else their profile name (resolved each render, never stored).
  async function namesFor() {
    const M = state.my;
    const ids = ((M.lb && M.lb.rows) || []).map((r) => r.uid).filter((u) => u !== "claude");
    if (!ids.length) return;
    const ps = M.user ? await M.user.profiles(ids).catch(() => ({})) : {};
    let changed = false;
    for (const id of ids) {
      const n = (M.nicks || {})[id] || (ps[id] && ps[id].name) || "";
      if (M.names[id] !== n) { M.names[id] = n; changed = true; }
    }
    if (changed && state.tab === "mypicks") renderSoon();
  }
  const myStanding = () => (state.my.uid && state.my.standings[state.my.uid]) || null;
  /** Your bankroll as of Claude's last grading, minus bets placed since. */
  function myMoney() {
    const M = state.my, st = myStanding();
    const graded = new Set(((st && st.bets) || []).map((b) => b.id));
    const pending = M.bets.filter((b) => !graded.has(b._id));
    const pendingStake = pending.reduce((x, b) => x + (+b.stake || 0), 0);
    const bankroll = st ? st.bankroll : 100;
    const available = (st ? st.available : 100) - pendingStake;
    return { bankroll, available: Math.round(available * 100) / 100, open: Math.round(((st ? st.open_stakes : 0) + pendingStake) * 100) / 100, pending, st };
  }
  const boardLocked = (bd) => !bd || !bd.locks_at || Date.now() >= Date.parse(bd.locks_at);
  const decOdds = (o) => (o > 0 ? 1 + o / 100 : 1 + 100 / -o);
  const amerOdds = (d) => (d >= 2 ? "+" + Math.round((d - 1) * 100) : String(Math.round(-100 / (d - 1))));
  function slipToggle(id) {
    const M = state.my, bd = M.board;
    const m = bd && bd.markets.find((x) => x.id === id);
    if (!m) return;
    const i = M.slip.findIndex((l) => l.id === id);
    if (i >= 0) M.slip.splice(i, 1);
    else { M.slip = M.slip.filter((l) => l.bout !== m.bout); M.slip.push({ id: m.id, bout: m.bout, market: m.market, selection: m.selection, odds: m.odds }); }
    M.msg = "";
    render();
  }
  async function placeBet() {
    const M = state.my, bd = M.board;
    const stake = Math.round((+M.stake || 0) * 100) / 100;
    const mon = myMoney();
    if (!M.uid || !bd || boardLocked(bd) || !M.slip.length) return;
    if (!(stake >= 1)) { M.msg = "Minimum stake is $1.00."; render(); return; }
    if (stake > mon.available + 1e-9) { M.msg = `You have ${money(mon.available)} available.`; render(); return; }
    const dec = M.slip.reduce((x, l) => x * decOdds(l.odds), 1);
    const doc = { event: bd.event, placed_at: new Date().toISOString(), board_fetched_at: bd.fetched_at, stake,
      odds: +amerOdds(dec), legs: M.slip.map((l) => ({ id: l.id, bout: l.bout, market: l.market, selection: l.selection, odds: l.odds })) };
    M.busy = true; render();
    try {
      if (!M.player) await M.db.doc("players/" + M.uid).set({ joined: new Date().toISOString() });
      await M.db.collection("players/" + M.uid + "/bets").add(doc);
      M.slip = []; M.stake = ""; M.msg = "Bet placed. It's graded with everyone's after the card.";
    } catch (e) {
      M.readOnly = (e && e.code) === "invalid_argument";
      M.msg = M.readOnly ? "This view can't place bets: ask the page's owner to invite you as a Contributor." : `Couldn't place the bet (${(e && e.code) || "error"}).`;
    }
    M.busy = false; render();
  }

  function curve(points) {

  // ------------------------------------------------------ corner search
  // Accents and punctuation ignored, initials joined: "R.J. Harris", "R. J. Harris" and "RJ Harris" all read "rj harris".
  const fold = (x) => String(x).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[^a-z0-9]+/g, " ").replace(/\b([a-z])\s+(?=[a-z]\b)/g, "$1").trim();
  const cb = { input: null, items: [], active: -1 };
  function searchFighters(q) {
    const t = fold(q.trim());
    if (!t) return [];
    const words = t.split(/\s+/);
    const hits = [];
    for (const e of state.search) {
      let best = -1;
      for (const k of e.keys) {
        if (!words.every((w) => k.includes(w))) continue;
        // Exact, then name start, then word start, then anywhere; proven fighters first within a tier.
        const sc = k === t ? 3 : k.startsWith(t) ? 2 : k.split(/[\s-]+/).some((p) => p.startsWith(words[0])) ? 1 : 0;
        best = Math.max(best, sc);
      }
      if (best >= 0) hits.push([best, e.f.proven || 0, e]);
    }
    hits.sort((x, y) => y[0] - x[0] || y[1] - x[1]);
    return hits.slice(0, 8).map((h) => h[2]);
  }
  function cbList(input) { return document.getElementById(input.getAttribute("aria-controls")); }

    const id = input.id.slice(-1);
    ul.innerHTML = cb.items.length ? cb.items.map((e, i) => {

      return `<li role="option" id="cbo-${id}-${i}" data-cb-pick="${esc(f.name)}" aria-selected="${i === cb.active}">
        <span class="cb-name">${esc(f.name)}${aka ? ` <span class="muted">“${esc(aka)}”</span>` : ""}</span>

  document.addEventListener("input", (e) => { if (e.target.id === "in-a" || e.target.id === "in-b") cbOpen(e.target); });

  document.addEventListener("keydown", (e) => {

      if (cb.input === t && cb.active >= 0) { e.preventDefault(); cbPick(t, cb.items[cb.active].name); }
    } else if (e.key === "Escape") {
      if (cb.input === t) { e.preventDefault(); cbClose(); t.value = state.m[t.id === "in-a" ? "a" : "b"] || ""; }
    }
  });
  // mousedown so the pick lands before the input loses focus.
  document.addEventListener("mousedown", (e) => {
    const li = e.target.closest && e.target.closest("[data-cb-pick]");
    if (li && cb.input) { e.preventDefault(); cbPick(cb.input, li.dataset.cbPick); }
  });
  document.addEventListener("focusout", (e) => { if (cb.input && e.target === cb.input) setTimeout(() => { if (cb.input && document.activeElement !== cb.input) cbClose(); }, 0); });

  // ------------------------------------------------------------------- boot
  async function boot() {
    let data;
    try {
      const res = await fetch("data.json");
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
    } catch (err) {
      $("#view").innerHTML = `<div class="empty">Couldn't load <code>data.json</code>. Run <code>python -m mma_predictor export</code> to build it, then reload.</div>`;
      return;
    }
    state.data = data;
    state.engine = MMAEngine.makeEngine(data);
    const IN = data.intangibles || { keys: [], labels: {}, help: {} };
    INTANG_ATTRS = {};  // intangibles are your 1-10 scores per matchup (tale of the tape), not fighter attributes
    RATING_ATTRS = Object.fromEntries(Object.values(data.rating_categories).flat().map((k) => [k, { k: "r_" + k, label: data.rating_labels[k], kind: "int", better: "high", rating: true }]));
    data.fighters.forEach((f) => state.byName.set(f.name, f));
    state.search = data.fighters.map((f) => ({ name: f.name, keys: [f.name, ...(f.aka || [])].map(fold).flatMap((k) => [k, k.replace(/ /g, "")]), aka: f.aka || [], f }));
    state.tab = ls.get(LOCAL_KEY + ":tab") || "card";
    state.cardView = ls.get(LOCAL_KEY + ":cardView") || "upcoming";
    state.m.a = data.fighters[0] && data.fighters[0].name;
    state.m.b = data.fighters[1] && data.fighters[1].name;
    state.recapNotes = ls.get(LOCAL_KEY + ":recapNotes") || {};
    state.recapReviews = {};
    state.recapCanEdit = true;  // this browser only, until the page database answers
    state.store = localStore();
    render();

    const db = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db").catch(() => null) : null;
    if (db) {
      state.recapNotes = {};
      state.recapCanEdit = false;
      state.store = dbStore(db); state.storeKind = "db";
      window.claude.use("user").then((u) => { state.recapCanEdit = !!(u && u.isOwner()); renderSoon(); }).catch(() => {});
      state.picks.fromDb = true;
      startLeague(db);
      // The database is the source of truth once it answers.
      state.adj = { fighters: {}, matchups: {}, weights: {} };
      render();
    } else {
      // No page database in this view: a local ai_picks.json (preview) if there is one.
      fetch("scouting.json").then((r) => (r.ok ? r.json() : null)).then((docs) => { if (docs) setScout(docs); }).catch(() => {});
      fetch("ai_picks.json").then((r) => (r.ok ? r.json() : null)).then((docs) => {
        if (docs) setPicks(docs); else { state.picks.loaded = true; state.picks.noDb = true; render(); }
      }).catch(() => { state.picks.loaded = true; state.picks.noDb = true; render(); });
    }
  }
  boot();
})();
</script>
